<script>
'use strict';
/* ============================================================
   噬运军团 · v0.9（M5 §9：敌人详情 + 全队伤害排行）
   Phaser 4.2.1（jsdelivr CDN）+ 本地 PNG（assets/*-64.png 7 角色 64 级精灵表、assets/p2/ 田园背景/水晶塔/羊皮纸 UI、assets/effects/*-64.png 3 条特效）
   其余角色仍是代码在 canvas 上逐像素画的精灵（48x48，Boss 64x64，12 帧/角色）
   音效：WebAudio 合成 SFX + 循环 BGM，无外部音频
   ============================================================ */
if (!window.Phaser) { document.getElementById('fallback').style.display = 'block'; }

/* M5 P2：像素字体（Fusion Pixel 12px，中文，本地 woff2） */
const FONT = '"Fusion Pixel 12px", monospace';

/* ---------------- 统一调色板（21 色） ---------------- */
const PAL = {
  K:'#14101c', W:'#f2ead8', S:'#e8b98a', F:'#9c6b3f',
  G:'#c9a227', Y:'#e3cf9e', R:'#a83232', D:'#5e1f24',
  P:'#8b3fd9', V:'#4a1e6e', E:'#3fae6a', N:'#1f5c38',
  C:'#6fb7d9', B:'#5b5470', H:'#8a84a0', L:'#cfc9dd',
  O:'#d97b3f', T:'#7a4a2b', M:'#3a3348', Z:'#241f30'
};

/* ---------------- 像素画笔（在 canvas 上逐像素画） ---------------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(ctx, x, y, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, 1, 1); }
function rect(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function line(ctx, x0, y0, x1, y1, col) { // Bresenham 直线（画武器/法杖/弓弦用）
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) { px(ctx, x0, y0, col);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; } }
}
function tri(ctx, x0, y0, x1, y1, x2, y2, col) { // 扫描线填充三角形（画翅膀/披风/帽子用）
  const minY = Math.min(y0, y1, y2), maxY = Math.max(y0, y1, y2);
  for (let y = minY; y <= maxY; y++) {
    const xs = [];
    const edges = [[x0, y0, x1, y1], [x1, y1, x2, y2], [x2, y2, x0, y0]];
    for (const [ax, ay, bx, by] of edges) {
      if ((ay <= y && by > y) || (by <= y && ay > y)) xs.push(ax + (y - ay) * (bx - ax) / (by - ay));
    }
    if (xs.length >= 2) { const a = Math.min(...xs), b = Math.max(...xs); rect(ctx, Math.floor(a), y, Math.ceil(b) - Math.floor(a) + 1, 1, col); }
  }
}

/* ---------------- WebAudio 合成音效（无外部音频） ---------------- */
const SFX = {
  ctx: null, enabled: true,
  ac() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.enabled) return;
    const ac = this.ac(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, freq, delay) {
    if (!this.enabled) return;
    const ac = this.ac(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
    const g = ac.createGain(); g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },
  click()  { this.tone(700, 0.05, 'square', 0.06); },
  coin()   { this.tone(988, 0.07, 'sine', 0.10); this.tone(1319, 0.10, 'sine', 0.10, 0, 0.06); },
  hit()    { this.tone(180, 0.06, 'square', 0.12, 90); this.noise(0.05, 0.08, 900); },
  crit()   { this.tone(300, 0.12, 'square', 0.14, 620); this.noise(0.10, 0.16, 2400); },
  slash()  { this.noise(0.12, 0.16, 1800); this.tone(520, 0.08, 'sawtooth', 0.05, 240); },
  shoot()  { this.tone(820, 0.08, 'triangle', 0.11, 380); },
  orb()    { this.tone(500, 0.16, 'sine', 0.12, 940); this.tone(750, 0.12, 'sine', 0.06, 1200, 0.05); },
  pack()   { this.noise(0.25, 0.14, 700); this.tone(1200, 0.10, 'sine', 0.06, 1800, 0.12); },
  devour() { this.tone(420, 0.22, 'sine', 0.14, 80); this.tone(210, 0.10, 'square', 0.07, 90, 0.10); },
  starup() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.11, 0, i * 0.07)); },
  hexGold(){ [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.16, 'sine', 0.10, 0, i * 0.06)); },
  zap()    { this.tone(1400, 0.08, 'sawtooth', 0.08, 300); this.noise(0.06, 0.06, 3200); },
  boss()   { this.tone(65, 0.5, 'sine', 0.22, 40); this.noise(0.4, 0.18, 220); },
  slam()   { this.tone(70, 0.25, 'sine', 0.25, 38); this.noise(0.2, 0.2, 300); },
  win()    { [523, 659, 784, 1046, 1319].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.11, 0, i * 0.09)); },
  lose()   { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, 'sawtooth', 0.09, 0, i * 0.11)); }
};

/* ---------------- 存档与设置（localStorage） ----------------
   设置 + 最高波次 + 引导标志 + 对局快照（「继续」用，胜负后清除） */
const LS_SETTINGS = 'syjt_settings_v1';
const LS_BEST = 'syjt_best_v1';
const LS_TUT = 'syjt_tut_v1';
const LS_SAVE = 'syjt_save_v1';
const DEFAULT_SETTINGS = { sfx: true, music: true, shake: true, speed: 1 };
let SETTINGS = DEFAULT_SETTINGS;
try {
  const raw = localStorage.getItem(LS_SETTINGS);
  if (raw) SETTINGS = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
} catch (e) { /* 损坏的设置就用默认 */ }
function saveSettings() { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(SETTINGS)); } catch (e) {} }
function loadBest() { try { return parseInt(localStorage.getItem(LS_BEST) || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(w) { try { if (w > loadBest()) localStorage.setItem(LS_BEST, String(w)); } catch (e) {} }
function tutDone() { try { return localStorage.getItem(LS_TUT) === '1'; } catch (e) { return false; } }
function markTutDone() { try { localStorage.setItem(LS_TUT, '1'); } catch (e) {} }
function loadSave() { try { const raw = localStorage.getItem(LS_SAVE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(LS_SAVE); } catch (e) {} }
let CONTINUE_RUN = false; // 主菜单「继续」时置 true，GameScene.create 读档

/* ---------------- BGM：WebAudio 合成循环（无外部音频） ----------------
   游戏跑 60 FPS；BGM 用前瞻调度，每 200ms 排 0.4s 的音符 */
const BGM = {
  enabled: true, mode: 'normal', paused: false, timer: null, step: 0, nextTime: 0,
  CHORDS: [ // Am F C G，每小节 8 个八分音符
    { root: 110.00, arp: [220.00, 261.63, 329.63] },
    { root: 87.31, arp: [174.61, 220.00, 261.63] },
    { root: 130.81, arp: [261.63, 329.63, 392.00] },
    { root: 98.00, arp: [196.00, 246.94, 293.66] }
  ],
  start() {
    if (this.timer) return;
    this.nextTime = 0; this.step = 0;
    this.timer = setInterval(() => this.schedule(), 200);
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  setMode(m) { this.mode = m; },
  note(freq, t, dur, type, vol) {
    const ac = SFX.ac(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  schedule() {
    if (!this.enabled || this.paused) return;
    const ac = SFX.ac(); if (!ac || ac.state === 'suspended') return;
    if (this.nextTime < ac.currentTime) this.nextTime = ac.currentTime + 0.05;
    const boss = this.mode === 'boss';
    const spb = boss ? 60 / 116 / 2 : 60 / 72 / 2; // 八分音符时值
    while (this.nextTime < ac.currentTime + 0.4) {
      const bar = Math.floor(this.step / 8) % 4;
      const chord = this.CHORDS[bar];
      const s = this.step % 8;
      if (s === 0 || s === 4) this.note(chord.root, this.nextTime, spb * 1.8, 'sine', boss ? 0.075 : 0.055);
      if (boss && (s === 2 || s === 6)) this.note(chord.root / 2, this.nextTime, spb * 1.5, 'sawtooth', 0.03);
      this.note(chord.arp[s % 3], this.nextTime, spb * 0.9, 'triangle', boss ? 0.04 : 0.03);
      this.nextTime += spb; this.step++;
    }
  }
};

/* ---------------- 固定种子随机（战场装饰每局同图） ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   精灵图集 · 玩家三职业（每人独立手绘，32x32）
   帧：w0/w1/w2 走路三帧，atk 攻击，hit 受击，die 死亡
   ============================================================ */
/* ============================================================
   精灵图集 · 12 帧/角色（60 FPS 下走路 10 张/秒、攻击 12 张/秒轮换）
   帧：idle0/idle1 待机，w0/w1/w2/w3 走路，atk0/atk1/atk2 攻击，hit 受击，die 死亡，win 胜利
   画法：先在 32 格（Boss 48 格）逐像素画，再最近邻放大到 48x48（Boss 64x64）
   ============================================================ */
const FRAMES12 = ['idle0', 'idle1', 'w0', 'w1', 'w2', 'w3', 'atk0', 'atk1', 'atk2', 'hit', 'die', 'win'];
/* M5 P1：7 角色 64 级精灵表（assets/*-64.png，4x4，每帧 64x64，Boss 96x96）
   帧号：待机 0-3 / 走路 4-7 / 攻击 8-11 / 受击 12 / 死亡 13 / 胜利 14 / 施法 15 */
const SHEET64 = { idle0: 0, idle1: 1, idle2: 2, idle3: 3, w0: 4, w1: 5, w2: 6, w3: 7, atk0: 8, atk1: 9, atk2: 10, atk3: 11, hit: 12, die: 13, win: 14, cast: 15 };
const SHEET_KEY = { warrior: 'warrior64', archer: 'archer64', mage: 'mage64', slime: 'slime64', bat: 'bat64', boss: 'boss64' };
function sheetKeyFor(u) { // 精英史莱姆用自己的表；其余按 tex
  if (u.tex === 'slime' && u.isElite) return 'elite-slime64';
  return SHEET_KEY[u.tex] || null;
}
function buildChar(scene, key, drawFn, baseSize, finalSize) {
  for (const suf of FRAMES12) {
    if (scene.textures.exists(key + '_' + suf)) continue;
    const tmp = mkCanvas(baseSize, baseSize);
    drawFn(tmp.getContext('2d'), suf);
    const c = mkCanvas(finalSize, finalSize);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(tmp, 0, 0, finalSize, finalSize);
    scene.textures.addCanvas(key + '_' + suf, c);
  }
}

/* ---------------- 战士：钢甲 + 红缨盔 + 剑盾 ---------------- */
function drawWarrior(ctx, f) {
  const { R, H, L, W, S, K, G, B, T } = PAL;
  if (f === 'die') { // 倒地：头盔+身躯横躺，剑丢在一旁，X 眼
    rect(ctx, 5, 26, 8, 3, H); rect(ctx, 4, 25, 6, 1, R);
    px(ctx, 7, 27, K); px(ctx, 8, 28, K); px(ctx, 8, 27, K); px(ctx, 7, 28, K);
    rect(ctx, 12, 26, 12, 4, B); rect(ctx, 12, 26, 12, 1, G);
    rect(ctx, 24, 27, 6, 3, H);
    line(ctx, 18, 22, 28, 29, W); line(ctx, 19, 23, 29, 30, L);
    return;
  }
  const lean = f === 'hit' ? -1 : f === 'atk2' ? 1 : 0; // 受击后仰 / 追击前倾
  const blink = f === 'idle1'; // 待机第二帧：眨眼
  // 红缨
  rect(ctx, 14 + lean, 1, 4, 2, R); rect(ctx, 13 + lean, 3, 6, 1, R); rect(ctx, 12 + lean, 4, 8, 1, R);
  // 头盔 + 脸
  rect(ctx, 11 + lean, 5, 10, 3, H); rect(ctx, 10 + lean, 8, 12, 2, H);
  rect(ctx, 12 + lean, 9, 8, 3, S);
  if (!blink) { px(ctx, 14 + lean, 10, K); px(ctx, 17 + lean, 10, K); }
  // 肩甲（金边）
  rect(ctx, 7 + lean, 11, 6, 3, H); rect(ctx, 19 + lean, 11, 6, 3, H);
  rect(ctx, 7 + lean, 11, 6, 1, G); rect(ctx, 19 + lean, 11, 6, 1, G);
  // 躯干 + 金徽 + 腰带
  rect(ctx, 10 + lean, 14, 12, 6, B); rect(ctx, 15 + lean, 15, 2, 2, G);
  rect(ctx, 10 + lean, 20, 12, 2, T); rect(ctx, 15 + lean, 20, 2, 2, G);
  // 盾（左手）
  const shY = f === 'hit' ? 10 : 12;
  rect(ctx, 3 + lean, shY, 6, 10, B); rect(ctx, 4 + lean, shY + 1, 4, 8, L); rect(ctx, 5 + lean, shY + 4, 2, 2, G);
  // 腿（走路四帧 / 攻击三段 / 胜利站姿）
  if (f === 'w0') {
    rect(ctx, 11, 22, 4, 6, H); rect(ctx, 10, 28, 5, 2, K);
    rect(ctx, 17, 22, 4, 5, H); rect(ctx, 17, 27, 5, 2, K);
  } else if (f === 'w2') {
    rect(ctx, 11, 22, 4, 5, H); rect(ctx, 11, 27, 5, 2, K);
    rect(ctx, 17, 22, 4, 6, H); rect(ctx, 17, 28, 5, 2, K);
  } else if (f === 'w3') { // 交错步：双腿并拢过中线
    rect(ctx, 12, 22, 4, 6, H); rect(ctx, 11, 28, 5, 2, K);
    rect(ctx, 16, 22, 4, 6, H); rect(ctx, 16, 28, 5, 2, K);
  } else if (f === 'atk0') { // 蓄力下蹲
    rect(ctx, 10, 22, 4, 6, H); rect(ctx, 9, 28, 5, 2, K);
    rect(ctx, 18, 22, 4, 6, H); rect(ctx, 18, 28, 5, 2, K);
  } else if (f === 'atk1') { // 弓步劈砍
    rect(ctx, 9, 22, 4, 7, H); rect(ctx, 8, 29, 5, 2, K);
    rect(ctx, 18, 22, 4, 6, H); rect(ctx, 18, 28, 5, 2, K);
  } else if (f === 'atk2') { // 追击前踏
    rect(ctx, 8, 22, 4, 7, H); rect(ctx, 7, 29, 5, 2, K);
    rect(ctx, 19, 22, 4, 5, H); rect(ctx, 19, 27, 5, 2, K);
  } else if (f === 'win') { // 胜利叉开站
    rect(ctx, 9, 22, 4, 7, H); rect(ctx, 8, 29, 5, 2, K);
    rect(ctx, 19, 22, 4, 7, H); rect(ctx, 19, 29, 5, 2, K);
  } else {
    rect(ctx, 11, 22, 4, 7, H); rect(ctx, 10, 29, 5, 2, K);
    rect(ctx, 17, 22, 4, 7, H); rect(ctx, 17, 29, 5, 2, K);
  }
  // 剑（右手）
  if (f === 'atk0') { // 蓄力：剑收回左肩
    line(ctx, 20, 14, 10, 4, W); line(ctx, 21, 15, 11, 5, L);
    rect(ctx, 19, 13, 4, 2, G);
  } else if (f === 'atk1') { // 高举斜劈
    line(ctx, 23, 15, 30, 4, W); line(ctx, 24, 16, 31, 5, L);
    rect(ctx, 21, 14, 4, 2, G);
  } else if (f === 'atk2') { // 追击：剑向前下方
    line(ctx, 24, 14, 31, 26, W); line(ctx, 25, 15, 31, 27, L);
    rect(ctx, 22, 13, 4, 2, G);
  } else if (f === 'win') { // 胜利：剑举过头顶
    rect(ctx, 24, 0, 3, 12, W); px(ctx, 25, 0, W);
    rect(ctx, 23, 12, 5, 1, G); rect(ctx, 24, 13, 3, 2, T);
  } else {
    rect(ctx, 24, 6, 3, 11, W); px(ctx, 25, 5, W); px(ctx, 24, 5, L); px(ctx, 26, 5, L);
    rect(ctx, 23, 17, 5, 1, G); rect(ctx, 24, 18, 3, 2, T);
  }
  if (f === 'hit') { // 眩晕星
    px(ctx, 8, 6, PAL.Y); px(ctx, 24, 4, PAL.Y); px(ctx, 27, 8, PAL.Y);
  }
  if (f === 'win') { // 胜利金星
    px(ctx, 8, 6, PAL.Y); px(ctx, 27, 4, PAL.Y); px(ctx, 5, 12, PAL.Y); px(ctx, 28, 10, PAL.Y);
  }
}

/* ---------------- 弓手：绿兜帽 + 皮甲 + 长弓 ---------------- */
function drawArcher(ctx, f) {
  const { E, N, W, K, T, Y, L, S } = PAL;
  if (f === 'die') { // 倒地，弓丢在一旁
    rect(ctx, 5, 26, 8, 3, E); rect(ctx, 12, 26, 12, 4, E); rect(ctx, 24, 27, 6, 3, T);
    px(ctx, 7, 27, K); px(ctx, 8, 28, K); px(ctx, 8, 27, K); px(ctx, 7, 28, K);
    line(ctx, 18, 22, 28, 30, T); line(ctx, 18, 22, 28, 30, W);
    return;
  }
  const lean = f === 'hit' ? -1 : f === 'atk2' ? 1 : 0;
  const hoodShift = f === 'hit' ? -2 : 0; // 受击兜帽歪向一边
  const blink = f === 'idle1';
  // 尖顶兜帽
  rect(ctx, 13 + hoodShift, 2, 6, 2, E); rect(ctx, 12 + hoodShift, 4, 8, 2, E); rect(ctx, 11 + hoodShift, 6, 10, 3, E);
  // 阴影脸 + 发光眼（待机第二帧眨眼）
  rect(ctx, 13 + lean, 9, 6, 3, N);
  if (!blink) { px(ctx, 14 + lean, 10, W); px(ctx, 17 + lean, 10, W); }
  // 上衣 + 斜挎带 + 箭袋
  rect(ctx, 11 + lean, 12, 10, 7, E);
  line(ctx, 12 + lean, 13, 20 + lean, 18, T);
  line(ctx, 19 + lean, 11, 23 + lean, 17, T);
  px(ctx, 22 + lean, 10, Y); px(ctx, 23 + lean, 11, Y); px(ctx, 24 + lean, 12, Y);
  rect(ctx, 11 + lean, 19, 10, 2, T);
  // 腿
  if (f === 'w0') {
    rect(ctx, 11, 22, 4, 6, T); rect(ctx, 10, 28, 5, 2, K);
    rect(ctx, 17, 22, 4, 5, T); rect(ctx, 17, 27, 5, 2, K);
  } else if (f === 'w2') {

  rect(ctx, 4, 4, 8, 8, PAL.P); rect(ctx, 6, 6, 4, 4, PAL.W);
}
function drawSparkTex(ctx) { // 12x12 四角星火花
  rect(ctx, 5, 0, 2, 12, PAL.W); rect(ctx, 0, 5, 12, 2, PAL.W);
  px(ctx, 3, 3, PAL.Y); px(ctx, 8, 3, PAL.Y); px(ctx, 3, 8, PAL.Y); px(ctx, 8, 8, PAL.Y);
  px(ctx, 5, 5, PAL.Y); px(ctx, 6, 6, PAL.Y);
}
function drawRelicTex(ctx, id) { // 16x16 遗物小图标（逐像素画，颜色各不相同）
  const { K, W, G, Y, R, O, C, L, E, N, P, V, B } = PAL;
  if (id === 'crown') { // 金色小王冠
    rect(ctx, 2, 5, 3, 6, G); rect(ctx, 6, 3, 4, 8, G); rect(ctx, 11, 5, 3, 6, G);
    rect(ctx, 3, 10, 10, 3, G); rect(ctx, 3, 13, 10, 1, Y);
    px(ctx, 7, 7, R); px(ctx, 8, 7, R); px(ctx, 4, 8, Y); px(ctx, 11, 8, Y);
  } else if (id === 'bell') { // 红铃铛
    px(ctx, 7, 2, O); px(ctx, 8, 2, O); px(ctx, 7, 3, O); px(ctx, 8, 3, O);
    rect(ctx, 5, 4, 6, 7, R); rect(ctx, 4, 11, 8, 2, R);
    px(ctx, 6, 6, W); px(ctx, 7, 13, Y); px(ctx, 8, 13, Y);
  } else if (id === 'mirror') { // 蓝色小镜子
    rect(ctx, 4, 2, 8, 8, C); rect(ctx, 5, 3, 6, 6, L);
    px(ctx, 6, 4, C); px(ctx, 9, 6, C); px(ctx, 7, 7, C);
    rect(ctx, 7, 10, 2, 4, B); rect(ctx, 6, 14, 4, 1, B);
  } else if (id === 'golden') { // 金色骰子（5 点）
    rect(ctx, 3, 3, 10, 10, Y);
    rect(ctx, 3, 3, 10, 1, G); rect(ctx, 3, 12, 10, 1, G); rect(ctx, 3, 3, 1, 10, G); rect(ctx, 12, 3, 1, 10, G);
    px(ctx, 5, 5, K); px(ctx, 10, 5, K); px(ctx, 7, 8, K); px(ctx, 5, 10, K); px(ctx, 10, 10, K);
  } else if (id === 'beads') { // 两颗相连的珠子
    rect(ctx, 1, 7, 14, 1, N); // 串绳
    rect(ctx, 2, 5, 6, 6, E); rect(ctx, 8, 5, 6, 6, E);
    px(ctx, 3, 6, W); px(ctx, 9, 6, W);
    px(ctx, 2, 5, N); px(ctx, 7, 5, N); px(ctx, 8, 5, N); px(ctx, 13, 5, N);
    px(ctx, 2, 10, N); px(ctx, 7, 10, N); px(ctx, 8, 10, N); px(ctx, 13, 10, N);
  } else if (id === 'fate') { // 三颗小骰子叠放
    rect(ctx, 5, 2, 6, 6, P);
    rect(ctx, 5, 2, 6, 1, V); rect(ctx, 5, 7, 6, 1, V); rect(ctx, 5, 2, 1, 6, V); rect(ctx, 10, 2, 1, 6, V);
    px(ctx, 6, 4, W); px(ctx, 9, 4, W); px(ctx, 7, 6, W);
    rect(ctx, 2, 9, 6, 6, P); rect(ctx, 8, 9, 6, 6, P);
    rect(ctx, 2, 14, 6, 1, V); rect(ctx, 8, 14, 6, 1, V);
    px(ctx, 4, 11, W); px(ctx, 10, 11, W); px(ctx, 12, 13, W);
  }
}

function buildAllTextures(scene) {
  buildChar(scene, 'warrior', drawWarrior, 32, 48);
  buildChar(scene, 'archer', drawArcher, 32, 48);
  buildChar(scene, 'mage', drawMage, 32, 48);
  buildChar(scene, 'slime', drawSlime, 32, 48);
  buildChar(scene, 'bat', drawBat, 32, 48);
  buildChar(scene, 'boss', drawBoss, 48, 64);
  if (!scene.textures.exists('tower')) {
    const tw = mkCanvas(64, 64); drawTower(tw.getContext('2d')); scene.textures.addCanvas('tower', tw);
  }
  if (!scene.textures.exists('arrow')) {
    const ar = mkCanvas(16, 8); drawArrowTex(ar.getContext('2d')); scene.textures.addCanvas('arrow', ar);
  }
  if (!scene.textures.exists('orb')) {
    const ob = mkCanvas(16, 16); drawOrbTex(ob.getContext('2d')); scene.textures.addCanvas('orb', ob);
  }
  if (!scene.textures.exists('spark')) {
    const sp = mkCanvas(12, 12); drawSparkTex(sp.getContext('2d')); scene.textures.addCanvas('spark', sp);
  }
  for (const r of RELICS) { // M4：遗物小图标 16x16
    if (!scene.textures.exists(r.tex)) {
      const cv = mkCanvas(16, 16); drawRelicTex(cv.getContext('2d'), r.id); scene.textures.addCanvas(r.tex, cv);
    }
  }
}

function recompute(u) { // 星级 / 等级 / 海克斯 / 附魔变化后重算
  const c = CLASSES[u.cls];
  const r = RARITY.find(x => x.key === u.rarity) || RARITY[0];
  const starMult = Math.pow(1.5, u.star - 1);
  const lvlMult = 1 + 0.08 * (u.level - 1);
  const atkBonus = u.cls === 'warrior' ? (G.buffs.warriorAtk || 0) : u.cls === 'mage' ? (G.buffs.mageAtk || 0) : 0;
  const aspdBonus = u.cls === 'archer' ? (G.buffs.archerAspd || 0) : 0;
  const colossus = G.buffs.colossus ? 1.35 : 1; // 巨像：生命 +35%
  const newMax = Math.round(c.hp * r.mult * starMult * lvlMult * colossus) + (u.soulBonus || 0); // 吞噬灵魂叠加
  const ratio = u.hp / Math.max(1, u.maxHp);
  u.maxHp = newMax; u.hp = Math.max(1, Math.round(newMax * ratio));
  u.atk = Math.round(c.atk * r.mult * starMult * lvlMult * (1 + atkBonus) * 10) / 10;
  u.aspd = c.aspd * (1 + aspdBonus) * (u.ench === 'swift' ? 1.25 : 1); // 疾风附魔：攻速 +25%
  u.crit = c.crit + (u.ench === 'crit' ? 0.15 : 0); // 暴击附魔：暴击率 +15%
}
function weightedPick(table) { // table: [[key, weight], ...]
  let total = 0; for (const [, w] of table) total += w;
  let roll = Math.random() * total;
  for (const [k, w] of table) { roll -= w; if (roll <= 0) return k; }
  return table[table.length - 1][0];
}
function cellCenter(c, r) { return { x: GRID.x + c * GRID.cw + GRID.cw / 2, y: GRID.y + r * GRID.ch + GRID.ch / 2 }; }
function cellAt(x, y) {
  const c = Math.floor((x - GRID.x) / GRID.cw), r = Math.floor((y - GRID.y) / GRID.ch);
  if (c < 0 || c >= GRID.cols || r < 0 || r >= GRID.rows) return null;
  return { c, r };
}

/* ---------------- 存档快照（继续 = 恢复本局，非继承金币） ---------------- */
function snapUnit(u) {
  return { cls: u.cls, rarity: u.rarity, star: u.star, starProg: u.starProg, level: u.level, xp: u.xp, devourCount: u.devourCount, cell: u.cell, ench: u.ench || null, reinforce: u.reinforce || 0, soulBonus: u.soulBonus || 0, hp: u.hp, alive: u.alive !== false };
}
function restoreUnit(s) {
  const u = makeUnit(s.cls, s.rarity, 'player');
  u.star = s.star; u.starProg = s.starProg || 0; u.level = s.level; u.xp = s.xp || 0; u.devourCount = s.devourCount || 0;
  u.ench = s.ench || null; u.reinforce = s.reinforce || 0; u.soulBonus = s.soulBonus || 0;
  recompute(u);
  // 读档恢复真实血量（休整复活到 50% 血、残血都不许读档变满血）；旧存档没 hp 字段按满血处理
  if (s.hp !== undefined) u.hp = Math.max(0, Math.min(u.maxHp, Math.round(s.hp)));
  if (s.alive === false) u.alive = false;
  return u;
}

/* ---------------- 菜单共用组件（主菜单 / 暂停 / 结算共用） ---------------- */
function menuBtn(scene, x, y, w, h, label, cb, fontSize) {
  // M5 P2：木按钮（深棕底 + 米白字 + 金边），用于主菜单和设置/玩法说明的返回按钮
  const bg = scene.add.rectangle(x, y, w, h, 0x6e4f3a).setOrigin(0.5).setInteractive().setStrokeStyle(2, 0xc9a227);
  const txt = scene.add.text(x, y, label, { fontSize: (fontSize || 18) + 'px', color: '#f2ead8', fontFamily: FONT, fontStyle: 'bold' }).setOrigin(0.5);
  bg.on('pointerover', () => bg.setFillStyle(0x8a6d4a));
  bg.on('pointerout', () => bg.setFillStyle(0x6e4f3a));
  bg.on('pointerdown', () => { SFX.click(); cb(); });
  return { bg, txt };
}

function createSettingsOverlay(scene, depth) {
  const c = scene.add.container(0, 0).setDepth(depth || 60).setVisible(false);
  c.add(scene.add.rectangle(0, 0, GW, GH, 0x000000, 0.72).setOrigin(0, 0));
  const panel = scene.textures.exists('panel-520x420')
    ? scene.add.image(GW / 2, GH / 2, 'panel-520x420')
    : scene.add.rectangle(GW / 2, GH / 2, 520, 420, 0x241f30).setStrokeStyle(2, 0xc9a227);
  const title = scene.add.text(GW / 2, 180, '设置', { fontSize: '30px', color: '#3a2a1c', fontFamily: FONT, fontStyle: 'bold' }).setOrigin(0.5);
  c.add([panel, title]);
  const rows = [];
  const defs = [
    { key: 'sfx', label: '音效', fmt: v => (v ? '开' : '关'), apply: () => { SFX.enabled = SETTINGS.sfx; } },
    { key: 'music', label: '音乐', fmt: v => (v ? '开' : '关'), apply: () => { BGM.enabled = SETTINGS.music; if (SETTINGS.music) BGM.start(); } },
    { key: 'shake', label: '震屏', fmt: v => (v ? '开' : '关'), apply: () => {} },
    { key: 'speed', label: '默认倍速', fmt: v => v + 'x', apply: () => {} }
  ];
  defs.forEach((d, i) => {
    const y = 250 + i * 56;
    const lab = scene.add.text(GW / 2 - 180, y, d.label, { fontSize: '18px', color: '#3a2a1c', fontFamily: FONT }).setOrigin(0, 0.5);
    const val = scene.add.text(GW / 2 + 180, y, '', { fontSize: '18px', color: '#8a6d1f', fontFamily: FONT, fontStyle: 'bold' }).setOrigin(1, 0.5);
    const hit = scene.add.rectangle(GW / 2 + 130, y, 110, 40, 0x6e4f3a).setInteractive().setStrokeStyle(1, 0xc9a227);
    hit.on('pointerdown', () => {
      if (d.key === 'speed') SETTINGS.speed = SETTINGS.speed === 1 ? 2 : 1;
      else SETTINGS[d.key] = !SETTINGS[d.key];
      saveSettings(); d.apply(); refresh();
    });
    c.add([lab, hit, val]);
    rows.push({ d, val });
  });
  function refresh() { rows.forEach(r => r.val.setText(r.d.fmt(SETTINGS[r.d.key]))); }
  const back = menuBtn(scene, GW / 2, 500, 160, 44, '返回', () => c.setVisible(false), 17);
  c.add([back.bg, back.txt]);
  c._refresh = refresh;
  refresh();
  return c;
}

    { tex: 'archer64', head: '2. 点开始战斗', body: '布好阵就开打，战斗全自动' },
    { tex: 'mage64', head: '3. 海克斯三选一', body: '每打赢第 3 波，挑一个强化' },
    { tex: 'slime64', head: '4. 吞噬进化', body: '把棋子拖到场上同伴身上吞噬升星' },
    { tex: 'boss64', head: '5. 守住水晶塔', body: '塔破了就输了，撑过 5 波获胜' }

  steps.forEach((s, i) => {

    const icon = scene.add.image(GW / 2 - 280, y, s.tex, 0).setScale(s.tex === 'boss64' ? 0.7 : 1.05);

  const back = menuBtn(scene, GW / 2, 600, 160, 44, '返回', () => c.setVisible(false), 17);
  c.add([back.bg, back.txt]);
  return c;

class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }
  preload() { // M5 P2：7 角色 64 级精灵表 + 田园背景 + 水晶塔 + 羊皮纸 UI（加载失败时各使用点回退旧路线）
    this.load.spritesheet('warrior64', 'assets/warrior-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('archer64', 'assets/archer-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('mage64', 'assets/mage-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('slime64', 'assets/slime-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('elite-slime64', 'assets/elite-slime-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('bat64', 'assets/bat-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('boss64', 'assets/boss-64.png', { frameWidth: 96, frameHeight: 96 });
    this.load.image('fieldbg', 'assets/p2/fieldbg-pastoral.png');
    this.load.spritesheet('tower64', 'assets/p2/tower-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('fx-slime64', 'assets/effects/slime-splat-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('fx-bat64', 'assets/effects/bat-swipe-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.image('fx-bone64', 'assets/effects/bone-spike-64.png');
    // M5 P2：羊皮纸 UI 套件
    this.load.image('dice-tray', 'assets/p2/dice-tray.png');
    this.load.image('dice-btn', 'assets/p2/dice-btn.png');
    this.load.image('card-parchment', 'assets/p2/card-parchment.png');
    this.load.image('scroll', 'assets/p2/scroll.png');
    this.load.image('btn-parchment', 'assets/p2/button-parchment.png');
    this.load.image('bench-cell', 'assets/p2/bench-cell.png');
    this.load.image('topbar', 'assets/p2/topbar.png');
    this.load.image('icon-coin', 'assets/p2/icon-coin.png');
    this.load.image('icon-heart', 'assets/p2/icon-heart.png');
    this.load.image('icon-skull', 'assets/p2/icon-skull.png');
    this.load.image('icon-gem', 'assets/p2/icon-gem.png');
    this.load.image('panel-440x380', 'assets/p2/panel-440x380.png');
    this.load.image('panel-360x240', 'assets/p2/panel-360x240.png');
    this.load.image('panel-680x500', 'assets/p2/panel-680x500.png');
    this.load.image('panel-520x420', 'assets/p2/panel-520x420.png');
    this.load.image('panel-420x420', 'assets/p2/panel-420x420.png');
    this.load.image('panel-560x96', 'assets/p2/panel-560x96.png');
    this.load.image('field-frame', 'assets/p2/field-frame.png');
  }
  create() {
    buildAllTextures(this);
    this.buildTopBar();
    this.buildField();
    this.buildBottom();
    this.buildOverlays();
    if (CONTINUE_RUN) { CONTINUE_RUN = false; this.loadSave(); }
    else this.resetGame();
    // 点按必须立刻开始拖拽，否则轻点棋子到不了 dragend，强化面板永远打不开
    this.input.dragDistanceThreshold = 0;
    this.input.dragTimeThreshold = 0;
    this.input.on('dragstart', (p, o) => this.onDragStart(p, o));
    this.input.on('drag', (p, o, x, y) => this.onDrag(p, o, x, y));
    this.input.on('dragend', (p, o) => this.onDragEnd(p, o));
    this.input.on('pointerdown', () => { SFX.ac(); if (SETTINGS.music) BGM.start(); });
    this.scale.on('resize', () => {});
  }
  update(time, delta) { this.tick(time, delta); }
  /* M5 P1：64 级精灵表 helpers（7 角色全用表；加载失败时回退旧代码纹理） */
  useSheet(u) { const k = sheetKeyFor(u); return k && this.textures.exists(k) ? k : null; }
  setUnitFrame(u, suf) { // suf: 'idle0'|'w2'|'atk1'|'hit'|'die'|'win'；返回是否真的换了帧
    if (!u.sprite) return false;
    const key = this.useSheet(u);
    if (key) {
      const f = SHEET64[suf];
      if (u._sheetFrame !== f || u.sprite.texture.key !== key) { u._sheetFrame = f; u.sprite.setTexture(key, f); return true; }
      return false;
    }
    const key2 = u.tex + '_' + suf;
    if (u.sprite.texture.key !== key2) { u.sprite.setTexture(key2); return true; }
    return false;
  }
}

Object.assign(GameScene.prototype, {
  mkBtn(x, y, w, h, label, cb, fontSize, opts) {
    opts = opts || {};
    // M5 P2：图片按钮模式（opts.img，羊皮纸底 + 深棕字，hover 用 tint 加亮）
    if (opts.img && this.textures.exists(opts.img)) {
      const bg = this.add.image(x + w / 2, y + h / 2, opts.img).setDisplaySize(w, h).setInteractive();
      bg.on('pointerover', () => bg.setTint(0xfff2c8));
      bg.on('pointerout', () => bg.clearTint());
      bg.on('pointerdown', () => { SFX.click(); cb(); });
      const txt = this.add.text(x + w / 2, y + h / 2, label, {
        fontSize: (fontSize || 15) + 'px', color: '#3a2a1c', fontFamily: FONT, fontStyle: 'bold'
      }).setOrigin(0.5);
      return { bg, txt };
    }
    const fill = opts.fill || 0x3a3348;
    const bg = this.add.rectangle(x, y, w, h, fill).setOrigin(0, 0).setInteractive().setStrokeStyle(1, 0xc9a227);
    const txt = this.add.text(x + w / 2, y + h / 2, label, {
      fontSize: (fontSize || 15) + 'px', color: '#f2ead8', fontFamily: FONT, fontStyle: 'bold'

    this.add.text(16, 24, '噬运军团', { fontSize: '20px', color: '#c9a227', fontFamily: FONT, fontStyle: 'bold' }).setOrigin(0, 0.5);
    this.ui = {};

    const sp = this.mkBtn(1008, 8, 56, 32, '1x', () => {

      SFX.enabled = SETTINGS.sfx;
      this.ui.muteTxt.setText(SFX.enabled ? '音效开' : '音效关');
    }, 13);
    this.ui.muteTxt = mu.txt;
    this.mkBtn(1136, 8, 56, 32, '暂停', () => this.pauseGame(), 13);
    this.mkBtn(1200, 8, 56, 32, '？', () => { this.ui.howto.setVisible(true); }, 16);

  setCellHi(cell, on) { // 拖拽格子高亮：有背景图时用半透明绿罩，无背景时用旧棋盘色
    const rc = this.cellRects[cell.c][cell.r];
    if (this._hasBg) { rc.setFillStyle(0x3fae6a); rc.setAlpha(on ? 0.45 : 0); }
    else rc.setFillStyle(on ? 0x3fae6a : ((cell.c + cell.r) % 2 === 0 ? 0x245c39 : 0x1e5233));
  },

  buildField() {
    // M5 P2：战场背景改用田园全景（assets/p2/fieldbg-pastoral.png）；加载失败时回退旧的色块棋盘
    const hasBg = this.textures.exists('fieldbg');
    this._hasBg = hasBg;
    if (hasBg) this.add.image(0, 0, 'fieldbg').setOrigin(0, 0).setDepth(-1);
    if (this.textures.exists('field-frame')) this.add.image(16, 64, 'field-frame').setOrigin(0, 0).setDepth(0);
    else this.add.rectangle(16, 64, 1248, 416, 0x1e5233).setOrigin(0, 0);
    this.cellRects = [];
    for (let c = 0; c < GRID.cols; c++) {
      this.cellRects[c] = [];
      for (let r = 0; r < GRID.rows; r++) {
        const col = (c + r) % 2 === 0 ? 0x245c39 : 0x1e5233;
        const rect = this.add.rectangle(GRID.x + c * GRID.cw, GRID.y + r * GRID.ch, GRID.cw - 2, GRID.ch - 2, col).setOrigin(0, 0).setDepth(0);
        if (hasBg) rect.setAlpha(0); // 背景图已画好草地，格子只留作拖拽高亮层
        this.cellRects[c][r] = rect;
      }
    }
    if (!hasBg) { // 旧色块棋盘装饰（背景图已包含草地/栅栏/旗帜/裂缝，跳过）
    const rng = mulberry32(20261124);
    for (let c = 0; c < GRID.cols; c++) {
      for (let r = 0; r < GRID.rows; r++) {
        const roll = rng();
        const bx = GRID.x + c * GRID.cw, by = GRID.y + r * GRID.ch;
        if (roll < 0.30) { // 小草
          const gx = bx + 8 + Math.floor(rng() * 70), gy = by + 8 + Math.floor(rng() * 70);
          this.add.rectangle(gx, gy, 2, 8, 0x3fae6a).setOrigin(0, 0).setDepth(0);
          this.add.rectangle(gx + 4, gy + 2, 2, 6, 0x3fae6a).setOrigin(0, 0).setDepth(0);
        } else if (roll < 0.38) { // 石块
          const sx = bx + 12 + Math.floor(rng() * 60), sy = by + 12 + Math.floor(rng() * 60);
          this.add.rectangle(sx, sy, 10, 7, 0x8a84a0).setOrigin(0, 0).setDepth(0);
          this.add.rectangle(sx + 2, sy, 6, 3, 0xcfc9dd).setOrigin(0, 0).setDepth(0);
        } else if (roll < 0.43) { // 小花
          const fx = bx + 12 + Math.floor(rng() * 60), fy = by + 12 + Math.floor(rng() * 60);
          this.add.circle(fx, fy, 3, 0xd97b3f).setDepth(0);
          this.add.circle(fx, fy, 1, 0xe3cf9e).setDepth(0);
        }
      }
    }
    this.add.rectangle(16, 64, 1248, 416).setOrigin(0, 0).setStrokeStyle(2, 0x8a6d1f).setDepth(0);
    // 我方木栅栏 + 纵栏（左沿）
    for (let y = 80; y <= 464; y += 48) {
      this.add.rectangle(138, y, 8, 26, 0x7a4a2b).setOrigin(0, 0).setDepth(1);
      this.add.rectangle(138, y, 8, 3, 0x9c6b3f).setOrigin(0, 0).setDepth(1);
    }
    this.add.rectangle(136, 76, 4, 392, 0x9c6b3f).setOrigin(0, 0).setDepth(1);
    // 旗帜（塔后，迎风摆动）
    this.add.rectangle(60, 120, 4, 60, 0x7a4a2b).setOrigin(0, 0).setDepth(1);
    const flag = this.add.triangle(64, 120, 0, 0, 34, 8, 0, 16, 0xc9a227).setOrigin(0, 0).setDepth(1);
    this.tweens.add({ targets: flag, scaleX: 0.85, duration: 500, yoyo: true, repeat: -1 });
    // 敌方裂缝（右沿，敌人从这里出来）
    this.add.rectangle(1200, 64, 64, 416, 0x14101c).setOrigin(0, 0).setDepth(0);
    this.add.rectangle(1196, 64, 4, 416, 0x4a1e6e).setOrigin(0, 0).setDepth(1);
    for (let i = 0; i < 6; i++) {
      const ry = 90 + i * 62 + Math.floor(rng() * 20);
      this.add.triangle(1200, ry, 0, 0, 26, 10, 0, 22, 0x241f30).setOrigin(0, 0).setDepth(1);
      this.add.circle(1216, ry + 10, 3, 0x8b3fd9).setDepth(1).setAlpha(0.7);
    }
    } // end if (!hasBg)
    // 波次氛围罩（白天 / 黄昏 / Boss 夜）
    this.atmo = this.add.rectangle(16, 64, 1248, 416, 0x000000, 0).setOrigin(0, 0).setDepth(1);
    this.fogBlobs = [];
    for (let i = 0; i < 5; i++) {
      const f = this.add.circle(200 + i * 220, 160 + (i % 2) * 140, 70, 0x8b3fd9, 0.05).setDepth(1).setVisible(false);
      this.tweens.add({ targets: f, x: f.x + 60, duration: 6000 + i * 900, yoyo: true, repeat: -1 });
      this.fogBlobs.push(f);
    }
    // 塔（左端）+ 呼吸光晕 — M5 P2：水晶塔精灵表（tower-64），血条做进塔顶
    this.towerHalo = this.add.circle(TOWER_POS.x, TOWER_POS.y - 6, 46, 0x6fb7d9, 0.16).setDepth(1);

  /* ---------- 单位可视化 ---------- */
  spawnUnitSprite(u) {
    const sheet = this.useSheet(u);
    const img = sheet
      ? this.add.image(u.x, u.y, sheet, 0).setScale(this.unitScale(u)).setDepth(3)
      : this.add.image(u.x, u.y, u.tex + '_idle0').setScale(this.unitScale(u)).setDepth(3);
    u._sheetFrame = sheet ? 0 : -1;
    if (u.side === 'player') img.setInteractive({ draggable: true }); // 只有玩家棋子能拖；敌人不可拖
    else img.setInteractive({ useHandCursor: true }).on('pointerdown', () => { if (G.phase === 'battle' && !G.paused && u.alive) this.showEnemyDetail(u); }); // M5 §9：战斗中点敌人看详情
    img._unit = u;
    u.sprite = img;
    u.hpBg = this.add.rectangle(u.x, u.y - 54, 56, 6, 0x5e1f24).setDepth(4).setVisible(false);
    u.hpFg = this.add.rectangle(u.x - 28, u.y - 54, 56, 6, 0x3fae6a).setOrigin(0, 0.5).setDepth(4).setVisible(false);
    u.devTxt = this.add.text(u.x, u.y + 52, '', { fontSize: '11px', color: '#c9a227', fontFamily: FONT }).setOrigin(0.5, 0).setDepth(4).setVisible(false);
    u.starImgs = [];
    return img;
  },
  refreshStars(u) {
    for (const s of u.starImgs) s.destroy();
    u.starImgs = [];
    if (u.side !== 'player' || !u.sprite) return;
    for (let i = 0; i < u.star; i++) {
      const s = this.add.image(u.x - (u.star - 1) * 7 + i * 14, u.y - 66, 'spark').setScale(0.9).setDepth(4).setTint(0xc9a227);
      u.starImgs.push(s);
    }
  },
  unitScale(u) { // 巨像：场上体型 +35%；备战席不放大（52 格装不下）
    if (this.useSheet(u)) {
      // M5 P1：64 级帧 64x64（Boss 96x96）；场上 96px、备战 48px，显示尺寸和旧版一致
      const f = u.tex === 'boss' ? (64 / 96) : 0.75;
      if (u.side === 'enemy') return u.baseScale * f;
      return u.cell ? u.baseScale * (G.buffs.colossus ? 1.35 : 1) * f : f;
    }
    if (u.side === 'enemy') return u.baseScale;
    if (!u.cell) return 1.1;
    return u.baseScale * (G.buffs.colossus ? 1.35 : 1);
  },
  refreshEnchVisual(u) { // 附魔光环 + 头顶元素角标
    if (u.glow && u.glow.active) u.glow.destroy();
    if (u.enchImg && u.enchImg.active) u.enchImg.destroy();
    u.glow = null; u.enchImg = null;
    if (!u.ench || !u.sprite) return;
    const tint = ENCHANT_TINT[u.ench];
    u.glow = this.add.circle(u.x, u.y, 26, tint, 0.16).setDepth(2);
    u.enchImg = this.add.image(u.x + (u.star - 1) * 7 + 16, u.y - 66, 'spark').setScale(0.9).setDepth(4).setTint(tint);
  },
  updateDevText(u) {
    if (!u.devTxt) return;
    if (u.devourCount > 0) {
      u.devTxt.setText('吞 ' + u.devourCount + '/5' + (G.buffs.freeDevour ? '（噬主：不占槽）' : ''));
      u.devTxt.setVisible(u.cell !== null);
    } else u.devTxt.setVisible(false);
  },
  destroyUnitVisual(u) {
    if (u.sprite && u.sprite.active) { this.tweens.killTweensOf(u.sprite); u.sprite.destroy(); }
    if (u.hpBg && u.hpBg.active) u.hpBg.destroy();
    if (u.hpFg && u.hpFg.active) u.hpFg.destroy();
    if (u.devTxt && u.devTxt.active) u.devTxt.destroy();
    for (const s of u.starImgs) if (s.active) s.destroy();
    if (u.glow && u.glow.active) u.glow.destroy();
    if (u.enchImg && u.enchImg.active) u.enchImg.destroy();
    if (u.frozenFx && u.frozenFx.active) u.frozenFx.destroy();
    u.sprite = null; u.hpBg = null; u.hpFg = null; u.devTxt = null; u.starImgs = [];
    u.glow = null; u.enchImg = null; u.frozenFx = null;
  },
  syncUnitVisual(u) {
    if (!u.sprite) return;
    u.sprite.setPosition(u.x, u.y);
    const onField = u.cell !== null && u.side === 'player';
    if (u.hpBg) u.hpBg.setVisible(onField).setPosition(u.x, u.y - 54);
    if (u.hpFg) u.hpFg.setVisible(onField).setPosition(u.x - 28, u.y - 54);
    if (u.hpFg) u.hpFg.width = Math.max(0, 56 * u.hp / u.maxHp);
    for (let i = 0; i < u.starImgs.length; i++) {
      u.starImgs[i].setVisible(onField).setPosition(u.x - (u.star - 1) * 7 + i * 14, u.y - 66);
    }
    if (u.glow) u.glow.setVisible(u.side === 'player').setPosition(u.x, u.y);
    if (u.enchImg) u.enchImg.setVisible(onField).setPosition(u.x + (u.star - 1) * 7 + 16, u.y - 66);
    this.updateDevText(u);
    if (u.devTxt) u.devTxt.setPosition(u.x, u.y + 52);
  },
