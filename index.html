<script>
'use strict';
/* ============================================================
   噬运军团 · v0.3（M2：附魔 + 强化 + 海克斯扩充）
   Phaser 4.2.1（jsdelivr CDN，唯一外部资源）
   所有美术：代码在 canvas 上逐像素画的精灵（48x48，Boss 64x64，12 帧/角色）
   音效：WebAudio 合成 SFX + 循环 BGM，无外部音频
   ============================================================ */
if (!window.Phaser) { document.getElementById('fallback').style.display = 'block'; }

/* ---------------- 统一调色板（21 色） ---------------- */
const PAL = {
  K:'#14101c', W:'#f2ead8', S:'#e8b98a', F:'#9c6b3f',
  G:'#c9a227', Y:'#e3cf9e', R:'#a83232', D:'#5e1f24',
  P:'#8b3fd9', V:'#4a1e6e', E:'#3fae6a', N:'#1f5c38',
  C:'#6fb7d9', B:'#5b5470', H:'#8a84a0', L:'#cfc9dd',
  O:'#d97b3f', T:'#7a4a2b', M:'#3a3348', Z:'#241f30'
};

/* ---------------- 像素画笔（在 canvas 上逐像素画） ---------------- */
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function px(ctx, x, y, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, 1, 1); }
function rect(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x | 0, y | 0, w | 0, h | 0); }
function line(ctx, x0, y0, x1, y1, col) { // Bresenham 直线（画武器/法杖/弓弦用）
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) { px(ctx, x0, y0, col);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; } }
}
function tri(ctx, x0, y0, x1, y1, x2, y2, col) { // 扫描线填充三角形（画翅膀/披风/帽子用）
  const minY = Math.min(y0, y1, y2), maxY = Math.max(y0, y1, y2);
  for (let y = minY; y <= maxY; y++) {
    const xs = [];
    const edges = [[x0, y0, x1, y1], [x1, y1, x2, y2], [x2, y2, x0, y0]];
    for (const [ax, ay, bx, by] of edges) {
      if ((ay <= y && by > y) || (by <= y && ay > y)) xs.push(ax + (y - ay) * (bx - ax) / (by - ay));
    }
    if (xs.length >= 2) { const a = Math.min(...xs), b = Math.max(...xs); rect(ctx, Math.floor(a), y, Math.ceil(b) - Math.floor(a) + 1, 1, col); }
  }
}

/* ---------------- WebAudio 合成音效（无外部音频） ---------------- */
const SFX = {
  ctx: null, enabled: true,
  ac() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.enabled) return;
    const ac = this.ac(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, freq, delay) {
    if (!this.enabled) return;
    const ac = this.ac(); if (!ac) return;
    const t0 = ac.currentTime + (delay || 0);
    const len = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ac.createBufferSource(); src.buffer = buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
    const g = ac.createGain(); g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ac.destination);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },
  click()  { this.tone(700, 0.05, 'square', 0.06); },
  coin()   { this.tone(988, 0.07, 'sine', 0.10); this.tone(1319, 0.10, 'sine', 0.10, 0, 0.06); },
  hit()    { this.tone(180, 0.06, 'square', 0.12, 90); this.noise(0.05, 0.08, 900); },
  crit()   { this.tone(300, 0.12, 'square', 0.14, 620); this.noise(0.10, 0.16, 2400); },
  slash()  { this.noise(0.12, 0.16, 1800); this.tone(520, 0.08, 'sawtooth', 0.05, 240); },
  shoot()  { this.tone(820, 0.08, 'triangle', 0.11, 380); },
  orb()    { this.tone(500, 0.16, 'sine', 0.12, 940); this.tone(750, 0.12, 'sine', 0.06, 1200, 0.05); },
  pack()   { this.noise(0.25, 0.14, 700); this.tone(1200, 0.10, 'sine', 0.06, 1800, 0.12); },
  devour() { this.tone(420, 0.22, 'sine', 0.14, 80); this.tone(210, 0.10, 'square', 0.07, 90, 0.10); },
  starup() { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.11, 0, i * 0.07)); },
  hexGold(){ [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.16, 'sine', 0.10, 0, i * 0.06)); },
  zap()    { this.tone(1400, 0.08, 'sawtooth', 0.08, 300); this.noise(0.06, 0.06, 3200); },
  boss()   { this.tone(65, 0.5, 'sine', 0.22, 40); this.noise(0.4, 0.18, 220); },
  slam()   { this.tone(70, 0.25, 'sine', 0.25, 38); this.noise(0.2, 0.2, 300); },
  win()    { [523, 659, 784, 1046, 1319].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.11, 0, i * 0.09)); },
  lose()   { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.22, 'sawtooth', 0.09, 0, i * 0.11)); }
};

/* ---------------- 存档与设置（localStorage） ----------------
   设置 + 最高波次 + 引导标志 + 对局快照（「继续」用，胜负后清除） */
const LS_SETTINGS = 'syjt_settings_v1';
const LS_BEST = 'syjt_best_v1';
const LS_TUT = 'syjt_tut_v1';
const LS_SAVE = 'syjt_save_v1';
const DEFAULT_SETTINGS = { sfx: true, music: true, shake: true, speed: 1 };
let SETTINGS = DEFAULT_SETTINGS;
try {
  const raw = localStorage.getItem(LS_SETTINGS);
  if (raw) SETTINGS = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
} catch (e) { /* 损坏的设置就用默认 */ }
function saveSettings() { try { localStorage.setItem(LS_SETTINGS, JSON.stringify(SETTINGS)); } catch (e) {} }
function loadBest() { try { return parseInt(localStorage.getItem(LS_BEST) || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(w) { try { if (w > loadBest()) localStorage.setItem(LS_BEST, String(w)); } catch (e) {} }
function tutDone() { try { return localStorage.getItem(LS_TUT) === '1'; } catch (e) { return false; } }
function markTutDone() { try { localStorage.setItem(LS_TUT, '1'); } catch (e) {} }
function loadSave() { try { const raw = localStorage.getItem(LS_SAVE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(LS_SAVE); } catch (e) {} }
let CONTINUE_RUN = false; // 主菜单「继续」时置 true，GameScene.create 读档

/* ---------------- BGM：WebAudio 合成循环（无外部音频） ----------------
   游戏跑 60 FPS；BGM 用前瞻调度，每 200ms 排 0.4s 的音符 */
const BGM = {
  enabled: true, mode: 'normal', paused: false, timer: null, step: 0, nextTime: 0,
  CHORDS: [ // Am F C G，每小节 8 个八分音符
    { root: 110.00, arp: [220.00, 261.63, 329.63] },
    { root: 87.31, arp: [174.61, 220.00, 261.63] },
    { root: 130.81, arp: [261.63, 329.63, 392.00] },
    { root: 98.00, arp: [196.00, 246.94, 293.66] }
  ],
  start() {
    if (this.timer) return;
    this.nextTime = 0; this.step = 0;
    this.timer = setInterval(() => this.schedule(), 200);
  },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } },
  setMode(m) { this.mode = m; },
  note(freq, t, dur, type, vol) {
    const ac = SFX.ac(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  schedule() {
    if (!this.enabled || this.paused) return;
    const ac = SFX.ac(); if (!ac || ac.state === 'suspended') return;
    if (this.nextTime < ac.currentTime) this.nextTime = ac.currentTime + 0.05;
    const boss = this.mode === 'boss';
    const spb = boss ? 60 / 116 / 2 : 60 / 72 / 2; // 八分音符时值
    while (this.nextTime < ac.currentTime + 0.4) {
      const bar = Math.floor(this.step / 8) % 4;
      const chord = this.CHORDS[bar];
      const s = this.step % 8;
      if (s === 0 || s === 4) this.note(chord.root, this.nextTime, spb * 1.8, 'sine', boss ? 0.075 : 0.055);
      if (boss && (s === 2 || s === 6)) this.note(chord.root / 2, this.nextTime, spb * 1.5, 'sawtooth', 0.03);
      this.note(chord.arp[s % 3], this.nextTime, spb * 0.9, 'triangle', boss ? 0.04 : 0.03);
      this.nextTime += spb; this.step++;
    }
  }
};

/* ---------------- 固定种子随机（战场装饰每局同图） ---------------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ============================================================
   精灵图集 · 玩家三职业（每人独立手绘，32x32）
   帧：w0/w1/w2 走路三帧，atk 攻击，hit 受击，die 死亡
   ============================================================ */
/* ============================================================
   精灵图集 · 12 帧/角色（60 FPS 下走路 10 张/秒、攻击 12 张/秒轮换）
   帧：idle0/idle1 待机，w0/w1/w2/w3 走路，atk0/atk1/atk2 攻击，hit 受击，die 死亡，win 胜利
   画法：先在 32 格（Boss 48 格）逐像素画，再最近邻放大到 48x48（Boss 64x64）
   ============================================================ */
const FRAMES12 = ['idle0', 'idle1', 'w0', 'w1', 'w2', 'w3', 'atk0', 'atk1', 'atk2', 'hit', 'die', 'win'];
function buildChar(scene, key, drawFn, baseSize, finalSize) {
  for (const suf of FRAMES12) {
    if (scene.textures.exists(key + '_' + suf)) continue;
    const tmp = mkCanvas(baseSize, baseSize);
    drawFn(tmp.getContext('2d'), suf);
    const c = mkCanvas(finalSize, finalSize);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.drawImage(tmp, 0, 0, finalSize, finalSize);
    scene.textures.addCanvas(key + '_' + suf, c);
  }
}

/* ---------------- 战士：钢甲 + 红缨盔 + 剑盾 ---------------- */
function drawWarrior(ctx, f) {
  const { R, H, L, W, S, K, G, B, T } = PAL;
  if (f === 'die') { // 倒地：头盔+身躯横躺，剑丢在一旁，X 眼
    rect(ctx, 5, 26, 8, 3, H); rect(ctx, 4, 25, 6, 1, R);
    px(ctx, 7, 27, K); px(ctx, 8, 28, K); px(ctx, 8, 27, K); px(ctx, 7, 28, K);
    rect(ctx, 12, 26, 12, 4, B); rect(ctx, 12, 26, 12, 1, G);
    rect(ctx, 24, 27, 6, 3, H);
    line(ctx, 18, 22, 28, 29, W); line(ctx, 19, 23, 29, 30, L);
    return;
  }
  const lean = f === 'hit' ? -1 : f === 'atk2' ? 1 : 0; // 受击后仰 / 追击前倾
  const blink = f === 'idle1'; // 待机第二帧：眨眼
  // 红缨
  rect(ctx, 14 + lean, 1, 4, 2, R); rect(ctx, 13 + lean, 3, 6, 1, R); rect(ctx, 12 + lean, 4, 8, 1, R);
  // 头盔 + 脸
  rect(ctx, 11 + lean, 5, 10, 3, H); rect(ctx, 10 + lean, 8, 12, 2, H);
  rect(ctx, 12 + lean, 9, 8, 3, S);
  if (!blink) { px(ctx, 14 + lean, 10, K); px(ctx, 17 + lean, 10, K); }
  // 肩甲（金边）
  rect(ctx, 7 + lean, 11, 6, 3, H); rect(ctx, 19 + lean, 11, 6, 3, H);
  rect(ctx, 7 + lean, 11, 6, 1, G); rect(ctx, 19 + lean, 11, 6, 1, G);
  // 躯干 + 金徽 + 腰带
  rect(ctx, 10 + lean, 14, 12, 6, B); rect(ctx, 15 + lean, 15, 2, 2, G);
  rect(ctx, 10 + lean, 20, 12, 2, T); rect(ctx, 15 + lean, 20, 2, 2, G);
  // 盾（左手）
  const shY = f === 'hit' ? 10 : 12;
  rect(ctx, 3 + lean, shY, 6, 10, B); rect(ctx, 4 + lean, shY + 1, 4, 8, L); rect(ctx, 5 + lean, shY + 4, 2, 2, G);
  // 腿（走路四帧 / 攻击三段 / 胜利站姿）
  if (f === 'w0') {
    rect(ctx, 11, 22, 4, 6, H); rect(ctx, 10, 28, 5, 2, K);
    rect(ctx, 17, 22, 4, 5, H); rect(ctx, 17, 27, 5, 2, K);
  } else if (f === 'w2') {
    rect(ctx, 11, 22, 4, 5, H); rect(ctx, 11, 27, 5, 2, K);
    rect(ctx, 17, 22, 4, 6, H); rect(ctx, 17, 28, 5, 2, K);
  } else if (f === 'w3') { // 交错步：双腿并拢过中线
    rect(ctx, 12, 22, 4, 6, H); rect(ctx, 11, 28, 5, 2, K);
    rect(ctx, 16, 22, 4, 6, H); rect(ctx, 16, 28, 5, 2, K);
  } else if (f === 'atk0') { // 蓄力下蹲
    rect(ctx, 10, 22, 4, 6, H); rect(ctx, 9, 28, 5, 2, K);
    rect(ctx, 18, 22, 4, 6, H); rect(ctx, 18, 28, 5, 2, K);
  } else if (f === 'atk1') { // 弓步劈砍
    rect(ctx, 9, 22, 4, 7, H); rect(ctx, 8, 29, 5, 2, K);
    rect(ctx, 18, 22, 4, 6, H); rect(ctx, 18, 28, 5, 2, K);
  } else if (f === 'atk2') { // 追击前踏
    rect(ctx, 8, 22, 4, 7, H); rect(ctx, 7, 29, 5, 2, K);
    rect(ctx, 19, 22, 4, 5, H); rect(ctx, 19, 27, 5, 2, K);
  } else if (f === 'win') { // 胜利叉开站
    rect(ctx, 9, 22, 4, 7, H); rect(ctx, 8, 29, 5, 2, K);
    rect(ctx, 19, 22, 4, 7, H); rect(ctx, 19, 29, 5, 2, K);
  } else {
    rect(ctx, 11, 22, 4, 7, H); rect(ctx, 10, 29, 5, 2, K);
    rect(ctx, 17, 22, 4, 7, H); rect(ctx, 17, 29, 5, 2, K);
  }
  // 剑（右手）
  if (f === 'atk0') { // 蓄力：剑收回左肩
    line(ctx, 20, 14, 10, 4, W); line(ctx, 21, 15, 11, 5, L);
    rect(ctx, 19, 13, 4, 2, G);
  } else if (f === 'atk1') { // 高举斜劈
    line(ctx, 23, 15, 30, 4, W); line(ctx, 24, 16, 31, 5, L);
    rect(ctx, 21, 14, 4, 2, G);
  } else if (f === 'atk2') { // 追击：剑向前下方
    line(ctx, 24, 14, 31, 26, W); line(ctx, 25, 15, 31, 27, L);
    rect(ctx, 22, 13, 4, 2, G);
  } else if (f === 'win') { // 胜利：剑举过头顶
    rect(ctx, 24, 0, 3, 12, W); px(ctx, 25, 0, W);
    rect(ctx, 23, 12, 5, 1, G); rect(ctx, 24, 13, 3, 2, T);
  } else {
    rect(ctx, 24, 6, 3, 11, W); px(ctx, 25, 5, W); px(ctx, 24, 5, L); px(ctx, 26, 5, L);
    rect(ctx, 23, 17, 5, 1, G); rect(ctx, 24, 18, 3, 2, T);
  }
  if (f === 'hit') { // 眩晕星
    px(ctx, 8, 6, PAL.Y); px(ctx, 24, 4, PAL.Y); px(ctx, 27, 8, PAL.Y);
  }
  if (f === 'win') { // 胜利金星
    px(ctx, 8, 6, PAL.Y); px(ctx, 27, 4, PAL.Y); px(ctx, 5, 12, PAL.Y); px(ctx, 28, 10, PAL.Y);
  }
}

/* ---------------- 弓手：绿兜帽 + 皮甲 + 长弓 ---------------- */
function drawArcher(ctx, f) {
  const { E, N, W, K, T, Y, L, S } = PAL;
  if (f === 'die') { // 倒地，弓丢在一旁
    rect(ctx, 5, 26, 8, 3, E); rect(ctx, 12, 26, 12, 4, E); rect(ctx, 24, 27, 6, 3, T);
    px(ctx, 7, 27, K); px(ctx, 8, 28, K); px(ctx, 8, 27, K); px(ctx, 7, 28, K);
    line(ctx, 18, 22, 28, 30, T); line(ctx, 18, 22, 28, 30, W);
    return;
  }
  const lean = f === 'hit' ? -1 : f === 'atk2' ? 1 : 0;
  const hoodShift = f === 'hit' ? -2 : 0; // 受击兜帽歪向一边
  const blink = f === 'idle1';
  // 尖顶兜帽
  rect(ctx, 13 + hoodShift, 2, 6, 2, E); rect(ctx, 12 + hoodShift, 4, 8, 2, E); rect(ctx, 11 + hoodShift, 6, 10, 3, E);
  // 阴影脸 + 发光眼（待机第二帧眨眼）
  rect(ctx, 13 + lean, 9, 6, 3, N);
  if (!blink) { px(ctx, 14 + lean, 10, W); px(ctx, 17 + lean, 10, W); }
  // 上衣 + 斜挎带 + 箭袋
  rect(ctx, 11 + lean, 12, 10, 7, E);
  line(ctx, 12 + lean, 13, 20 + lean, 18, T);
  line(ctx, 19 + lean, 11, 23 + lean, 17, T);
  px(ctx, 22 + lean, 10, Y); px(ctx, 23 + lean, 11, Y); px(ctx, 24 + lean, 12, Y);
  rect(ctx, 11 + lean, 19, 10, 2, T);
  // 腿
  if (f === 'w0') {
    rect(ctx, 11, 22, 4, 6, T); rect(ctx, 10, 28, 5, 2, K);
    rect(ctx, 17, 22, 4, 5, T); rect(ctx, 17, 27, 5, 2, K);
  } else if (f === 'w2') {
    rect(ctx, 11, 22, 4, 5, T); rect(ctx, 11, 27, 5, 2, K);
    rect(ctx, 17, 22, 4, 6, T); rect(ctx, 17, 28, 5, 2, K);
  } else if (f === 'w3') { // 交错步
    rect(ctx, 12, 22, 4, 6, T); rect(ctx, 11, 28, 5, 2, K);
    rect(ctx, 16, 22, 4, 6, T); rect(ctx, 16, 28, 5, 2, K);
  } else if (f === 'atk0') { // 蓄力：搭箭下蹲
    rect(ctx, 10, 22, 4, 6, T); rect(ctx, 9, 28, 5, 2, K);
    rect(ctx, 18, 22, 4, 6, T); rect(ctx, 18, 28, 5, 2, K);
  } else if (f === 'atk1') { // 拉弓
    rect(ctx, 9, 22, 4, 7, T); rect(ctx, 8, 29, 5, 2, K);
    rect(ctx, 18, 22, 4, 6, T); rect(ctx, 18, 28, 5, 2, K);
  } else if (f === 'atk2') { // 放弦前倾
    rect(ctx, 8, 22, 4, 7, T); rect(ctx, 7, 29, 5, 2, K);
    rect(ctx, 19, 22, 4, 5, T); rect(ctx, 19, 27, 5, 2, K);
  } else if (f === 'win') {
    rect(ctx, 9, 22, 4, 7, T); rect(ctx, 8, 29, 5, 2, K);
    rect(ctx, 19, 22, 4, 7, T); rect(ctx, 19, 29, 5, 2, K);
  } else {
    rect(ctx, 11, 22, 4, 7, T); rect(ctx, 10, 29, 5, 2, K);

function makeUnit(cls, rarityKey, side) {

    burnUntil: 0, burnDps: 0, burnNext: 0, slowUntil: 0, frozenUntil: 0, speedBuffUntil: 0,

  };

}
function makeEnemy(kind, wave) {
  const hpMul = Math.pow(1.15, wave), atkMul = Math.pow(1.08, wave);
  let e;
  if (kind === 'boss') {
    e = makeUnit('warrior', 'N', 'enemy'); // 占位后重写数值

    e.baseScale = 1.8; e.isBoss = true;

    e.maxHp = Math.round(def.hp * hpMul); e.hp = e.maxHp;
    e.atk = Math.round(def.atk * atkMul * 10) / 10;
    e.range = def.range; e.aspd = def.aspd; e.speed = def.speed; e.crit = def.crit;
    e.baseScale = def.scale;
  }
  e.side = 'enemy';
  return e;
}
function recompute(u) { // 星级 / 等级 / 海克斯 / 附魔变化后重算
  const c = CLASSES[u.cls];
  const r = RARITY.find(x => x.key === u.rarity) || RARITY[0];
  const starMult = Math.pow(1.5, u.star - 1);
  const lvlMult = 1 + 0.08 * (u.level - 1);
  const atkBonus = u.cls === 'warrior' ? (G.buffs.warriorAtk || 0) : u.cls === 'mage' ? (G.buffs.mageAtk || 0) : 0;
  const aspdBonus = u.cls === 'archer' ? (G.buffs.archerAspd || 0) : 0;
  const colossus = G.buffs.colossus ? 1.35 : 1; // 巨像：生命 +35%
  const newMax = Math.round(c.hp * r.mult * starMult * lvlMult * colossus) + (u.soulBonus || 0); // 吞噬灵魂叠加
  const ratio = u.hp / Math.max(1, u.maxHp);
  u.maxHp = newMax; u.hp = Math.max(1, Math.round(newMax * ratio));
  u.atk = Math.round(c.atk * r.mult * starMult * lvlMult * (1 + atkBonus) * 10) / 10;
  u.aspd = c.aspd * (1 + aspdBonus) * (u.ench === 'swift' ? 1.25 : 1); // 疾风附魔：攻速 +25%
  u.crit = c.crit + (u.ench === 'crit' ? 0.15 : 0); // 暴击附魔：暴击率 +15%
}
function weightedPick(table) { // table: [[key, weight], ...]
  let total = 0; for (const [, w] of table) total += w;
  let roll = Math.random() * total;
  for (const [k, w] of table) { roll -= w; if (roll <= 0) return k; }
  return table[table.length - 1][0];
}
function cellCenter(c, r) { return { x: GRID.x + c * GRID.cw + GRID.cw / 2, y: GRID.y + r * GRID.ch + GRID.ch / 2 }; }
function cellAt(x, y) {
  const c = Math.floor((x - GRID.x) / GRID.cw), r = Math.floor((y - GRID.y) / GRID.ch);
  if (c < 0 || c >= GRID.cols || r < 0 || r >= GRID.rows) return null;
  return { c, r };
}

}
function restoreUnit(s) {
  const u = makeUnit(s.cls, s.rarity, 'player');
  u.star = s.star; u.starProg = s.starProg || 0; u.level = s.level; u.xp = s.xp || 0; u.devourCount = s.devourCount || 0;
  u.ench = s.ench || null; u.reinforce = s.reinforce || 0; u.soulBonus = s.soulBonus || 0;
  recompute(u);

}

  buildField() {
    // 草地棋盘（双色像素砖）+ 固定种子装饰（每局同图）
    this.add.rectangle(16, 64, 1248, 416, 0x1e5233).setOrigin(0, 0);
    this.cellRects = [];
    for (let c = 0; c < GRID.cols; c++) {
      this.cellRects[c] = [];
      for (let r = 0; r < GRID.rows; r++) {
        const col = (c + r) % 2 === 0 ? 0x245c39 : 0x1e5233;
        const rect = this.add.rectangle(GRID.x + c * GRID.cw, GRID.y + r * GRID.ch, GRID.cw - 2, GRID.ch - 2, col).setOrigin(0, 0).setDepth(0);
        this.cellRects[c][r] = rect;
      }
    }
    const rng = mulberry32(20261124);
    for (let c = 0; c < GRID.cols; c++) {
      for (let r = 0; r < GRID.rows; r++) {
        const roll = rng();
        const bx = GRID.x + c * GRID.cw, by = GRID.y + r * GRID.ch;
        if (roll < 0.30) { // 小草
          const gx = bx + 8 + Math.floor(rng() * 70), gy = by + 8 + Math.floor(rng() * 70);
          this.add.rectangle(gx, gy, 2, 8, 0x3fae6a).setOrigin(0, 0).setDepth(0);
          this.add.rectangle(gx + 4, gy + 2, 2, 6, 0x3fae6a).setOrigin(0, 0).setDepth(0);
        } else if (roll < 0.38) { // 石块
          const sx = bx + 12 + Math.floor(rng() * 60), sy = by + 12 + Math.floor(rng() * 60);
          this.add.rectangle(sx, sy, 10, 7, 0x8a84a0).setOrigin(0, 0).setDepth(0);
          this.add.rectangle(sx + 2, sy, 6, 3, 0xcfc9dd).setOrigin(0, 0).setDepth(0);
        } else if (roll < 0.43) { // 小花
          const fx = bx + 12 + Math.floor(rng() * 60), fy = by + 12 + Math.floor(rng() * 60);
          this.add.circle(fx, fy, 3, 0xd97b3f).setDepth(0);
          this.add.circle(fx, fy, 1, 0xe3cf9e).setDepth(0);
        }
      }
    }
    this.add.rectangle(16, 64, 1248, 416).setOrigin(0, 0).setStrokeStyle(2, 0x8a6d1f).setDepth(0);
    // 我方木栅栏 + 纵栏（左沿）
    for (let y = 80; y <= 464; y += 48) {
      this.add.rectangle(138, y, 8, 26, 0x7a4a2b).setOrigin(0, 0).setDepth(1);
      this.add.rectangle(138, y, 8, 3, 0x9c6b3f).setOrigin(0, 0).setDepth(1);
    }
    this.add.rectangle(136, 76, 4, 392, 0x9c6b3f).setOrigin(0, 0).setDepth(1);
    // 旗帜（塔后，迎风摆动）
    this.add.rectangle(60, 120, 4, 60, 0x7a4a2b).setOrigin(0, 0).setDepth(1);
    const flag = this.add.triangle(64, 120, 0, 0, 34, 8, 0, 16, 0xc9a227).setOrigin(0, 0).setDepth(1);
    this.tweens.add({ targets: flag, scaleX: 0.85, duration: 500, yoyo: true, repeat: -1 });
    // 敌方裂缝（右沿，敌人从这里出来）
    this.add.rectangle(1200, 64, 64, 416, 0x14101c).setOrigin(0, 0).setDepth(0);
    this.add.rectangle(1196, 64, 4, 416, 0x4a1e6e).setOrigin(0, 0).setDepth(1);
    for (let i = 0; i < 6; i++) {
      const ry = 90 + i * 62 + Math.floor(rng() * 20);
      this.add.triangle(1200, ry, 0, 0, 26, 10, 0, 22, 0x241f30).setOrigin(0, 0).setDepth(1);
      this.add.circle(1216, ry + 10, 3, 0x8b3fd9).setDepth(1).setAlpha(0.7);
    }
    // 波次氛围罩（白天 / 黄昏 / Boss 夜）
    this.atmo = this.add.rectangle(16, 64, 1248, 416, 0x000000, 0).setOrigin(0, 0).setDepth(1);
    this.fogBlobs = [];
    for (let i = 0; i < 5; i++) {
      const f = this.add.circle(200 + i * 220, 160 + (i % 2) * 140, 70, 0x8b3fd9, 0.05).setDepth(1).setVisible(false);
      this.tweens.add({ targets: f, x: f.x + 60, duration: 6000 + i * 900, yoyo: true, repeat: -1 });
      this.fogBlobs.push(f);
    }
    // 塔（左端）+ 呼吸光晕
    this.towerHalo = this.add.circle(TOWER_POS.x, TOWER_POS.y - 6, 46, 0x6fb7d9, 0.16).setDepth(1);
    this.tweens.add({ targets: this.towerHalo, scaleX: 1.18, scaleY: 1.18, alpha: 0.08, duration: 1400, yoyo: true, repeat: -1 });
    this.add.image(TOWER_POS.x, TOWER_POS.y, 'tower').setScale(1.5).setDepth(2);
    this.add.rectangle(TOWER_POS.x - 38, 196, 76, 8, 0x5e1f24).setOrigin(0, 0).setDepth(4);
    this.ui.towerBarFg = this.add.rectangle(TOWER_POS.x - 38, 196, 76, 8, 0x3fae6a).setOrigin(0, 0).setDepth(4);
  },

  /* ---------- 顶栏刷新 ---------- */
  updateTop() {
    this.ui.waveTxt.setText('第 ' + G.wave + ' 波 / 5');
    this.ui.goldTxt.setText('金币 ' + G.gold);
    this.ui.popTxt.setText('人口 ' + G.field.length + '/' + (4 + (G.level - 1)));
    this.ui.towerHpFg.width = Math.max(0, 140 * G.towerHp / G.towerMax);
    this.ui.towerHpTxt.setText(G.towerHp + '/' + G.towerMax);
    this.ui.towerBarFg.width = Math.max(0, 76 * G.towerHp / G.towerMax);
    this.ui.xpFg.width = Math.max(0, 120 * G.xp / G.xpNeed);
    this.ui.lvlTxt.setText('Lv' + G.level);
    this.ui.rerollBtn.txt.setText(G.freeReroll > 0 ? '免费刷新' : '刷新 ' + (2 + G.rerolls) + '金');
    this.ui.packPityTxt.setText('保底 ' + G.packPity + '/30');
    // 波次进度条
    const prog = ((G.wave - 1) + (G.phase === 'battle' ? 0.5 : 0)) / 5;
    this.ui.waveProg.width = Math.max(0, 120 * prog);
    // 波次氛围：1–2 白天 / 3–4 黄昏 / 5 Boss 夜 + 紫雾
    if (G.wave >= 5) {
      this.atmo.setFillStyle(0x1a1030, 0.35);
      this.fogBlobs.forEach(f => f.setVisible(true));
    } else if (G.wave >= 3) {
      this.atmo.setFillStyle(0xd97b3f, 0.10);
      this.fogBlobs.forEach(f => f.setVisible(false));
    } else {
      this.atmo.setFillStyle(0x000000, 0);
      this.fogBlobs.forEach(f => f.setVisible(false));
    }
    // 塔光晕：低血变红
    if (this.towerHalo) this.towerHalo.setFillStyle(G.towerHp / G.towerMax < 0.3 ? 0xa83232 : 0x6fb7d9);
    const wv = WAVES[G.wave - 1];
    const desc = wv.list.map(([k, n]) => (k === 'boss' ? '骷髅王' : k === 'elite' ? '精英史莱姆' : ENEMY[k].name) + '×' + n).join(' + ');
    this.ui.waveInfo.setText('第 ' + G.wave + ' 波：' + desc);
  },

  /* ---------- 单位可视化 ---------- */
  spawnUnitSprite(u) {
    const img = this.add.image(u.x, u.y, u.tex + '_idle0').setScale(this.unitScale(u)).setDepth(3);
    if (u.side === 'player') img.setInteractive({ draggable: true }); // 只有玩家棋子能拖；敌人不可拖
    img._unit = u;
    u.sprite = img;
    u.hpBg = this.add.rectangle(u.x, u.y - 54, 56, 6, 0x5e1f24).setDepth(4).setVisible(false);
    u.hpFg = this.add.rectangle(u.x - 28, u.y - 54, 56, 6, 0x3fae6a).setOrigin(0, 0.5).setDepth(4).setVisible(false);
    u.devTxt = this.add.text(u.x, u.y + 52, '', { fontSize: '11px', color: '#c9a227', fontFamily: 'monospace' }).setOrigin(0.5, 0).setDepth(4).setVisible(false);
    u.starImgs = [];
    return img;
  },
  refreshStars(u) {
    for (const s of u.starImgs) s.destroy();
    u.starImgs = [];
    if (u.side !== 'player' || !u.sprite) return;
    for (let i = 0; i < u.star; i++) {
      const s = this.add.image(u.x - (u.star - 1) * 7 + i * 14, u.y - 66, 'spark').setScale(0.9).setDepth(4).setTint(0xc9a227);
      u.starImgs.push(s);
    }
  },
  unitScale(u) { // 巨像：场上体型 +35%；备战席不放大（52 格装不下）
    if (u.side === 'enemy') return u.baseScale;
    if (!u.cell) return 1.1;
    return u.baseScale * (G.buffs.colossus ? 1.35 : 1);
  },
  refreshEnchVisual(u) { // 附魔光环 + 头顶元素角标
    if (u.glow && u.glow.active) u.glow.destroy();
    if (u.enchImg && u.enchImg.active) u.enchImg.destroy();
    u.glow = null; u.enchImg = null;
    if (!u.ench || !u.sprite) return;
    const tint = ENCHANT_TINT[u.ench];
    u.glow = this.add.circle(u.x, u.y, 26, tint, 0.16).setDepth(2);
    u.enchImg = this.add.image(u.x + (u.star - 1) * 7 + 16, u.y - 66, 'spark').setScale(0.9).setDepth(4).setTint(tint);
  },
  updateDevText(u) {
    if (!u.devTxt) return;
    if (u.devourCount > 0) {
      u.devTxt.setText('吞 ' + u.devourCount + '/5' + (G.buffs.freeDevour ? '（噬主：不占槽）' : ''));
      u.devTxt.setVisible(u.cell !== null);
    } else u.devTxt.setVisible(false);
  },
  destroyUnitVisual(u) {
    if (u.sprite && u.sprite.active) { this.tweens.killTweensOf(u.sprite); u.sprite.destroy(); }
    if (u.hpBg && u.hpBg.active) u.hpBg.destroy();
    if (u.hpFg && u.hpFg.active) u.hpFg.destroy();
    if (u.devTxt && u.devTxt.active) u.devTxt.destroy();
    for (const s of u.starImgs) if (s.active) s.destroy();
    if (u.glow && u.glow.active) u.glow.destroy();
    if (u.enchImg && u.enchImg.active) u.enchImg.destroy();
    if (u.frozenFx && u.frozenFx.active) u.frozenFx.destroy();
    u.sprite = null; u.hpBg = null; u.hpFg = null; u.devTxt = null; u.starImgs = [];
    u.glow = null; u.enchImg = null; u.frozenFx = null;
  },
  syncUnitVisual(u) {
    if (!u.sprite) return;
    u.sprite.setPosition(u.x, u.y);
    const onField = u.cell !== null && u.side === 'player';
    if (u.hpBg) u.hpBg.setVisible(onField).setPosition(u.x, u.y - 54);
    if (u.hpFg) u.hpFg.setVisible(onField).setPosition(u.x - 28, u.y - 54);
    if (u.hpFg) u.hpFg.width = Math.max(0, 56 * u.hp / u.maxHp);
    for (let i = 0; i < u.starImgs.length; i++) {
      u.starImgs[i].setVisible(onField).setPosition(u.x - (u.star - 1) * 7 + i * 14, u.y - 66);
    }
    if (u.glow) u.glow.setVisible(u.side === 'player').setPosition(u.x, u.y);
    if (u.enchImg) u.enchImg.setVisible(onField).setPosition(u.x + (u.star - 1) * 7 + 16, u.y - 66);
    this.updateDevText(u);
    if (u.devTxt) u.devTxt.setPosition(u.x, u.y + 52);
  },

  /* ---------- 开局 ---------- */
  resetGame() {
    // 清掉旧单位
    for (const u of [...G.field, ...G.bench, ...G.enemies]) if (u) this.destroyUnitVisual(u);
    Object.assign(G, {
      phase: 'prep', wave: 1, gold: 8, level: 1, xp: 0, xpNeed: 2,
      towerHp: 100, baseGold: 5, interestCap: 5, rerolls: 0,
      speedMul: SETTINGS.speed, paused: false, buffs: {}, hexesTaken: [], packPity: 0,
      field: [], bench: [null, null, null, null, null], shop: [], shopEnch: null, enchHeld: null, freeReroll: 0, enemies: [],
      hitStopUntil: 0, dragUnit: null, dragEnch: null, diceBusy: false,
      stats: { startTime: Date.now(), kills: 0, goldEarned: 0 }
    });
    this.ui.speedTxt.setText(SETTINGS.speed + 'x');
    this.ui.endBox.setVisible(false);
    this.ui.hexBox.setVisible(false);
    this.ui.revealBox.setVisible(false);
    this.ui.reinforceBox.setVisible(false);
    this.ui.pauseOverlay.setVisible(false);
    this.ui.settings.setVisible(false);
    this.ui.howto.setVisible(false);
    this.ui.tutBox.setVisible(!tutDone());
    BGM.setMode('normal');
    // 开局送 1 战士 + 1 弓手（白）进备战席
    this.addToBench(makeUnit('warrior', 'N', 'player'));
    this.addToBench(makeUnit('archer', 'N', 'player'));
    this.refreshShop(true);
    this.renderEnchBar();
    this.updateTop();
    this.ui.startBtn.setVisible(true); this.ui.startTxt.setVisible(true);
    this.ui.startTxt.setText('开始战斗');
  },
  addToBench(u) {
    const idx = G.bench.indexOf(null);
    if (idx === -1) return -1;
    G.bench[idx] = u;
    u.cell = null;
    const cx = 496 + idx * 58, cy = 666;
    u.x = cx; u.y = cy;
    if (!u.sprite) this.spawnUnitSprite(u);
    u.sprite.setScale(this.unitScale(u)).setTexture(u.tex + '_idle0');
    this.syncUnitVisual(u);
    return idx;
  }
});

/* ============================================================
   交互：拖拽布阵 / 吞噬 / 商店 / 掷骰 / 开包 / 海克斯
   ============================================================ */
function hexColor(s) { return parseInt(s.slice(1), 16); }

Object.assign(GameScene.prototype, {
  /* ---------- 拖拽 ---------- */
  clearDragHi() {
    if (this._dragHi && this._dragHi.sprite) this._dragHi.sprite.clearTint();
    this._dragHi = null;
    if (this._dragHiCell) {
      const cell = this._dragHiCell;
      this.cellRects[cell.c][cell.r].setFillStyle((cell.c + cell.r) % 2 === 0 ? 0x245c39 : 0x1e5233);
      this._dragHiCell = null;
    }
  },
  unitAtCell(c, r) { return G.field.find(u => u.alive && u.cell && u.cell.c === c && u.cell.r === r) || null; },
  unitAtPoint(x, y, exclude) {
    for (const u of G.field) {
      if (!u.alive || u === exclude || !u.sprite) continue;
      if (Math.abs(u.x - x) < 38 && Math.abs(u.y - y) < 42) return u;
    }
    return null;
  },
  benchSlotAt(x, y) {
    if (y < 640 || y > 692 || x < 470 || x >= 760) return null;
    const localX = (x - 470) % 58;
    if (localX > 52) return null;
    return Math.floor((x - 470) / 58);
  },
  unitAtPointAny(x, y) { // 场上 + 备战席（附魔拖放用）
    for (const u of [...G.field, ...G.bench]) {
      if (!u || !u.alive || !u.sprite) continue;
      if (Math.abs(u.x - x) < 38 && Math.abs(u.y - y) < 42) return u;
    }
    return null;
  },
  onDragStart(p, o) {
    this._dragSX = p.x; this._dragSY = p.y;
    if (o._enchSlot) { // 拖附魔栏里的附魔
      if (!G.enchHeld || G.phase !== 'prep' || G.paused) return;
      G.dragEnch = G.enchHeld;
      const e = ENCHANTS[G.enchHeld];
      this._enchGhost = this.add.image(p.x, p.y, 'spark').setTint(e.tint).setScale(2).setDepth(60);
      return;
    }
    const u = o._unit;
    if (!u || !u.alive || u.side !== 'player') return;
    if (G.phase !== 'prep' || G.paused) { G.dragUnit = null; return; }
    G.dragUnit = u;
    this.children.bringToTop(o);
    o.setScale(o.scaleX * 1.15);
  },
  onDrag(p, o, x, y) {
    if (G.dragEnch && this._enchGhost) { // 附魔拖放：跟随 + 悬停棋子绿光预告
      this._enchGhost.setPosition(x, y);
      this.clearDragHi();
      const target = this.unitAtPointAny(x, y);
      if (target) {
        target.sprite.setTint(0x66ff66);
        this._dragHi = target;
      }
      return;
    }
    const u = G.dragUnit;
    if (!u || o._unit !== u) return;
    o.x = x; o.y = y;
    this.clearDragHi();
    if (u.cell === null) { // 备战席棋子：悬停场上棋子 = 吞噬预告
      const target = this.unitAtPoint(x, y, u);
      if (target) {
        target.sprite.setTint(0xff6666);
        this._dragHi = target;
        const same = target.cls === u.cls && target.star === u.star;
        this.ui.waveInfo.setText('松手：' + u.name + ' 吞噬 ' + target.name + '（' + (same ? '升星进度+1' : '经验+' + RARITY_XP[u.rarity]) + '）');
        return;
      }
    }
    const cell = cellAt(x, y);
    if (cell && !this.unitAtCell(cell.c, cell.r)) {
      this.cellRects[cell.c][cell.r].setFillStyle(0x3fae6a);
      this._dragHiCell = cell;
    }
  },
  onDragEnd(p, o) {
    if (G.dragEnch) { // 附魔拖放结束
      const enchId = G.dragEnch;
      G.dragEnch = null;
      if (this._enchGhost) { this._enchGhost.destroy(); this._enchGhost = null; }
      const target = this.unitAtPointAny(p.x, p.y);
      this.clearDragHi();
      if (target && this.applyEnchant(target, enchId)) {
        G.enchHeld = null;
        this.renderEnchBar();
        this.renderShop();
      }
      this.updateTop();
      return;
    }
    const u = G.dragUnit;
    G.dragUnit = null;
    if (!u) return;
    this.clearDragHi();
    this.updateTop();
    // 单击（几乎没移动）= 打开强化面板，不走布阵逻辑
    const moved = Math.hypot(p.x - (this._dragSX ?? p.x), p.y - (this._dragSY ?? p.y));
    if (moved < 8 && G.phase === 'prep' && !G.paused) {
      u.sprite.setScale(this.unitScale(u)); // 拖拽时放大了 1.15 倍，单击要复原
      this.syncUnitVisual(u);
      this.showReinforce(u);
      return;
    }
    const x = p.x, y = p.y;
    const bIdx = this.benchSlotAt(x, y);
    if (bIdx !== null) { this.moveToBench(u, bIdx); return; }
    const target = this.unitAtPoint(x, y, u);
    if (target) {
      if (u.cell === null) { this.doDevour(target, u); return; }
      this.swapCells(u, target); return;
    }
    const cell = cellAt(x, y);
    if (cell) {
      const occ = this.unitAtCell(cell.c, cell.r);
      if (!occ) { this.placeOnField(u, cell); return; }
      if (u.cell !== null) { this.swapCells(u, occ); return; }
      this.swapBenchField(u, occ); return;
    }
    this.syncUnitVisual(u); // 哪都没拖到，弹回原位
  },
  placeOnField(u, cell) {
    if (u.cell === null) {
      const cap = 4 + (G.level - 1);
      if (G.field.length >= cap) {
        this.floatText(400, 200, '人口已满（' + cap + '），先升级', '#ff8888', 15);
        this.syncUnitVisual(u); this.updateTop();
        return false;
      }
      const bi = G.bench.indexOf(u);
      if (bi !== -1) G.bench[bi] = null;
      G.field.push(u);
    }
    u.cell = cell;
    const pt = cellCenter(cell.c, cell.r);
    u.x = pt.x; u.y = pt.y;
    u.sprite.setScale(this.unitScale(u)).setTexture(u.tex + '_idle0');
    this.syncUnitVisual(u);
    this.updateTop();
    return true;
  },
  moveToBench(u, idx) {
    const occ = G.bench[idx];
    if (occ === u) { this.syncUnitVisual(u); return; }
    const oldCell = u.cell;
    const oldBench = u.cell === null ? G.bench.indexOf(u) : -1;
    if (oldCell) { G.field = G.field.filter(x => x !== u); u.cell = null; }
    else if (oldBench !== -1) G.bench[oldBench] = null;
    if (occ) {
      if (oldCell) { // 占位者顶替上场
        G.field.push(occ);
        occ.cell = oldCell;
        const pt = cellCenter(oldCell.c, oldCell.r);
        occ.x = pt.x; occ.y = pt.y;
        occ.sprite.setScale(this.unitScale(occ)).setTexture(occ.tex + '_idle0');
        this.syncUnitVisual(occ);
      } else { // 占位者换到拖动者原来的备战席格
        G.bench[oldBench] = occ;
        occ.x = 496 + oldBench * 58; occ.y = 666;
        occ.sprite.setScale(this.unitScale(occ));
        this.syncUnitVisual(occ);
      }
    }
    G.bench[idx] = u;
    u.x = 496 + idx * 58; u.y = 666;
    u.sprite.setScale(this.unitScale(u)).setTexture(u.tex + '_idle0');
    this.syncUnitVisual(u);
    this.updateTop();
  },
  swapCells(u, v) {
    const cu = u.cell, cv = v.cell;
    u.cell = cv; v.cell = cu;
    const pu = cellCenter(cv.c, cv.r), pv = cellCenter(cu.c, cu.r);
    u.x = pu.x; u.y = pu.y; v.x = pv.x; v.y = pv.y;
    this.syncUnitVisual(u); this.syncUnitVisual(v);
    SFX.click();
  },
  swapBenchField(benchU, fieldU) {
    const bi = G.bench.indexOf(benchU);
    const cell = fieldU.cell;
    G.field = G.field.filter(x => x !== fieldU);
    G.bench[bi] = fieldU;
    fieldU.cell = null;
    fieldU.x = 496 + bi * 58; fieldU.y = 666;
    fieldU.sprite.setScale(this.unitScale(fieldU)).setTexture(fieldU.tex + '_idle0');
    this.syncUnitVisual(fieldU);
    G.field.push(benchU);
    benchU.cell = cell;
    const pt = cellCenter(cell.c, cell.r);
    benchU.x = pt.x; benchU.y = pt.y;
    benchU.sprite.setScale(this.unitScale(benchU)).setTexture(benchU.tex + '_idle0');
    this.syncUnitVisual(benchU);
    this.updateTop();
  },

  /* ---------- 吞噬（§5：同种同星升星进度，异种加经验，衰减可见） ---------- */
  doDevour(target, food) {
    if (G.phase !== 'prep') return;
    if (!G.buffs.freeDevour && target.devourCount >= 5) {
      this.floatText(target.x, target.y - 46, '吞噬槽已满（5/5）', '#ff8888', 14);
      this.syncUnitVisual(food); SFX.click();
      return;
    }
    const bi = G.bench.indexOf(food);
    if (bi !== -1) G.bench[bi] = null;
    const fs = food.sprite;
    if (fs) this.tweens.add({ targets: fs, x: target.x, y: target.y, scaleX: 0.2, scaleY: 0.2, duration: 220, onComplete: () => { if (food.sprite) this.destroyUnitVisual(food); } });
    this.spawnParticles(target.x, target.y, 0xc9a227, 10, 120);
    SFX.devour();
    const decay = G.buffs.freeDevour ? 1 : DEVOUR_DECAY[Math.min(target.devourCount, 4)];
    const devBonus = 1 + (G.buffs.devour || 0);
    if (food.cls === target.cls && food.star === target.star) {
      target.starProg += 1;
      if (target.starProg >= 3) {
        target.starProg = 0; target.star += 1; recompute(target);
        this.refreshStars(target);
        this.starburst(target.x, target.y);
        SFX.starup();
        this.floatText(target.x, target.y - 56, '升星！★' + target.star, '#c9a227', 22);
      } else {
        this.floatText(target.x, target.y - 46, '升星进度 ' + target.starProg + '/3', '#e3cf9e', 14);
      }
    } else {
      const gain = Math.max(1, Math.round(RARITY_XP[food.rarity] * decay * devBonus));
      target.xp += gain;
      let lv = '';
      while (target.xp >= 10) { target.xp -= 10; target.level += 1; lv = ' 升级 Lv' + target.level; recompute(target); }
      this.floatText(target.x, target.y - 46, '+' + gain + '经验' + (decay < 1 ? '（衰减' + Math.round(decay * 100) + '%）' : '') + lv, '#e3cf9e', 14);
    }
    if (!G.buffs.freeDevour) target.devourCount += 1;
    this.syncUnitVisual(target);
    this.updateTop();
  },

  /* ---------- 商店 / 经验 ---------- */
  rollShopCard() {
    const t = G.level === 1 ? [['N', 100]] : G.level === 2 ? [['N', 70], ['R', 25], ['SR', 5]] : [['N', 50], ['R', 35], ['SR', 15]];
    return { cls: ['warrior', 'archer', 'mage'][Math.floor(Math.random() * 3)], rarity: weightedPick(t) };
  },
  refreshShop() {
    G.shop = [this.rollShopCard(), this.rollShopCard(), this.rollShopCard()];
    G.shopEnch = this.rollEnchantCard();
    this.renderShop();
  },
  renderShop() {
    G.shop.forEach((card, i) => {
      const c = this.shopCards[i];
      const r = RARITY.find(x => x.key === card.rarity);
      c.border.setFillStyle(hexColor(r.color));
      c.img.setTexture(CLASSES[card.cls].tex + '_idle0').clearTint().setAlpha(1).setScale(1.1);
      c.name.setText(CLASSES[card.cls].name + ' · ' + r.name).setColor(r.color);
      c.cost.setText(r.cost + '金');
      c.tag.setVisible(false);
    });
    // 第 4 张：附魔卡（金边 +「附魔」角标）
    const ec = this.shopCards[3];
    const e = G.shopEnch ? ENCHANTS[G.shopEnch] : null;
    ec.border.setFillStyle(0xc9a227);
    if (e) {
      ec.img.setTexture('spark').setTint(e.tint).setAlpha(1).setScale(2.4);
      ec.name.setText(e.name).setColor(e.color);
      ec.cost.setText(e.cost + '金');
      ec.tag.setVisible(true);
    } else {
      ec.img.setTexture('spark').setTint(0x5b5470).setAlpha(0.35).setScale(2.4);
      ec.name.setText('（已购）').setColor('#8a84a0');
      ec.cost.setText('');
      ec.tag.setVisible(false);
    }
    ec.bg.setAlpha(G.enchHeld ? 0.45 : 1); // 附魔栏已占时置灰
  },
  buyShop(i) {
    if (G.phase !== 'prep') return;
    const card = G.shop[i]; if (!card) return;
    const r = RARITY.find(x => x.key === card.rarity);
    if (G.gold < r.cost) { this.floatText(829 + i * 122, 500, '金币不足', '#ff8888', 13); return; }
    if (G.bench.indexOf(null) === -1) { this.floatText(829 + i * 122, 500, '备战席满了', '#ff8888', 13); return; }
    G.gold -= r.cost;
    const u = makeUnit(card.cls, card.rarity, 'player');
    this.addToBench(u);
    SFX.coin();
    this.floatText(u.x, u.y - 30, CLASSES[card.cls].name + ' 入队', r.color, 13);
    G.shop[i] = this.rollShopCard();
    this.renderShop();
    this.updateTop();
  },
  rerollShop() {
    if (G.phase !== 'prep') return;
    let cost = 2 + G.rerolls;
    let free = false;
    if (G.freeReroll > 0) { free = true; G.freeReroll -= 1; } // DD街区：每波一次免费刷新
    else if (G.buffs.goldenTicket && Math.random() < 0.25) { free = true; this.floatText(845, 640, '黄金门票！本次免费', '#c9a227', 13); }
    if (!free) {
      if (G.gold < cost) { this.floatText(845, 640, '金币不足', '#ff8888', 13); return; }
      G.gold -= cost; G.rerolls += 1;
    }
    this.refreshShop();
    SFX.click();
    this.updateTop();
  },

  /* ---------- 附魔（M2） ---------- */
  rollEnchantCard() {
    const ids = Object.keys(ENCHANTS).filter(id => {
      if (id === 'split') { // 分裂：场上+备战席没有远程棋子时不刷
        return [...G.field, ...G.bench].some(u => u && (u.cls === 'archer' || u.cls === 'mage'));
      }
      return true;
    });
    return ids[Math.floor(Math.random() * ids.length)];
  },
  buyEnchant() {
    if (G.phase !== 'prep') return;
    const e = G.shopEnch ? ENCHANTS[G.shopEnch] : null;
    if (!e) return;
    if (G.enchHeld) { this.floatText(1195, 500, '先用掉手里的附魔', '#ff8888', 13); return; }
    if (G.gold < e.cost) { this.floatText(1195, 500, '金币不足', '#ff8888', 13); return; }
    G.gold -= e.cost;
    G.enchHeld = e.id;
    G.shopEnch = null; // 买走后该格变空，下次刷新再出
    SFX.coin();
    this.floatText(1195, 500, e.name + '附魔入手，拖到棋子身上', e.color, 13);
    this.renderShop();
    this.renderEnchBar();
    this.updateTop();
  },
  renderEnchBar() {
    const bar = this.ui.enchBar;
    if (!bar) return;
    if (G.enchHeld) {
      const e = ENCHANTS[G.enchHeld];
      bar.icon.setTexture('spark').setTint(e.tint).setVisible(true);
      bar.label.setText(e.name + '附魔').setColor(e.color);
    } else {
      bar.icon.setVisible(false);
      bar.label.setText('附魔栏（空）').setColor('#8a84a0');
    }
  },
  applyEnchant(target, enchId) {
    if (enchId === 'split' && target.cls === 'warrior') {
      this.floatText(target.x, target.y - 46, '分裂只能给弓手/术士', '#ff8888', 13);
      return false;
    }
    target.ench = enchId; // 再拖一个 = 替换，旧的消失
    recompute(target);
    this.refreshEnchVisual(target);
    this.syncUnitVisual(target);
    SFX.starup();
    this.floatText(target.x, target.y - 56, ENCHANTS[enchId].name + '附魔！', ENCHANTS[enchId].color, 16);
    return true;
  },

  /* ---------- 强化（M2：单击棋子面板） ---------- */
  showReinforce(u) {
    if (G.phase !== 'prep' || G.paused) return;
    this._rfUnit = u;
    this.refreshReinforcePanel();
    this.ui.reinforceBox.setVisible(true);
  },
  refreshReinforcePanel() {
    const u = this._rfUnit; const rf = this.ui.reinforceBox;
    if (!u || !rf) return;
    const cost = 3 + (u.reinforce || 0);
    rf._title.setText(u.name + '　★' + u.star + '　Lv' + u.level);
    const enchName = u.ench ? ENCHANTS[u.ench].name : '无';
    rf._stats.setText(
      '攻击 ' + u.atk + '　生命 ' + u.hp + '/' + u.maxHp + '\n' +
      '攻速 ' + u.aspd.toFixed(2) + '/秒　暴击 ' + Math.round(u.crit * 100) + '%\n' +
      '附魔：' + enchName + '　强化次数 ' + (u.reinforce || 0) + '\n' +
      '吞噬 ' + u.devourCount + '/5　升星进度 ' + u.starProg + '/3');
    rf._btnTxt.setText('强化 ' + cost + '金（攻/血+8%）');
    const afford = G.gold >= cost;
    rf._btnBg.setFillStyle(afford ? 0x3a3348 : 0x5b5470);
    rf._btnBg.setAlpha(afford ? 1 : 0.6);
  },
  doReinforce() {
    const u = this._rfUnit;
    if (!u || !u.alive || G.phase !== 'prep') return;
    const cost = 3 + (u.reinforce || 0);
    if (G.gold < cost) { this.floatText(GW / 2, 200, '金币不足', '#ff8888', 14); return; }
    G.gold -= cost;
    u.reinforce = (u.reinforce || 0) + 1;
    u.level += 1; // 走现有 lvlMult 曲线，和吞噬升级同一条 level
    recompute(u);
    SFX.starup();
    this.floatText(u.x, u.y - 56, '强化！Lv' + u.level, '#6fb7d9', 18);
    this.refreshReinforcePanel();
    this.updateTop();
  },
  buyXp() {
    if (G.phase !== 'prep') return;
    if (G.gold < 4) { this.floatText(1010, 640, '金币不足', '#ff8888', 13); return; }
    G.gold -= 4; G.xp += 4; SFX.coin();
    this.checkLevelUp();
    this.updateTop();
  },
  checkLevelUp() {
    while (G.xp >= G.xpNeed) {
      G.xp -= G.xpNeed; G.level += 1;
      G.xpNeed = G.level === 2 ? 6 : G.level === 3 ? 10 : 20;
      SFX.starup();
      this.floatText(GW / 2, 200, '升级！人口上限 ' + (4 + (G.level - 1)), '#6fb7d9', 20);
    }
  },

  /* ---------- 掷骰召唤（三颗骰子） ---------- */
  rollDice() {
    if (G.phase !== 'prep' || G.diceBusy) return;
    if (G.gold < 3) { this.ui.diceTxt.setText('金币不足'); return; }
    G.gold -= 3; G.diceBusy = true; SFX.pack();
    this.updateTop();
    const keys = ['warrior', 'archer', 'mage'];
    let ticks = 0;
    this.time.addEvent({
      delay: 90, repeat: 5, callback: () => {
        ticks++;
        SFX.click();
        for (const die of this.dice) {
          const k = keys[Math.floor(Math.random() * 3)];
          die._cls = k; die._img.setTexture(k + '_idle0');
          die.setAngle(Math.random() * 24 - 12);
          die.y = 578 + (Math.random() * 8 - 4);
        }
        if (ticks >= 6) this.resolveDice();
      }
    });
  },
  resolveDice() {
    G.diceBusy = false;
    for (const die of this.dice) { die.setAngle(0); die.y = 578; }
    const cls = this.dice.map(d => d._cls);
    const got = [];
    const summon = (c, rarity) => {
      const u = makeUnit(c, rarity, 'player');
      if (this.addToBench(u) !== -1) got.push(CLASSES[c].name);
    };
    if (cls[0] === cls[1] && cls[1] === cls[2]) {
      summon(cls[0], 'R'); summon(cls[0], 'N');
      if (got.length) { SFX.win(); SFX.hexGold(); this.ui.diceTxt.setText('三同！' + got[0] + '×2 入队'); }
      else this.ui.diceTxt.setText('三同！但备战席满了');
    } else if (cls[0] === cls[1] || cls[1] === cls[2] || cls[0] === cls[2]) {
      const pair = cls[0] === cls[1] ? cls[0] : cls[2];
      summon(pair, 'N');
      if (got.length) { SFX.win(); this.ui.diceTxt.setText('对子！' + got[0] + ' 入队'); }
      else this.ui.diceTxt.setText('对子！但备战席满了');
    } else {
      this.ui.diceTxt.setText('没中，再来！');
    }
    this.updateTop();
  },

  /* ---------- 开包 ---------- */
  openPack() {
    if (G.phase !== 'prep') return;
    if (G.gold < 5) { this.floatText(380, 510, '金币不足', '#ff8888', 13); return; }
    G.gold -= 5;
    const count = 1 + (G.buffs.packBonus || 0);
    const got = [];
    for (let i = 0; i < count; i++) {
      got.push({ cls: ['warrior', 'archer', 'mage'][Math.floor(Math.random() * 3)], rarity: weightedPick([['N', 60], ['R', 30], ['SR', 9], ['SSR', 1]]) });
    }
    G.packPity += 1;
    if (G.packPity >= 30) { got[0].rarity = 'SR'; G.packPity = 0; }
    if (got.some(g => g.rarity === 'SR' || g.rarity === 'SSR')) G.packPity = 0;
    SFX.pack();
    const best = got.slice().sort((a, b) => RARITY.findIndex(x => x.key === b.rarity) - RARITY.findIndex(x => x.key === a.rarity))[0];
    const r = RARITY.find(x => x.key === best.rarity);
    const rev = this.ui.revealBox;
    rev._img.setTexture(CLASSES[best.cls].tex + '_idle0');
    rev._name.setText(CLASSES[best.cls].name);
    rev._rar.setText(r.name + (best.rarity === 'SSR' ? '！！' : '')).setColor(r.color);
    rev.setVisible(true);
    if (best.rarity === 'SSR' || best.rarity === 'SR') SFX.hexGold();
    this.time.delayedCall(900, () => {
      rev.setVisible(false);
      for (const g of got) {
        const u = makeUnit(g.cls, g.rarity, 'player');
        if (this.addToBench(u) === -1) { G.gold += 5; this.floatText(380, 510, '备战席满了，已退 5金', '#ff8888', 13); break; }
      }
      this.updateTop();
    });
    this.updateTop();
  },

  /* ---------- 海克斯 ---------- */
  showHex() {
    const pool = HEX_POOL.filter(h => !G.hexesTaken.includes(h.id));
    const weights = { white: 50, blue: 30, purple: 15, gold: 5 };
    const choices = [];
    const bag = [...pool];
    while (choices.length < 3 && bag.length) {
      const total = bag.reduce((s, h) => s + weights[h.tier], 0);
      let roll = Math.random() * total, idx = 0;
      for (; idx < bag.length; idx++) { roll -= weights[bag[idx].tier]; if (roll <= 0) break; }
      choices.push(bag.splice(Math.min(idx, bag.length - 1), 1)[0]);
    }
    this._hexChoices = choices;
    choices.forEach((h, i) => {
      const c = this.ui.hexBox._cards[i];
      c.border.setFillStyle(hexColor(TIER_COLOR[h.tier]));
      c.tier.setText(TIER_NAME[h.tier] + '海克斯').setColor(TIER_COLOR[h.tier]);
      c.name.setText(h.name);
      c.desc.setText(h.desc);
    });
    this.ui.hexBox.setVisible(true);
    SFX.hexGold();
  },
  pickHex(i) {
    const h = this._hexChoices[i];
    if (!h) return;
    h.apply(G);
    G.hexesTaken.push(h.id);
    SFX.hexGold();
    this.ui.hexBox.setVisible(false);
    this.floatText(GW / 2, 200, '获得海克斯：' + h.name, TIER_COLOR[h.tier], 20);
    for (const u of [...G.field, ...G.bench]) if (u) { recompute(u); if (u.sprite) u.sprite.setScale(this.unitScale(u)); }
    G.wave += 1; G.rerolls = 0;
    if (G.buffs.ddFree) G.freeReroll = 1; // DD街区：新一波一次免费刷新
    this.refreshShop();
    G.phase = 'prep';
    this.ui.startBtn.setVisible(true); this.ui.startTxt.setVisible(true);
    this.saveGame();
    this.updateTop();
  }
});

/* ============================================================
   战斗引擎 + 按角色区分的攻击特效 + 打击感
   ============================================================ */
Object.assign(GameScene.prototype, {
  /* ---------- 特效 ---------- */
  floatText(x, y, str, color, size, big) {
    const t = this.add.text(x, y, str, {
      fontSize: (size || 15) + 'px', color: color || '#ffffff', fontFamily: 'monospace',
      fontStyle: 'bold', stroke: '#14101c', strokeThickness: 3
    }).setOrigin(0.5).setDepth(20);
    if (big) t.setScale(1.4);
    this.tweens.add({ targets: t, y: y - 34, alpha: 0, scaleX: big ? 1.7 : 1.1, scaleY: big ? 1.7 : 1.1, duration: 750, onComplete: () => t.destroy() });
  },
  spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const s = 3 + Math.random() * 4;
      const r = this.add.rectangle(x, y, s, s, color).setDepth(6);
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
      this.tweens.add({ targets: r, x: x + Math.cos(a) * v * 0.4, y: y + Math.sin(a) * v * 0.4 - 12, alpha: 0, duration: 380 + Math.random() * 220, onComplete: () => r.destroy() });
    }
  },
  coinDrop(x, y) { // 敌人死亡掉 3 枚金币（纯视觉）
    for (let i = 0; i < 3; i++) {
      const c = this.add.circle(x + (Math.random() * 30 - 15), y, 4, 0xc9a227).setDepth(7);
      this.tweens.add({ targets: c, y: y - 24 - Math.random() * 14, alpha: 0, duration: 500 + i * 80, onComplete: () => c.destroy() });
    }
  },
  hitSpark(x, y, color) {
    const s = this.add.image(x, y, 'spark').setTint(color).setScale(1.4).setDepth(7);
    this.tweens.add({ targets: s, scaleX: 2.2, scaleY: 2.2, alpha: 0, duration: 180, onComplete: () => s.destroy() });
    this.spawnParticles(x, y, color, 5, 90);
  },
  starburst(x, y) {
    this.spawnParticles(x, y, 0xc9a227, 16, 170);
    const r = this.add.circle(x, y, 10).setStrokeStyle(3, 0xc9a227).setDepth(7);
    this.tweens.add({ targets: r, scaleX: 4, scaleY: 4, alpha: 0, duration: 350, onComplete: () => r.destroy() });
  },
  ringFx(x, y, color, maxR) {
    const r = this.add.circle(x, y, 8).setStrokeStyle(4, color).setDepth(7);
    this.tweens.add({ targets: r, scaleX: maxR / 8, scaleY: maxR / 8, alpha: 0, duration: 420, onComplete: () => r.destroy() });
  },
  slashArc(x, y, color) {
    const g = this.add.graphics().setDepth(8);
    g.lineStyle(7, color, 0.95);
    g.beginPath(); g.arc(x, y, 34, -2.4, -0.5); g.strokePath();
    g.lineStyle(3, 0xc9a227, 0.9);
    g.beginPath(); g.arc(x, y, 26, -2.2, -0.7); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, scaleX: 1.25, scaleY: 1.25, duration: 180, onComplete: () => g.destroy() });
  },
  fireArrow(u, t, onHit, tint) {
    const a = this.add.image(u.x, u.y - 6, 'arrow').setDepth(6);
    if (tint) a.setTint(tint);
    a.setRotation(Math.atan2(t.y - u.y, t.x - u.x));
    this.tweens.add({ targets: a, x: t.x, y: t.y - 6, duration: 150, onComplete: () => { onHit(); this.time.delayedCall(200, () => a.destroy()); } }); // 箭插在目标身上 0.2 秒
  },
  fireOrb(u, t, onHit, tint) {
    const o = this.add.image(u.x, u.y - 10, 'orb').setDepth(6);
    if (tint) o.setTint(tint);
    this.tweens.add({
      targets: o, x: t.x, y: t.y - 6, duration: 220,
      onUpdate: () => { if (Math.random() < 0.5) this.spawnParticles(o.x, o.y, 0x8b3fd9, 1, 30); },
      onComplete: () => { o.destroy(); this.ringFx(t.x, t.y, 0x8b3fd9, 46); this.spawnParticles(t.x, t.y, 0x8b3fd9, 10, 130); onHit(); }
    });
  },
  groundCrack(x, y) { // 战士 / Boss 劈砍留下的地面裂纹，0.4 秒消失
    const g = this.add.graphics().setDepth(5);
    g.lineStyle(3, 0x14101c, 0.9);
    g.beginPath(); g.moveTo(x - 18, y + 16); g.lineTo(x - 4, y + 22); g.lineTo(x + 10, y + 18); g.lineTo(x + 20, y + 24); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, duration: 400, onComplete: () => g.destroy() });
  },
  bossSlamFx(u, t) {
    this.slashArc(t.x, t.y, 0xd97b3f);
    this.groundCrack(t.x, t.y);
    this.ringFx(t.x, t.y + 10, 0xd97b3f, 90);
    this.shake(220, 0.014);
    this.hitStop(110);
  },
  bossAoE(u) { // Boss 每 3 次攻击：骨刺冲击波（预警红圈 350ms 再落下）
    const cx = u.target ? u.target.x : u.x, cy = u.target ? u.target.y : u.y;
    const tele = this.add.circle(cx, cy, 130).setStrokeStyle(3, 0xa83232).setDepth(6).setAlpha(0.6);
    this.tweens.add({ targets: tele, alpha: 0.15, duration: 350, yoyo: true, onComplete: () => tele.destroy() });
    SFX.slam();
    this.time.delayedCall(350, () => {
      this.ringFx(cx, cy, 0xa83232, 130);
      for (const p of [...G.field]) {
        if (!p.alive) continue;
        if (Math.hypot(p.x - cx, p.y - cy) <= 130) {
          const dmg = Math.max(1, Math.round(u.atk * 0.5));
          p.hp -= dmg;
          p.poseUntil = this.time.now + 150;
          if (p.sprite) p.sprite.setTexture(p.tex + '_hit');
          this.floatText(p.x, p.y - 46, String(dmg), '#ff8888', 16);
          this.hitSpark(p.x, p.y - 6, 0xa83232);
          if (p.hp <= 0) this.killUnit(p);
        }
      }
    });
  },
  hitStop(ms) { G.hitStopUntil = this.time.now + ms; },
  bossIntro() {
    const flash = this.add.rectangle(0, 0, GW, GH, 0xffffff, 0.55).setOrigin(0, 0).setDepth(30);
    this.tweens.add({ targets: flash, alpha: 0, duration: 500, onComplete: () => flash.destroy() });
    const t = this.add.text(GW / 2, 240, '骷髅王 来袭！', { fontSize: '40px', color: '#a83232', fontFamily: 'monospace', fontStyle: 'bold', stroke: '#14101c', strokeThickness: 6 }).setOrigin(0.5).setDepth(31);
    this.tweens.add({ targets: t, alpha: 0, y: 210, duration: 1200, onComplete: () => t.destroy() });
    this.shake(300, 0.015);
    SFX.boss();
  },

  /* ---------- 战斗主循环 ---------- */
  tick(time, delta) {
    if (G.paused) return;
    if (G.phase !== 'battle') return;
    let dt = (delta / 1000) * G.speedMul;
    if (time < G.hitStopUntil) dt = 0; // 顿帧：单位逻辑冻结，视觉照常
    for (const u of [...G.field, ...G.enemies]) {
      if (!u.alive || !u.sprite) continue;
      u.animT += dt;
      // ---- M2：燃烧（每秒掉血） ----
      if (u.burnUntil && time >= u.burnUntil) { u.burnUntil = 0; u.burnDps = 0; }
      if (u.burnUntil && time >= (u.burnNext || 0)) {
        u.burnNext = time + 1000;
        u.hp -= u.burnDps;
        this.floatText(u.x, u.y - 46, '-' + u.burnDps, '#d97b3f', 12);
        this.spawnParticles(u.x, u.y - 10, 0xd97b3f, 3, 60);
        this.syncHpBar(u);
        if (u.hp <= 0) { this.killUnit(u); continue; }
      }
      // ---- M2：冻结（完全定住，不能动不能打） ----
      if (u.frozenUntil && time >= u.frozenUntil) this.clearFreeze(u);
      if (u.frozenUntil && time < u.frozenUntil) { this.setIdleFrame(u); this.syncHpBar(u); continue; }
      if (!u.target || !u.target.alive) u.target = this.acquireTarget(u);
      const t = u.target;
      if (!t) { this.setIdleFrame(u); continue; }
      const dx = t.x - u.x, dy = t.y - u.y;
      const dist = Math.hypot(dx, dy);
      const range = u.range + (t.isBoss ? 20 : 0) + (u.isBoss ? 10 : 0);
      const slowed = time < (u.slowUntil || 0); // 寒霜：移速+攻速都减 30%
      const sped = time < (u.speedBuffUntil || 0); // 速度恶魔：移速 +20%
      if (dist > range) {
        const step = u.speed * (slowed ? 0.7 : 1) * (sped ? 1.2 : 1) * dt;
        u.x += dx / dist * step; u.y += dy / dist * step;
        u.sprite.setPosition(u.x, u.y);
        this.setWalkFrame(u);
      } else {
        u.cd -= dt * (slowed ? 0.7 : 1);
        if (u.cd <= 0) { u.cd = 1 / u.aspd; this.doAttack(u, t); }
        this.setIdleFrame(u);
      }
      this.syncHpBar(u);
    }
    if (G.enemies.length && G.enemies.every(e => !e.alive)) this.endWave(true);
    else if (G.towerHp <= 0) this.endWave(false);
  },
  acquireTarget(u) {
    const foes = u.side === 'player' ? G.enemies : G.field;
    let best = null, bestD = Infinity;
    for (const f of foes) {
      if (!f.alive) continue;
      const d = Math.hypot(f.x - u.x, f.y - u.y);
      if (d < bestD) { bestD = d; best = f; }
    }
    if (best) return best;
    if (u.side === 'enemy' && G.towerHp > 0) {
      if (!this.towerTarget) this.towerTarget = { isTower: true, x: TOWER_POS.x + 34, y: TOWER_POS.y, alive: true };
      return this.towerTarget;
    }
    return null;
  },
  setWalkFrame(u) {
    const idx = Math.floor(u.animT / 0.1) % 4;
    const key = u.tex + '_w' + idx;
    if (u.sprite.texture.key !== key && this.time.now >= (u.poseUntil || 0)) {
      u.sprite.setTexture(key);
      // 走路弹跳：压低再弹回
      const sc = this.unitScale(u);
      this.tweens.add({ targets: u.sprite, scaleY: sc * 0.92, duration: 55, yoyo: true, onComplete: () => { if (u.sprite) u.sprite.setScale(sc); } });
    }
  },
  setIdleFrame(u) {
    if (this.time.now >= (u.poseUntil || 0)) {
      const key = u.tex + (Math.floor(u.animT / 0.6) % 2 === 0 ? '_idle0' : '_idle1'); // 待机眨眼
      if (u.sprite.texture.key !== key) u.sprite.setTexture(key);
    }
  },
  syncHpBar(u) {
    if (!u.hpBg || !u.hpFg) return;
    const off = u.isBoss ? 68 : u.isElite ? 58 : 54;
    const vis = u.alive && (u.side === 'enemy' || u.cell !== null);
    u.hpBg.setVisible(vis).setPosition(u.x, u.y - off);
    u.hpFg.setVisible(vis).setPosition(u.x - 28, u.y - off);
    u.hpFg.width = Math.max(0, 56 * u.hp / u.maxHp);
    u.hpFg.setFillStyle(u.hp / u.maxHp > 0.5 ? 0x3fae6a : u.hp / u.maxHp > 0.25 ? 0xd97b3f : 0xa83232);
  },

  /* ---------- 攻击（按角色区分特效） ---------- */
  doAttack(u, t) {
    u.atkCount += 1;
    u.poseUntil = this.time.now + 220;
    if (u.sprite) {
      // 攻击三段帧：蓄力 → 挥出 → 收势（12 张/秒）
      u.sprite.setTexture(u.tex + '_atk0');
      this.time.delayedCall(75, () => { if (u.alive && u.sprite && this.time.now < u.poseUntil) u.sprite.setTexture(u.tex + '_atk1'); });
      this.time.delayedCall(150, () => { if (u.alive && u.sprite && this.time.now < u.poseUntil) u.sprite.setTexture(u.tex + '_atk2'); });
      this.tweens.add({ targets: u.sprite, scaleX: this.unitScale(u) * 1.12, duration: 75, yoyo: true });
    }
    if (t.isTower) {
      this.time.delayedCall(90, () => { this.damageTower(u); this.hitSpark(TOWER_POS.x + 20, TOWER_POS.y, 0xd97b3f); });
      return;
    }
    const enchTint = u.ench ? ENCHANT_TINT[u.ench] : null; // 附魔：武器/弹道换色
    const split = u.ench === 'split' && (u.cls === 'archer' || u.cls === 'mage'); // 分裂：2 发各 60%
    if (u.cls === 'warrior') { // 战士：刀光弧 + 地面裂纹
      SFX.slash();
      this.slashArc(t.x, t.y, enchTint || 0xffffff);
      this.groundCrack(t.x, t.y);
      this.time.delayedCall(90, () => this.applyDamage(u, t, 1));
    } else if (u.cls === 'archer') { // 弓手：箭矢弹道（命中后插 0.2 秒）
      SFX.shoot();
      this.fireArrow(u, t, () => this.applyDamage(u, t, split ? 0.6 : 1), enchTint);
      if (split) this.time.delayedCall(120, () => { if (u.alive && t.alive) this.fireArrow(u, t, () => this.applyDamage(u, t, 0.6), enchTint); });
    } else if (u.cls === 'mage') { // 术士：法球 + 落点法环
      SFX.orb();
      this.fireOrb(u, t, () => this.applyDamage(u, t, split ? 0.6 : 1), enchTint);
      if (split) this.time.delayedCall(120, () => { if (u.alive && t.alive) this.fireOrb(u, t, () => this.applyDamage(u, t, 0.6), enchTint); });
    } else if (u.cls === 'boss') { // Boss：大剑劈砍 + 冲击波环，每 3 次骨刺 AoE
      SFX.slam();
      this.bossSlamFx(u, t);
      this.time.delayedCall(160, () => {
        this.applyDamage(u, t, 1);
        if (u.atkCount % 3 === 0) this.bossAoE(u);
      });
    } else { // 史莱姆 / 蝙蝠：近战扑咬
      SFX.hit();
      this.hitSpark(t.x, t.y - 6, 0x3fae6a);
      this.time.delayedCall(70, () => this.applyDamage(u, t, 1));
    }
  },
  applyDamage(att, def, mult) {
    if (!def.alive || !att.alive) return;
    let dmg = att.atk * mult;
    const isCrit = Math.random() < att.crit;
    if (isCrit) dmg *= (G.buffs.pearl ? 2.5 : 2); // 珠光莲花：暴伤 2→2.5 倍
    dmg = Math.max(1, Math.round(dmg));
    def.hp -= dmg;
    def.poseUntil = this.time.now + 150;
    if (def.sprite) {
      def.sprite.setTexture(def.tex + '_hit');
      this.tweens.add({ targets: def.sprite, angle: -8, duration: 80, yoyo: true, onComplete: () => { if (def.sprite) def.sprite.setAngle(0); } }); // 受击后仰
    }
    this.floatText(def.x + (Math.random() * 20 - 10), def.y - 46, String(dmg), isCrit ? '#c9a227' : '#ffffff', isCrit ? 26 : 16, isCrit);
    const sparkColor = att.ench ? ENCHANT_TINT[att.ench] // 附魔：命中火花换对应色
      : att.cls === 'warrior' ? 0xffffff : att.cls === 'archer' ? 0x3fae6a : att.cls === 'mage' ? 0x8b3fd9 : att.cls === 'boss' ? 0xd97b3f : 0x3fae6a;
    this.hitSpark(def.x, def.y - 6, sparkColor);
    if (isCrit) {
      SFX.crit();
      this.shake(140, 0.012);
      this.hitStop(90);
      this.starburst(def.x, def.y - 10);
    } else SFX.hit();
    // 飞身踢：直接处决生命低于 15% 的敌人
    if (G.buffs.execute && att.side === 'player' && def.hp > 0 && def.hp / def.maxHp < 0.15) {
      def.hp = 0;
      this.floatText(def.x, def.y - 66, '处决！', '#c9a227', 20);
      this.killUnit(def);
      this.syncHpBar(def);
      return;
    }
    if (def.hp > 0) this.applyHitEffects(att, def, dmg);
    this.syncHpBar(def);
    if (def.hp <= 0) this.killUnit(def);
  },
  /* ---------- M2：命中后效果（附魔 + 海克斯） ---------- */
  applyHitEffects(att, def, dmg) {
    const now = this.time.now;
    if (G.buffs.speedDemon && att.side === 'player') att.speedBuffUntil = now + 2000; // 速度恶魔
    if (att.side === 'player' && att.ench) {
      const immune = def.side === 'player' && G.buffs.colossus; // 巨像免疫减速/冻结
      switch (att.ench) {
        case 'fire': // 烈焰：点燃 3 点/秒 × 3 秒（刷新不叠加）
          def.burnUntil = now + 3000; def.burnDps = 3; def.burnNext = now + 1000;
          break;
        case 'frost': // 寒霜：减速 30% × 2 秒
          if (!immune) def.slowUntil = now + 2000;
          break;
        case 'freeze': // 冰冻：10% 概率冻结 1.5 秒
          if (!immune && Math.random() < 0.10) this.applyFreeze(def);
          break;
        case 'storm': // 雷霆：25% 概率闪电链
          if (Math.random() < 0.25) this.tryChain(att, def, dmg);
          break;
        case 'vamp': { // 吸血：15% 回血
          const heal = Math.max(1, Math.round(dmg * 0.15));
          att.hp = Math.min(att.maxHp, att.hp + heal);
          this.floatText(att.x, att.y - 56, '+' + heal, '#3fae6a', 13);
          this.syncHpBar(att);
          break;
        }
        default: break;
      }
    }
    // 弹跳：远程攻击命中后弹跳到附近敌人（40% 伤害）
    if (G.buffs.bounce && att.side === 'player' && (att.cls === 'archer' || att.cls === 'mage')) this.tryBounce(att, def, dmg);
  },
  nearestOtherFoe(att, around, maxDist) {
    const foes = att.side === 'player' ? G.enemies : G.field;
    let best = null, bestD = maxDist;
    for (const e of foes) {
      if (!e.alive || e === around) continue;
      const d = Math.hypot(e.x - around.x, e.y - around.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  },
  chainFx(x1, y1, x2, y2, color) { // 折线闪电 / 弹跳弧线
    const g = this.add.graphics().setDepth(8);
    g.lineStyle(3, color, 0.95);
    const mx = (x1 + x2) / 2 + (Math.random() * 20 - 10), my = (y1 + y2) / 2 + (Math.random() * 20 - 10);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(mx, my); g.lineTo(x2, y2); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, duration: 250, onComplete: () => g.destroy() });
  },
  dealBonusDamage(src, def, amount, tint, textColor) { // 链式/弹跳附加伤害（不递归触发）
    if (!def.alive) return;
    amount = Math.max(1, Math.round(amount));
    def.hp -= amount;
    def.poseUntil = this.time.now + 120;
    if (def.sprite) def.sprite.setTexture(def.tex + '_hit');
    this.floatText(def.x + (Math.random() * 16 - 8), def.y - 46, String(amount), textColor, 14);
    this.hitSpark(def.x, def.y - 6, tint);
    this.syncHpBar(def);
    if (def.hp <= 0) this.killUnit(def);
  },
  tryChain(att, def, dmg) {
    const t = this.nearestOtherFoe(att, def, 150);
    if (!t) return;
    SFX.zap();
    this.chainFx(def.x, def.y - 10, t.x, t.y - 10, 0xe3cf9e);
    this.dealBonusDamage(att, t, dmg * 0.5, 0xe3cf9e, '#e3cf9e');
  },
  tryBounce(att, def, dmg) {
    const t = this.nearestOtherFoe(att, def, 150);
    if (!t) return;
    this.chainFx(def.x, def.y - 10, t.x, t.y - 10, 0x8b3fd9);
    this.dealBonusDamage(att, t, dmg * 0.4, 0x8b3fd9, '#c9a227');
  },
  applyFreeze(u) {
    u.frozenUntil = this.time.now + 1500;
    if (u.sprite) u.sprite.setTint(0x9fd8ef);
    if (!u.frozenFx) u.frozenFx = this.add.image(u.x, u.y - 68, 'spark').setTint(0xffffff).setScale(1.2).setDepth(5);
    u.frozenFx.setVisible(true).setPosition(u.x, u.y - 68);
  },
  clearFreeze(u) {
    u.frozenUntil = 0;
    if (u.sprite) u.sprite.clearTint();
    if (u.frozenFx) u.frozenFx.setVisible(false);
  },
  damageTower(u) {
    const dmg = Math.max(1, Math.round(u.atk));
    G.towerHp = Math.max(0, G.towerHp - dmg);
    this.floatText(TOWER_POS.x, TOWER_POS.y - 60, '-' + dmg, '#ff8888', 16);
    this.shake(120, 0.008);
    SFX.hit();
    this.updateTop();
    if (G.towerHp <= 0) this.endWave(false);
  },
  killUnit(u) {
    u.alive = false; u.hp = 0; u.frozenUntil = 0;
    if (u.sprite) { this.tweens.killTweensOf(u.sprite); u.sprite.clearTint(); u.sprite.setTexture(u.tex + '_die'); }
    this.spawnParticles(u.x, u.y, u.side === 'player' ? 0xcfc9dd : 0x3fae6a, u.isBoss ? 30 : 12, 160);
    if (u.side === 'enemy') {
      if (G.stats) G.stats.kills += 1;
      this.coinDrop(u.x, u.y); // 敌人死亡掉金币（纯视觉，不加经济）
      if (G.buffs.soul) { // 吞噬灵魂：每击杀一个敌人，全队生命 +2（本局叠加）
        for (const p of [...G.field, ...G.bench]) {
          if (!p || !p.alive) continue;
          p.soulBonus = (p.soulBonus || 0) + 2;
          p.maxHp += 2;
          p.hp = Math.min(p.maxHp, p.hp + 2);
          this.syncHpBar(p);
        }
      }
    }
    if (u.isBoss) { this.shake(400, 0.02); this.hitStop(150); SFX.win(); }
    if (u.hpBg) u.hpBg.setVisible(false);
    if (u.hpFg) u.hpFg.setVisible(false);
    for (const s of u.starImgs) s.setVisible(false);
    if (u.devTxt) u.devTxt.setVisible(false);
    if (u.frozenFx) u.frozenFx.setVisible(false);
    if (u.glow) u.glow.setVisible(false);
    if (u.enchImg) u.enchImg.setVisible(false);
    if (u.sprite) this.tweens.add({ targets: u.sprite, alpha: 0, duration: 500, delay: 350, onComplete: () => { if (u.sprite) u.sprite.setVisible(false); } });
    if (u.side === 'player') G.field = G.field.filter(x => x !== u);
  },

  /* ---------- 波次流程 ---------- */
  startBattle() {
    if (G.phase !== 'prep' || G.paused) return;
    if (G.field.length === 0) { this.floatText(GW / 2, 200, '先拖至少 1 个棋子上场', '#ff8888', 16); return; }
    this.saveGame(); // 开打前存档：继续时回到本波备战
    this.ui.tutBox.setVisible(false); markTutDone(); // 新手引导完成
    this.ui.reinforceBox.setVisible(false);
    BGM.setMode(G.wave === 5 ? 'boss' : 'normal');
    G.phase = 'battle';
    this.ui.startBtn.setVisible(false); this.ui.startTxt.setVisible(false);
    SFX.tone(220, 0.15, 'sawtooth', 0.10, 440);
    this.updateTop();
    this.spawnWave(G.wave);
  },
  spawnWave(w) {
    G.enemies = [];
    const spec = WAVES[w - 1];
    let idx = 0;
    for (const [kind, n] of spec.list) {
      for (let i = 0; i < n; i++) {
        const e = makeEnemy(kind, w);
        const row = (idx + Math.floor(Math.random() * 2)) % 4;
        e.x = 1200 + Math.random() * 40;
        e.y = 120 + row * 96 + (Math.random() * 20 - 10);
        G.enemies.push(e);
        this.time.delayedCall(idx * 350, () => {
          if (G.phase !== 'battle') return;
          this.spawnUnitSprite(e);
          e.sprite.setFlipX(true);
          e.sprite.setScale(e.baseScale);
          e.sprite.setTexture(e.tex + '_idle0');
          this.syncHpBar(e);
          this.spawnParticles(e.x, e.y, 0x8b3fd9, 8, 100);
          if (e.isBoss) this.bossIntro();
        });
        idx++;
      }
    }
  },
  endWave(win) {
    if (G.phase !== 'battle') return;
    G.phase = 'settle';
    if (!win) { this.gameOver(false); return; }
    const interest = Math.min(G.interestCap, Math.floor(G.gold / 10));
    const gain = G.baseGold + 1 + interest;
    G.gold += gain;
    if (G.stats) G.stats.goldEarned += gain;
    SFX.coin();
    this.floatText(GW / 2, 200, '第 ' + G.wave + ' 波胜利！+' + gain + '金（基础' + G.baseGold + ' 胜利1 利息' + interest + '）', '#e3cf9e', 18);
    if (G.wave === 3) {
      this.time.delayedCall(1200, () => { if (G.phase === 'settle') this.showHex(); });
      return;
    }
    if (G.wave === 5) { this.time.delayedCall(1200, () => this.gameOver(true)); return; }
    this.time.delayedCall(1200, () => {
      if (G.phase !== 'settle') return;
      G.wave += 1; G.rerolls = 0;
      if (G.buffs.ddFree) G.freeReroll = 1; // DD街区：新一波一次免费刷新
      this.refreshShop();
      G.phase = 'prep';
      this.ui.startBtn.setVisible(true); this.ui.startTxt.setVisible(true);
      this.saveGame();
      this.updateTop();
    });
  },
  gameOver(win) {
    G.phase = 'over';
    saveBest(G.wave);
    clearSave();
    if (win) { // 胜利姿势
      for (const u of [...G.field]) if (u.alive && u.sprite) u.sprite.setTexture(u.tex + '_win');
    }
    const secs = G.stats ? Math.floor((Date.now() - G.stats.startTime) / 1000) : 0;
    const stats = '用时 ' + Math.floor(secs / 60) + '分' + (secs % 60) + '秒　击杀 ' + (G.stats ? G.stats.kills : 0) + '　获得金币 ' + (G.stats ? G.stats.goldEarned : 0) + '\n最高波次 ' + loadBest() + ' / 5　等级 Lv' + G.level + '　海克斯 ' + G.hexesTaken.length + ' 个';
    this.ui.endBox._title.setText(win ? '胜利！' : '失败…').setColor(win ? '#c9a227' : '#a83232');
    this.ui.endBox._stats.setText((win ? '你守住了 5 波进攻，军团无敌！' : '塔被攻破了，军团覆灭…') + '\n' + stats);
    this.ui.endBox.setVisible(true);
    if (win) SFX.win(); else SFX.lose();
  }
});

/* ============================================================
   暂停 / 回主菜单 / 存档读档
   ============================================================ */
Object.assign(GameScene.prototype, {
  shake(dur, intensity) { if (SETTINGS.shake) this.cameras.main.shake(dur, intensity); },
  pauseGame() {
    if (G.phase === 'over' || G.paused) return;
    G.paused = true;
    this.ui.pauseOverlay.setVisible(true);
    this.tweens.pauseAll();
    this.time.paused = true;
    BGM.paused = true;
    if (SFX.ctx && SFX.ctx.state === 'running') SFX.ctx.suspend();
  },
  resumeGame() {
    G.paused = false;
    this.ui.pauseOverlay.setVisible(false);
    this.tweens.resumeAll();
    this.time.paused = false;
    BGM.paused = false;
    if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
  },
  quitToMenu() {
    this.saveGame();
    G.paused = false;
    this.tweens.resumeAll();
    this.time.paused = false;
    BGM.paused = false;
    this.scene.stop('Game');
    this.scene.start('Menu');
  },
  saveGame() {
    if (G.phase === 'over' || G.phase === 'battle') return; // 只在备战/结算间隙存
    const snap = {
      wave: G.wave, gold: G.gold, level: G.level, xp: G.xp, xpNeed: G.xpNeed,
      towerHp: G.towerHp, buffs: G.buffs, hexesTaken: G.hexesTaken, packPity: G.packPity,
      field: G.field.map(u => snapUnit(u)), bench: G.bench.map(u => u ? snapUnit(u) : null),
      shop: G.shop, enchHeld: G.enchHeld || null, shopEnch: G.shopEnch || null, freeReroll: G.freeReroll || 0
    };
    try { localStorage.setItem('syjt_save_v1', JSON.stringify(snap)); } catch (e) {}
  },
  loadSave() {
    const snap = loadSave();
    this.resetGame();
    if (!snap) return;
    // 移除开局赠送的两个单位
    for (const u of [...G.bench]) if (u) this.destroyUnitVisual(u);
    G.bench = [null, null, null, null, null];
    G.field = [];
    Object.assign(G, {
      wave: snap.wave, gold: snap.gold, level: snap.level, xp: snap.xp, xpNeed: snap.xpNeed,
      towerHp: snap.towerHp, buffs: snap.buffs || {}, hexesTaken: snap.hexesTaken || [], packPity: snap.packPity || 0
    });
    G.shop = snap.shop && snap.shop.length ? snap.shop : G.shop;
    G.enchHeld = snap.enchHeld || null;
    G.shopEnch = snap.shopEnch || null;
    G.freeReroll = snap.freeReroll || 0;
    (snap.field || []).forEach(su => {
      const u = restoreUnit(su);
      const pt = cellCenter(su.cell.c, su.cell.r);
      G.field.push(u); u.cell = su.cell; u.x = pt.x; u.y = pt.y;
      this.spawnUnitSprite(u);
      u.sprite.setScale(this.unitScale(u)).setTexture(u.tex + '_idle0');
      this.refreshStars(u);
      this.refreshEnchVisual(u);
      this.syncUnitVisual(u);
    });
    (snap.bench || []).forEach((su, i) => {
      if (!su) return;
      const u = restoreUnit(su);
      G.bench[i] = u; u.cell = null; u.x = 496 + i * 58; u.y = 666;
      this.spawnUnitSprite(u);
      u.sprite.setScale(this.unitScale(u)).setTexture(u.tex + '_idle0');
      this.refreshStars(u);
      this.refreshEnchVisual(u);
      this.syncUnitVisual(u);
    });
    this.renderShop();
    this.renderEnchBar();
    this.updateTop();
  }
});

/* ============================================================
   主菜单
   ============================================================ */
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  create() {
    buildAllTextures(this);
    // 夜色背景
    this.add.rectangle(0, 0, GW, GH, 0x14101c).setOrigin(0, 0);
    this.add.circle(1080, 110, 46, 0xe3cf9e);
    this.add.circle(1066, 100, 40, 0x14101c); // 月牙
    // 草地 + 剪影棋子来回走动
    this.add.rectangle(0, 420, GW, 320, 0x1e5233).setOrigin(0, 0);
    const keys = ['warrior_idle0', 'archer_idle0', 'mage_idle0', 'slime_idle0', 'bat_idle0'];
    for (let i = 0; i < 5; i++) {
      const s = this.add.image(150 + i * 220, 560, keys[i]).setScale(2.5).setTint(0x241f30).setAlpha(0.85);
      this.tweens.add({ targets: s, x: s.x + 40, duration: 2600 + i * 300, yoyo: true, repeat: -1 });
    }
    // LOGO
    this.add.text(GW / 2, 150, '噬运军团', { fontSize: '72px', color: '#c9a227', fontFamily: 'monospace', fontStyle: 'bold', stroke: '#14101c', strokeThickness: 8 }).setOrigin(0.5);
    this.add.text(GW / 2, 215, '像素自走棋 · 吞噬进化', { fontSize: '20px', color: '#cfc9dd', fontFamily: 'monospace' }).setOrigin(0.5);
    // 按钮
    const hasSave = !!loadSave();
    const best = loadBest();
    menuBtn(this, GW / 2, 320, 260, 52, '开始游戏', () => { clearSave(); this.scene.start('Game'); }, 22);
    const cont = menuBtn(this, GW / 2, 390, 260, 52, '继续', () => { CONTINUE_RUN = true; this.scene.start('Game'); }, 22);
    if (!hasSave) { cont.bg.setAlpha(0.4); cont.txt.setAlpha(0.4); cont.bg.disableInteractive(); }
    menuBtn(this, GW / 2, 460, 260, 52, '玩法说明', () => this._howto.setVisible(true), 22);
    menuBtn(this, GW / 2, 530, 260, 52, '设置', () => this._settings.setVisible(true), 22);
    this.add.text(GW / 2, 600, best > 0 ? '最高波次：第 ' + best + ' 波 / 5' : '最高波次：—', { fontSize: '16px', color: '#8a84a0', fontFamily: 'monospace' }).setOrigin(0.5);
    this.add.text(GW - 16, GH - 16, 'v0.3', { fontSize: '14px', color: '#5b5470', fontFamily: 'monospace' }).setOrigin(1, 1);
    this._settings = createSettingsOverlay(this, 60);
    this._howto = createHowToOverlay(this, 60);
    this.input.on('pointerdown', () => SFX.ac());
  }
}

/* ============================================================
   启动
   ============================================================ */
const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: GW,
  height: GH,
  backgroundColor: '#241f2e',
  pixelArt: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
};
window.addEventListener('load', () => { new Phaser.Game(config); });
</script>
