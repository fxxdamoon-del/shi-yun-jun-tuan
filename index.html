  addToBench(u) {
    const idx = G.bench.indexOf(null);
    if (idx === -1) return -1;
    G.bench[idx] = u;
    u.cell = null;
    const cx = 496 + idx * 58, cy = 666;
    u.x = cx; u.y = cy;
    if (!u.sprite) this.spawnUnitSprite(u);
    u.sprite.setScale(this.unitScale(u)); this.setUnitFrame(u, 'idle0');
    this.syncUnitVisual(u);
    return idx;
  }
});

/* ============================================================
   交互：拖拽布阵 / 吞噬 / 商店 / 掷骰 / 开包 / 海克斯
   ============================================================ */
function hexColor(s) { return parseInt(s.slice(1), 16); }

Object.assign(GameScene.prototype, {
  /* ---------- 拖拽 ---------- */
  clearDragHi() {
    if (this._dragHi && this._dragHi.sprite) this._dragHi.sprite.clearTint();
    this._dragHi = null;
    if (this._dragHiCell) {
      const cell = this._dragHiCell;
      this.setCellHi(cell, false);
      this._dragHiCell = null;
    }
  },
  unitAtCell(c, r) { return G.field.find(u => u.alive && u.cell && u.cell.c === c && u.cell.r === r) || null; },
  unitAtPoint(x, y, exclude) {
    for (const u of G.field) {
      if (!u.alive || u === exclude || !u.sprite) continue;
      if (Math.abs(u.x - x) < 38 && Math.abs(u.y - y) < 42) return u;
    }
    return null;
  },
  benchSlotAt(x, y) {
    if (y < 640 || y > 692 || x < 470 || x >= 760) return null;
    const localX = (x - 470) % 58;
    if (localX > 52) return null;
    return Math.floor((x - 470) / 58);
  },
  unitAtPointAny(x, y) { // 场上 + 备战席（附魔拖放用）
    for (const u of [...G.field, ...G.bench]) {
      if (!u || !u.alive || !u.sprite) continue;
      if (Math.abs(u.x - x) < 38 && Math.abs(u.y - y) < 42) return u;
    }
    return null;
  },
  onDragStart(p, o) {
    this._dragSX = p.x; this._dragSY = p.y;
    if (o._enchSlot) { // 拖附魔栏里的附魔
      if (!G.enchHeld || G.phase !== 'prep' || G.paused) return;
      G.dragEnch = G.enchHeld;
      const e = ENCHANTS[G.enchHeld];
      this._enchGhost = this.add.image(p.x, p.y, 'spark').setTint(e.tint).setScale(2).setDepth(60);
      return;
    }
    const u = o._unit;
    if (!u || !u.alive || u.side !== 'player') return;
    if (G.phase !== 'prep' || G.paused) { G.dragUnit = null; return; }
    G.dragUnit = u;
    this.children.bringToTop(o);
    o.setScale(o.scaleX * 1.15);
  },
  onDrag(p, o, x, y) {
    if (G.dragEnch && this._enchGhost) { // 附魔拖放：跟随 + 悬停棋子绿光预告
      this._enchGhost.setPosition(x, y);
      this.clearDragHi();
      const target = this.unitAtPointAny(x, y);
      if (target) {
        target.sprite.setTint(0x66ff66);
        this._dragHi = target;
      }
      return;
    }
    const u = G.dragUnit;
    if (!u || o._unit !== u) return;
    o.x = x; o.y = y;
    this.clearDragHi();
    if (u.cell === null) { // 备战席棋子：悬停场上棋子 = 吞噬预告
      const target = this.unitAtPoint(x, y, u);
      if (target) {
        target.sprite.setTint(0xff6666);
        this._dragHi = target;
        const same = target.cls === u.cls && target.star === u.star;
        this.ui.waveInfo.setText('松手：' + u.name + ' 吞噬 ' + target.name + '（' + (same ? '升星进度+1' : '经验+' + RARITY_XP[u.rarity]) + '）');
        return;
      }
    }
    const cell = cellAt(x, y);
    if (cell && !this.unitAtCell(cell.c, cell.r)) {
      this.setCellHi(cell, true);
      this._dragHiCell = cell;
    }
  },
  onDragEnd(p, o) {
    if (G.dragEnch) { // 附魔拖放结束
      const enchId = G.dragEnch;
      G.dragEnch = null;
      if (this._enchGhost) { this._enchGhost.destroy(); this._enchGhost = null; }
      const target = this.unitAtPointAny(p.x, p.y);
      this.clearDragHi();
      if (target && this.applyEnchant(target, enchId)) {
        G.enchHeld = null;
        this.renderEnchBar();
        this.renderShop();
      }
      this.updateTop();
      return;
    }
    const u = G.dragUnit;
    G.dragUnit = null;
    if (!u) return;
    this.clearDragHi();
    this.updateTop();
    // 单击（几乎没移动）= 打开强化面板，不走布阵逻辑
    const moved = Math.hypot(p.x - (this._dragSX ?? p.x), p.y - (this._dragSY ?? p.y));
    if (moved < 8 && G.phase === 'prep' && !G.paused) {
      u.sprite.setScale(this.unitScale(u)); // 拖拽时放大了 1.15 倍，单击要复原
      this.syncUnitVisual(u);
      this.showReinforce(u);
      return;
    }
    const x = p.x, y = p.y;
    const bIdx = this.benchSlotAt(x, y);
    if (bIdx !== null) { this.moveToBench(u, bIdx); return; }
    const target = this.unitAtPoint(x, y, u);
    if (target) {
      if (u.cell === null) { this.doDevour(target, u); return; }
      this.swapCells(u, target); return;
    }
    const cell = cellAt(x, y);
    if (cell) {
      const occ = this.unitAtCell(cell.c, cell.r);
      if (!occ) { this.placeOnField(u, cell); return; }
      if (u.cell !== null) { this.swapCells(u, occ); return; }
      this.swapBenchField(u, occ); return;
    }
    this.syncUnitVisual(u); // 哪都没拖到，弹回原位
  },
  placeOnField(u, cell) {
    if (u.cell === null) {
      const cap = 4 + (G.level - 1);
      if (G.field.length >= cap) {
        this.floatText(400, 200, '人口已满（' + cap + '），先升级', '#ff8888', 15);
        this.syncUnitVisual(u); this.updateTop();
        return false;
      }
      const bi = G.bench.indexOf(u);
      if (bi !== -1) G.bench[bi] = null;
      G.field.push(u);
    }
    u.cell = cell;
    const pt = cellCenter(cell.c, cell.r);
    u.x = pt.x; u.y = pt.y;
    u.sprite.setScale(this.unitScale(u)); this.setUnitFrame(u, 'idle0');
    this.syncUnitVisual(u);
    this.updateTop();
    return true;
  },
  moveToBench(u, idx) {
    const occ = G.bench[idx];
    if (occ === u) { this.syncUnitVisual(u); return; }
    const oldCell = u.cell;
    const oldBench = u.cell === null ? G.bench.indexOf(u) : -1;
    if (oldCell) { G.field = G.field.filter(x => x !== u); u.cell = null; }
    else if (oldBench !== -1) G.bench[oldBench] = null;
    if (occ) {
      if (oldCell) { // 占位者顶替上场
        G.field.push(occ);
        occ.cell = oldCell;
        const pt = cellCenter(oldCell.c, oldCell.r);
        occ.x = pt.x; occ.y = pt.y;
        occ.sprite.setScale(this.unitScale(occ)); this.setUnitFrame(occ, 'idle0');
        this.syncUnitVisual(occ);
      } else { // 占位者换到拖动者原来的备战席格
        G.bench[oldBench] = occ;
        occ.x = 496 + oldBench * 58; occ.y = 666;
        occ.sprite.setScale(this.unitScale(occ));
        this.syncUnitVisual(occ);
      }
    }
    G.bench[idx] = u;
    u.x = 496 + idx * 58; u.y = 666;
    u.sprite.setScale(this.unitScale(u)); this.setUnitFrame(u, 'idle0');
    this.syncUnitVisual(u);
    this.updateTop();
  },
  swapCells(u, v) {
    const cu = u.cell, cv = v.cell;
    u.cell = cv; v.cell = cu;
    const pu = cellCenter(cv.c, cv.r), pv = cellCenter(cu.c, cu.r);
    u.x = pu.x; u.y = pu.y; v.x = pv.x; v.y = pv.y;
    this.syncUnitVisual(u); this.syncUnitVisual(v);
    SFX.click();
  },
  swapBenchField(benchU, fieldU) {
    const bi = G.bench.indexOf(benchU);
    const cell = fieldU.cell;
    G.field = G.field.filter(x => x !== fieldU);
    G.bench[bi] = fieldU;
    fieldU.cell = null;
    fieldU.x = 496 + bi * 58; fieldU.y = 666;
    fieldU.sprite.setScale(this.unitScale(fieldU)); this.setUnitFrame(fieldU, 'idle0');
    this.syncUnitVisual(fieldU);
    G.field.push(benchU);
    benchU.cell = cell;
    const pt = cellCenter(cell.c, cell.r);
    benchU.x = pt.x; benchU.y = pt.y;
    benchU.sprite.setScale(this.unitScale(benchU)); this.setUnitFrame(benchU, 'idle0');
    this.syncUnitVisual(benchU);
    this.updateTop();
  },

  /* ---------- 吞噬（§5：同种同星升星进度，异种加经验，衰减可见） ---------- */
  doDevour(target, food) {
    if (G.phase !== 'prep') return;
    if (!G.buffs.freeDevour && target.devourCount >= 5) {
      this.floatText(target.x, target.y - 46, '吞噬槽已满（5/5）', '#ff8888', 14);
      this.syncUnitVisual(food); SFX.click();
      return;
    }
    const bi = G.bench.indexOf(food);
    if (bi !== -1) G.bench[bi] = null;
    const fs = food.sprite;
    if (fs) this.tweens.add({ targets: fs, x: target.x, y: target.y, scaleX: 0.2, scaleY: 0.2, duration: 220, onComplete: () => { if (food.sprite) this.destroyUnitVisual(food); } });
    this.spawnParticles(target.x, target.y, 0xc9a227, 10, 120);
    SFX.devour();
    const decay = G.buffs.freeDevour ? 1 : DEVOUR_DECAY[Math.min(target.devourCount, 4)];
    const devBonus = 1 + (G.buffs.devour || 0);
    if (food.cls === target.cls && food.star === target.star) {
      target.starProg += 1;
      if (target.starProg >= 3) {
        target.starProg = 0; target.star += 1; recompute(target);
        this.refreshStars(target);
        this.starburst(target.x, target.y);
        SFX.starup();
        this.floatText(target.x, target.y - 56, '升星！★' + target.star, '#c9a227', 22);
      } else {
        this.floatText(target.x, target.y - 46, '升星进度 ' + target.starProg + '/3', '#e3cf9e', 14);
      }
    } else {
      const gain = Math.max(1, Math.round(RARITY_XP[food.rarity] * decay * devBonus));
      target.xp += gain;
      let lv = '';
      while (target.xp >= 10) { target.xp -= 10; target.level += 1; lv = ' 升级 Lv' + target.level; recompute(target); }
      this.floatText(target.x, target.y - 46, '+' + gain + '经验' + (decay < 1 ? '（衰减' + Math.round(decay * 100) + '%）' : '') + lv, '#e3cf9e', 14);
    }
    if (!G.buffs.freeDevour) target.devourCount += 1;
    this.syncUnitVisual(target);
    this.updateTop();
  },

  /* ---------- 商店 / 经验 ---------- */
  rollShopCard() {
    const t = G.level === 1 ? [['N', 100]] : G.level === 2 ? [['N', 70], ['R', 25], ['SR', 5]] : [['N', 50], ['R', 35], ['SR', 15]];
    return { cls: ['warrior', 'archer', 'mage'][Math.floor(Math.random() * 3)], rarity: weightedPick(t) };
  },
  refreshShop() {
    G.shop = [this.rollShopCard(), this.rollShopCard(), this.rollShopCard()];
    G.shopEnch = this.rollEnchantCard();
    this.renderShop();
  },
  renderShop() {
    G.shop.forEach((card, i) => {
      const c = this.shopCards[i];
      const r = RARITY.find(x => x.key === card.rarity);
      c.border.setFillStyle(hexColor(r.color));
      c.img.setTexture(SHEET_KEY[CLASSES[card.cls].tex], 0).clearTint().setAlpha(1).setScale(0.85);
      c.name.setText(CLASSES[card.cls].name + ' · ' + r.name).setColor(p2Dark(r.color));
      c.cost.setText(r.cost + '金');
      c.tag.setVisible(false);
    });
    // 第 4 张：附魔卡（金边 +「附魔」角标）
    const ec = this.shopCards[3];
    const e = G.shopEnch ? ENCHANTS[G.shopEnch] : null;
    ec.border.setFillStyle(0xc9a227);
    if (e) {
      ec.img.setTexture('spark').setTint(e.tint).setAlpha(1).setScale(2.4);
      ec.name.setText(e.name).setColor(p2Dark(e.color));
      ec.cost.setText(e.cost + '金');
      ec.tag.setVisible(true);
    } else {
      ec.img.setTexture('spark').setTint(0x5b5470).setAlpha(0.35).setScale(2.4);
      ec.name.setText('（已购）').setColor('#6e4f3a');
      ec.cost.setText('');
      ec.tag.setVisible(false);
    }
    ec.bg.setAlpha(G.enchHeld ? 0.45 : 1); // 附魔栏已占时置灰
  },
  buyShop(i) {
    if (G.phase !== 'prep') return;
    const card = G.shop[i]; if (!card) return;
    const r = RARITY.find(x => x.key === card.rarity);
    if (G.gold < r.cost) { this.floatText(829 + i * 122, 500, '金币不足', '#ff8888', 13); return; }
    if (G.bench.indexOf(null) === -1) { this.floatText(829 + i * 122, 500, '备战席满了', '#ff8888', 13); return; }
    G.gold -= r.cost;
    const u = makeUnit(card.cls, card.rarity, 'player');
    this.addToBench(u);
    SFX.coin();
    this.floatText(u.x, u.y - 30, CLASSES[card.cls].name + ' 入队', r.color, 13);
    G.shop[i] = this.rollShopCard();
    this.renderShop();
    this.updateTop();
  },
  rerollShop() {
    if (G.phase !== 'prep') return;
    let cost = 2 + G.rerolls;
    let free = false;
    if (G.freeReroll > 0) { free = true; G.freeReroll -= 1; } // DD街区：每波一次免费刷新
    else if (G.buffs.goldenTicket && Math.random() < 0.25) { free = true; this.floatText(845, 640, '黄金门票！本次免费', '#c9a227', 13); }
    if (!free) {
      if (G.gold < cost) { this.floatText(845, 640, '金币不足', '#ff8888', 13); return; }
      G.gold -= cost; G.rerolls += 1;
    }
    this.refreshShop();
    SFX.click();
    this.updateTop();
  },

  /* ---------- 附魔（M2） ---------- */
  rollEnchantCard() {
    const ids = Object.keys(ENCHANTS).filter(id => {
      if (id === 'split') { // 分裂：场上+备战席没有远程棋子时不刷
        return [...G.field, ...G.bench].some(u => u && (u.cls === 'archer' || u.cls === 'mage'));
      }
      return true;
    });
    return ids[Math.floor(Math.random() * ids.length)];
  },
  buyEnchant() {
    if (G.phase !== 'prep') return;
    const e = G.shopEnch ? ENCHANTS[G.shopEnch] : null;
    if (!e) return;
    if (G.enchHeld) { this.floatText(1195, 500, '先用掉手里的附魔', '#ff8888', 13); return; }
    if (G.gold < e.cost) { this.floatText(1195, 500, '金币不足', '#ff8888', 13); return; }
    G.gold -= e.cost;
    G.enchHeld = e.id;
    G.shopEnch = null; // 买走后该格变空，下次刷新再出
    SFX.coin();
    this.floatText(1195, 500, e.name + '附魔入手，拖到棋子身上', e.color, 13);
    this.renderShop();
    this.renderEnchBar();
    this.updateTop();
  },
  renderEnchBar() {
    const bar = this.ui.enchBar;
    if (!bar) return;
    if (G.enchHeld) {
      const e = ENCHANTS[G.enchHeld];
      bar.icon.setTexture('spark').setTint(e.tint).setVisible(true);
      bar.label.setText(e.name + '附魔').setColor(p2Dark(e.color));
    } else {
      bar.icon.setVisible(false);
      bar.label.setText('附魔栏（空）').setColor('#6e4f3a');
    }
  },

  /* ---------- M4：遗物图标栏 + 详情 ---------- */
  renderRelicRow() { // 底部图标栏：按 G.relics 顺序重画，28×28 横排
    const row = this.ui.relicRow;
    if (!row) return;
    row.removeAll(true);
    G.relics.forEach((id, i) => {
      const r = relicById(id);
      if (!r) return;
      const cx = 30 + i * 34 + 14, cy = 656 + 14;
      const tile = this.add.rectangle(cx, cy, 28, 28, 0x6e4f3a).setStrokeStyle(1, 0xc9a227);
      const img = this.add.image(cx, cy, r.tex).setScale(1.75).setInteractive();
      img._relicId = id;
      img.on('pointerdown', () => this.showRelicDetail(id));
      row.add([tile, img]);
    });
  },
  showRelicDetail(id) {
    const r = relicById(id);
    if (!r) return;
    const d = this.ui.relicDetail;
    d._icon.setTexture(r.tex);
    d._title.setText(r.name);
    d._desc.setText(r.desc);
    let st = '已拥有';
    if (id === 'crown') st = '当前加成：' + CLASSES[this.crownClass()].name + '（阵容中数量最多）';
    else if (id === 'bell') st = G.bellUsed ? '本波已触发' : '本波未触发';
    else if (id === 'mirror') st = G.previewFace ? '已预见：下一摇首颗是' + CLASSES[G.previewFace].name : '未中时预见下一摇';
    d._status.setText(st);
    d.setVisible(true);
    SFX.click();
  },
  /* ---------- M5 §9：敌人详情 + 战绩面板 ---------- */
  showEnemyDetail(e) {
    if (!e || !e.alive) return;
    const d = this.ui.enemyDetail;
    if (!d) return;
    const rank = e.isBoss ? 'Boss' : e.isElite ? '精英' : '普通';
    d._title.setText(e.name + ' · ' + rank);
    const key = sheetKeyFor(e);
    if (key && this.textures.exists(key)) d._icon.setTexture(key, 0);
    else if (this.textures.exists(e.tex + '_idle0')) d._icon.setTexture(e.tex + '_idle0');
    d._icon.setScale(e.tex === 'boss' ? 0.35 : 0.5);
    const trait = e.isBoss ? 'Boss：攻高血厚' : e.isElite ? '生命×2　攻击×1.5' : e.cls === 'bat' ? '高速' : '成群出现';
    d._stats.setText(
      '生命 ' + Math.max(0, Math.round(e.hp)) + '/' + e.maxHp + '　攻击 ' + e.atk + '\n' +
      '攻速 ' + e.aspd + '/秒　移速 ' + e.speed + '\n' +
      '特性：' + trait);
    d.setVisible(true);
    SFX.click();
  },
  showRankPanel(onClose) {
    const rk = this.ui.rankBox;
    if (!rk) return;
    this._rankOnClose = onClose || null;
    this._rankTab = 'dmg';
    rk._title.setText(this._rankOnClose ? '第 ' + G.wave + ' 波战绩' : '战绩');
    this.renderRankRows();
    rk.setVisible(true);
    SFX.click();
  },
  hideRankPanel() {
    const rk = this.ui.rankBox;
    if (rk) rk.setVisible(false);
    if (this._rankOnClose) { const cb = this._rankOnClose; this._rankOnClose = null; cb(); } // 只调一次
  },
  renderRankRows() {
    const rk = this.ui.rankBox;
    if (!rk) return;
    for (const el of (this._rankRowEls || [])) { if (el && el.active) el.destroy(); }
    this._rankRowEls = [];
    const addRow = el => { rk.add(el); this._rankRowEls.push(el); return el; };
    const setTab = (tab, active) => { tab.bg.setFillStyle(active ? 0xc9a227 : 0x6e4f3a); tab.txt.setColor(active ? '#3a2a1c' : '#f2ead8'); };
    setTab(rk._tabDmg, this._rankTab === 'dmg');
    setTab(rk._tabTaken, this._rankTab === 'taken');
    const tab = this._rankTab || 'dmg';
    const rowsFor = kind => {
      let rows;
      if (kind === 'wave') {
        rows = (G.lastWaveRank || []).map(e => ({ name: e.name, tex: e.tex, isElite: !!e.isElite, star: e.star || 1, val: tab === 'dmg' ? (e.dmgDealt || 0) : (e.dmgTaken || 0) }));
      } else {
        rows = [...G.field, ...G.bench.filter(u => u), ...G.fallen].map(u => ({ name: u.name, tex: u.tex, isElite: !!u.isElite, star: u.star || 1, val: tab === 'dmg' ? (u.dmgDealtTotal || 0) : (u.dmgTakenTotal || 0) }));
      }
      return rows.filter(r => r.val > 0).sort((a, b) => (b.val - a.val) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)).slice(0, 4);
    };
    const drawSection = (rows, y0) => {
      if (!rows.length) {
        addRow(this.add.text(GW / 2, y0, '暂无数据', { fontSize: '15px', color: '#8a6d1f', fontFamily: FONT }).setOrigin(0.5, 0.5));
        return;
      }
      const colors = ['#c9a227', '#cfc9dd', '#d97b3f', '#8a84a0'];
      rows.forEach((row, i) => {
        const y = y0 + i * 26;
        addRow(this.add.text(405, y, String(i + 1), { fontSize: '16px', color: colors[i], fontFamily: FONT, fontStyle: 'bold' }).setOrigin(0, 0.5));
        const key = sheetKeyFor(row);
        let icon;
        if (key && this.textures.exists(key)) icon = this.add.image(445, y, key, 0);
        else if (this.textures.exists(row.tex + '_idle0')) icon = this.add.image(445, y, row.tex + '_idle0');
        else icon = this.add.image(445, y, 'warrior64', 0);
        icon.setScale(row.tex === 'boss' ? 0.35 : 0.5);
        addRow(icon);
        addRow(this.add.text(470, y, row.name + (row.star > 1 ? ' ★' + row.star : ''), { fontSize: '16px', color: '#3a2a1c', fontFamily: FONT }).setOrigin(0, 0.5));
        addRow(this.add.text(870, y, String(row.val), { fontSize: '16px', color: '#3a2a1c', fontFamily: FONT, fontStyle: 'bold' }).setOrigin(1, 0.5));
      });
    };
    drawSection(rowsFor('wave'), 288);
    drawSection(rowsFor('total'), 424);
    rk._closeTxt.setText(this._rankOnClose ? '继续' : '关闭');
  },
  applyEnchant(target, enchId) {
    if (enchId === 'split' && target.cls === 'warrior') {
      this.floatText(target.x, target.y - 46, '分裂只能给弓手/术士', '#ff8888', 13);
      return false;
    }
    target.ench = enchId; // 再拖一个 = 替换，旧的消失
    recompute(target);
    this.refreshEnchVisual(target);
    this.syncUnitVisual(target);
    SFX.starup();
    this.floatText(target.x, target.y - 56, ENCHANTS[enchId].name + '附魔！', ENCHANTS[enchId].color, 16);
    return true;
  },

  /* ---------- 强化（M2：单击棋子面板） ---------- */
  showReinforce(u) {
    if (G.phase !== 'prep' || G.paused) return;
    this._rfUnit = u;
    this.refreshReinforcePanel();
    this.ui.reinforceBox.setVisible(true);
  },
  refreshReinforcePanel() {
    const u = this._rfUnit; const rf = this.ui.reinforceBox;
    if (!u || !rf) return;
    const cost = 3 + (u.reinforce || 0);
    rf._title.setText(u.name + '　★' + u.star + '　Lv' + u.level);
    const enchName = u.ench ? ENCHANTS[u.ench].name : '无';
    rf._stats.setText(
      '攻击 ' + u.atk + '　生命 ' + u.hp + '/' + u.maxHp + '\n' +
      '攻速 ' + u.aspd.toFixed(2) + '/秒　暴击 ' + Math.round(u.crit * 100) + '%\n' +
      '附魔：' + enchName + '　强化次数 ' + (u.reinforce || 0) + '\n' +
      '吞噬 ' + u.devourCount + '/5　升星进度 ' + u.starProg + '/3');
    rf._btnTxt.setText('强化 ' + cost + '金（攻/血+8%）');
    const afford = G.gold >= cost;
    rf._btnBg.setFillStyle(afford ? 0x6e4f3a : 0x5b5470);
    rf._btnBg.setAlpha(afford ? 1 : 0.6);
  },
  doReinforce() {
    const u = this._rfUnit;
    if (!u || !u.alive || G.phase !== 'prep') return;
    const cost = 3 + (u.reinforce || 0);
    if (G.gold < cost) { this.floatText(GW / 2, 200, '金币不足', '#ff8888', 14); return; }
    G.gold -= cost;
    u.reinforce = (u.reinforce || 0) + 1;
    u.level += 1; // 走现有 lvlMult 曲线，和吞噬升级同一条 level
    recompute(u);
    SFX.starup();
    this.floatText(u.x, u.y - 56, '强化！Lv' + u.level, '#6fb7d9', 18);
    this.refreshReinforcePanel();
    this.updateTop();
  },
  /* ---------- M6：塔强化面板 ---------- */
  openTowerPanel() {
    if (G.phase !== 'prep' || G.paused || !this.ui.towerBox) return;
    this.refreshTowerPanel();
    this.ui.towerBox.setVisible(true);
  },
  refreshTowerPanel() {
    const tw = this.ui.towerBox;
    if (!tw) return;
    const ts = towerStat();
    tw._stats.setText('攻击 ' + ts.atk + '　攻速 ' + ts.aspd.toFixed(2) + '/秒　射程 ' + ts.range + '　塔血 ' + G.towerHp + '/' + G.towerMax);
    TOWER_LINES.forEach((line, i) => {
      const lvl = G.towerUpg[line.key];
      const row = tw._rows[i];
      const cur = towerLineVal(line.key);
      if (lvl >= 3) {
        row.lbl.setText(line.name + '　' + line.fmt(cur) + '（满级）');
        row.btnTxt.setText('已满级');
        row.btnBg.setFillStyle(0x5b5470); row.btnBg.setAlpha(0.6);
      } else {
        const next = cur + line.step;
        row.lbl.setText(line.name + '　' + line.fmt(cur) + ' → ' + line.fmt(next));
        row.btnTxt.setText(line.costs[lvl] + '金');
        const afford = G.gold >= line.costs[lvl];
        row.btnBg.setFillStyle(afford ? 0x6e4f3a : 0x5b5470);
        row.btnBg.setAlpha(afford ? 1 : 0.6);
      }
    });
  },
  buyTowerLine(i) {
    const line = TOWER_LINES[i];
    if (!line || G.phase !== 'prep' || G.paused) return;
    const lvl = G.towerUpg[line.key];
    if (lvl >= 3) return;
    const cost = line.costs[lvl];
    if (G.gold < cost) { this.floatText(GW / 2, 200, '金币不足', '#ff8888', 14); return; }
    G.gold -= cost;
    G.towerUpg[line.key] = lvl + 1;
    if (line.key === 'hp') {
      G.towerMax += 25;
      G.towerHp = Math.min(G.towerMax, G.towerHp + 25);
    }
    SFX.starup();
    this.floatText(TOWER_POS.x, TOWER_POS.y - 60, line.name + '强化！', '#6fb7d9', 18);
    this.refreshTowerPanel();
    this.saveGame();
    this.updateTop();
  },
  /* ---------- M6：回血 / 复活（战后撤退用；原 M3 doRest 的逻辑抽出） ---------- */
  healAllUnits() {
    for (const u of [...G.field, ...G.bench]) {
      if (!u || !u.alive) continue;
      u.hp = u.maxHp; u.frozenUntil = 0; u.burnUntil = 0; u.slowUntil = 0;
      this.syncUnitVisual(u); this.syncHpBar(u);
    }
  },
  reviveFallen(hpFrac) {
    // 阵亡棋子从 fallen 复活，放回原来格子（格子被占则改放备战席）；没地方放就留在 fallen 里
    for (const u of [...G.fallen]) {
      const cell = u.cell;
      const cellFree = cell && !this.unitAtCell(cell.c, cell.r);
      const benchFree = G.bench.indexOf(null) !== -1;
      if (!cellFree && !benchFree) continue;
      u.alive = true;
      u.hp = Math.max(1, Math.floor(u.maxHp * hpFrac));
      u.frozenUntil = 0; u.burnUntil = 0; u.slowUntil = 0;
      u.target = null; u.cd = 0;
      if (u.sprite) {
        this.tweens.killTweensOf(u.sprite);
        u.sprite.setVisible(true).setAlpha(1).clearTint(); this.setUnitFrame(u, 'idle0');
      }
      if (cellFree) {
        const pt = cellCenter(cell.c, cell.r);
        u.x = pt.x; u.y = pt.y;
        G.field.push(u);
        if (!u.sprite) this.spawnUnitSprite(u);
        u.sprite.setScale(this.unitScale(u)); this.setUnitFrame(u, 'idle0');
        this.refreshStars(u); this.refreshEnchVisual(u);
        this.syncUnitVisual(u); this.syncHpBar(u);
      } else {
        this.addToBench(u);
        this.syncUnitVisual(u); this.syncHpBar(u);
      }
      G.fallen = G.fallen.filter(x => x !== u);
    }
  },
  buyXp() {
    if (G.phase !== 'prep') return;
    if (G.gold < 4) { this.floatText(1010, 640, '金币不足', '#ff8888', 13); return; }
    G.gold -= 4; G.xp += 4; SFX.coin();
    this.checkLevelUp();
    this.updateTop();
  },
  checkLevelUp() {
    while (G.xp >= G.xpNeed) {
      G.xp -= G.xpNeed; G.level += 1;
      G.xpNeed = G.level === 2 ? 6 : G.level === 3 ? 10 : 20;
      SFX.starup();
      this.floatText(GW / 2, 200, '升级！人口上限 ' + (4 + (G.level - 1)), '#6fb7d9', 20);
    }
  },

  /* ---------- M4：骰子遗物 ---------- */
  crownClass() { // 阵容中数量最多的职业；平局按 战士 > 弓手 > 术士
    const n = { warrior: 0, archer: 0, mage: 0 };
    for (const u of [...G.field, ...G.bench]) if (u) n[u.cls] = (n[u.cls] || 0) + 1;
    let best = 'warrior';
    if (n.archer > n[best]) best = 'archer';
    if (n.mage > n[best]) best = 'mage';
    return best;
  },
  pickDiceFace(di) { // 单颗骰子的面：三生骰锁定 > 共鸣镜预见首颗 > 旧王冠加权 > 均分
    const keys = ['warrior', 'archer', 'mage'];
    if (this._diceLock) return this._diceLock;
    if (di === 0 && G.previewFace) return G.previewFace;
    if (hasRelic('crown')) {
      const fav = this.crownClass();
      const r = Math.random();
      if (r < 0.48) return fav;
      const others = keys.filter(k => k !== fav);
      return r < 0.74 ? others[0] : others[1];
    }
    return keys[Math.floor(Math.random() * 3)];
  },
  /* ---------- 掷骰召唤（三颗骰子） ---------- */
  rollDice() {
    if (G.phase !== 'prep' || G.diceBusy) return;
    if (G.freeDice) { G.freeDice = false; } // 每波第一次免费
    else if (this._bellFree) { this._bellFree = false; } // 扭曲之铃：免费再摇
    else {
      if (G.gold < 3) { this.ui.diceTxt.setText('金币不足'); return; }
      G.gold -= 3;
    }
    G.diceBusy = true; SFX.pack();
    this.updateTop();
    // M4 三生骰：10% 直接三同（整摇锁定一个随机职业）；共鸣镜预见本摇首颗
    this._diceLock = (hasRelic('fate') && Math.random() < 0.10)
      ? ['warrior', 'archer', 'mage'][Math.floor(Math.random() * 3)] : null;
    this._previewUsed = !!G.previewFace;
    if (this._diceLock) this.floatText(GW / 2, 200, '三生骰！', '#8b3fd9', 20);
    let ticks = 0;
    this.time.addEvent({
      delay: 90, repeat: 5, callback: () => {
        ticks++;
        SFX.click();
        this.dice.forEach((die, di) => {
          const k = this.pickDiceFace(di);
          die._cls = k; die._img.setTexture(SHEET_KEY[k], 0);
          die.setAngle(Math.random() * 24 - 12);
          die.y = 578 + (Math.random() * 8 - 4);
        });
        if (ticks >= 6) this.resolveDice();
      }
    });
  },
  resolveDice() {
    G.diceBusy = false;
    for (const die of this.dice) { die.setAngle(0); die.y = 578; }
    const cls = this.dice.map(d => d._cls);
    const wasLock = this._diceLock; // 三生骰本摇是否锁定
    this._diceLock = null;
    if (this._previewUsed) G.previewFace = null; // 上一摇的预见已用完（铃重摇前新设的不受影响）
    this._previewUsed = false;
    const got = [];
    const summon = (c, rarity) => {
      const u = makeUnit(c, rarity, 'player');
      if (this.addToBench(u) !== -1) got.push(CLASSES[c].name);
    };
    if (cls[0] === cls[1] && cls[1] === cls[2]) {
      summon(cls[0], 'R'); summon(cls[0], 'N');
      if (got.length) { SFX.win(); SFX.hexGold(); this.ui.diceTxt.setText('三同！' + got[0] + '×2 入队' + (wasLock ? '（三生骰）' : '')); }
      else this.ui.diceTxt.setText('三同！但备战席满了');
    } else if (cls[0] === cls[1] || cls[1] === cls[2] || cls[0] === cls[2]) {
      const pair = cls[0] === cls[1] ? cls[0] : cls[2];
      summon(pair, 'N');
      if (got.length) { SFX.win(); this.ui.diceTxt.setText('对子！' + got[0] + ' 入队'); }
      else this.ui.diceTxt.setText('对子！但备战席满了');
      // M4 连珠：对子 50% 额外一个同职业白棋子
      if (hasRelic('beads') && Math.random() < 0.5) {
        const before = got.length;
        summon(pair, 'N');
        if (got.length > before) this.floatText(GW / 2, 200, '连珠！额外' + CLASSES[pair].name + '入队', '#3fae6a', 16);
        else this.floatText(GW / 2, 200, '连珠触发，但备战席满了', '#ff8888', 14);
      }
    } else {
      // M4 未中挂钩：金骰子返还 / 共鸣镜预见 / 扭曲之铃免费再摇
      let msg = '没中，再来！';
      if (hasRelic('golden')) { G.gold += 2; msg += ' 金骰子返还 2金'; }
      if (hasRelic('mirror')) {
        G.previewFace = ['warrior', 'archer', 'mage'][Math.floor(Math.random() * 3)];
        msg += ' 共鸣镜预见：下一摇首颗是' + CLASSES[G.previewFace].name;
      }
      this.ui.diceTxt.setText(msg);
      if (hasRelic('bell') && !G.bellUsed) {
        G.bellUsed = true;
        this.floatText(GW / 2, 200, '扭曲之铃：免费再摇一次', '#d97b3f', 16);
        this._bellFree = true;
        this.updateTop();
        this.rollDice();
        return;
      }
    }
    this.updateTop();
  },

  /* ---------- 开包 ---------- */
  openPack() {
    if (G.phase !== 'prep') return;
    if (G.gold < 5) { this.floatText(380, 510, '金币不足', '#ff8888', 13); return; }
    G.gold -= 5;
    const count = 1 + (G.buffs.packBonus || 0);
    const got = [];
    for (let i = 0; i < count; i++) {
      got.push({ cls: ['warrior', 'archer', 'mage'][Math.floor(Math.random() * 3)], rarity: weightedPick([['N', 60], ['R', 30], ['SR', 9], ['SSR', 1]]) });
    }
    G.packPity += 1;
    if (G.packPity >= 30) { got[0].rarity = 'SR'; G.packPity = 0; }
    if (got.some(g => g.rarity === 'SR' || g.rarity === 'SSR')) G.packPity = 0;
    SFX.pack();
    const best = got.slice().sort((a, b) => RARITY.findIndex(x => x.key === b.rarity) - RARITY.findIndex(x => x.key === a.rarity))[0];
    const r = RARITY.find(x => x.key === best.rarity);
    const rev = this.ui.revealBox;
    rev._img.setTexture(SHEET_KEY[CLASSES[best.cls].tex], 0);
    rev._name.setText(CLASSES[best.cls].name);
    rev._rar.setText(r.name + (best.rarity === 'SSR' ? '！！' : '')).setColor(r.color);
    rev.setVisible(true);
    if (best.rarity === 'SSR' || best.rarity === 'SR') SFX.hexGold();
    this.time.delayedCall(900, () => {
      rev.setVisible(false);
      for (const g of got) {
        const u = makeUnit(g.cls, g.rarity, 'player');
        if (this.addToBench(u) === -1) { G.gold += 5; this.floatText(380, 510, '备战席满了，已退 5金', '#ff8888', 13); break; }
      }
      this.updateTop();
    });
    this.updateTop();
  },

  /* ---------- 海克斯 ---------- */
  showHex() {
    const pool = HEX_POOL.filter(h => !G.hexesTaken.includes(h.id));
    const weights = { white: 50, blue: 30, purple: 15, gold: 5 };
    const choices = [];
    const bag = [...pool];
    while (choices.length < 3 && bag.length) {
      const total = bag.reduce((s, h) => s + weights[h.tier], 0);
      let roll = Math.random() * total, idx = 0;
      for (; idx < bag.length; idx++) { roll -= weights[bag[idx].tier]; if (roll <= 0) break; }
      choices.push(bag.splice(Math.min(idx, bag.length - 1), 1)[0]);
    }
    this._hexChoices = choices;
    choices.forEach((h, i) => {
      const c = this.ui.hexBox._cards[i];
      c.border.setFillStyle(hexColor(TIER_COLOR[h.tier]));
      c.tier.setText(TIER_NAME[h.tier] + '海克斯').setColor(TIER_COLOR_DARK[h.tier]);
      c.name.setText(h.name);
      c.desc.setText(h.desc);
    });
    this.ui.hexBox.setVisible(true);
    SFX.hexGold();
  },
  pickHex(i) {
    const h = this._hexChoices[i];
    if (!h) return;
    h.apply(G);
    G.hexesTaken.push(h.id);
    SFX.hexGold();
    this.ui.hexBox.setVisible(false);
    this.floatText(GW / 2, 200, '获得海克斯：' + h.name, TIER_COLOR[h.tier], 20);
    for (const u of [...G.field, ...G.bench]) if (u) { recompute(u); if (u.sprite) u.sprite.setScale(this.unitScale(u)); }
    this.advanceWave();
  },

  /* ---------- M4：遗物铺 ---------- */
  showRelicShop() { // 第 2/4 波胜利后：从未拥有遗物里抽 3 张；没有了返回 false（直接推进）
    const avail = RELICS.filter(r => !G.relics.includes(r.id));
    if (!avail.length) return false;
    const choices = [...avail].sort(() => Math.random() - 0.5).slice(0, 3);
    this._relicChoices = choices;
    this.ui.relicBox._cards.forEach((c, i) => {
      const r = choices[i];
      c.els.forEach(o => o.setVisible(!!r));
      if (!r) return;
      c.icon.setTexture(r.tex);
      c.name.setText(r.name);
      c.price.setText(r.cost + '金').setColor('#8a6d1f');
      c.desc.setText(r.desc);
      c.sold.setVisible(false);
      c.bg.setAlpha(1);
    });
    this.ui.relicBox.setVisible(true);
    SFX.hexGold();
    return true;
  },
  buyRelic(i) {
    const r = this._relicChoices && this._relicChoices[i];
    if (!r) return;
    const c = this.ui.relicBox._cards[i];
    if (G.relics.includes(r.id)) return;
    if (G.gold < r.cost) {
      c.price.setColor('#ff8888');
      this.floatText(GW / 2, 200, '金币不足', '#ff8888', 16);
      return;
    }
    G.gold -= r.cost;
    G.relics.push(r.id);
    SFX.hexGold();
    c.sold.setVisible(true);
    c.bg.setAlpha(0.45);
    this.renderRelicRow();
    this.updateTop();
  },
  closeRelicShop() {
    this.ui.relicBox.setVisible(false);
    this.advanceWave();
  }
});

/* ============================================================
   战斗引擎 + 按角色区分的攻击特效 + 打击感
   ============================================================ */
Object.assign(GameScene.prototype, {
  /* ---------- 特效 ---------- */
  floatText(x, y, str, color, size, big) {
    const t = this.add.text(x, y, str, {
      fontSize: (size || 15) + 'px', color: color || '#ffffff', fontFamily: FONT,
      fontStyle: 'bold', stroke: '#14101c', strokeThickness: 3
    }).setOrigin(0.5).setDepth(20);
    if (big) t.setScale(1.4);
    this.tweens.add({ targets: t, y: y - 34, alpha: 0, scaleX: big ? 1.7 : 1.1, scaleY: big ? 1.7 : 1.1, duration: 750, onComplete: () => t.destroy() });
  },
  spawnParticles(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const s = 3 + Math.random() * 4;
      const r = this.add.rectangle(x, y, s, s, color).setDepth(6);
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.8);
      this.tweens.add({ targets: r, x: x + Math.cos(a) * v * 0.4, y: y + Math.sin(a) * v * 0.4 - 12, alpha: 0, duration: 380 + Math.random() * 220, onComplete: () => r.destroy() });
    }
  },
  coinDrop(x, y) { // 敌人死亡掉 3 枚金币（纯视觉）
    for (let i = 0; i < 3; i++) {
      const c = this.add.circle(x + (Math.random() * 30 - 15), y, 4, 0xc9a227).setDepth(7);
      this.tweens.add({ targets: c, y: y - 24 - Math.random() * 14, alpha: 0, duration: 500 + i * 80, onComplete: () => c.destroy() });
    }
  },
  hitSpark(x, y, color) {
    const s = this.add.image(x, y, 'spark').setTint(color).setScale(1.4).setDepth(7);
    this.tweens.add({ targets: s, scaleX: 2.2, scaleY: 2.2, alpha: 0, duration: 180, onComplete: () => s.destroy() });
    this.spawnParticles(x, y, color, 5, 90);
  },
  showHitFx(att, def) { // M5 P1：敌人攻击特效（史莱姆溅射 / 蝙蝠挥击 / Boss 骨刺）
    const m = { slime: ['fx-slime64', 4], bat: ['fx-bat64', 3], boss: ['fx-bone64', 0] }[att.cls];
    if (!m || !this.textures.exists(m[0])) return;
    if (!m[1]) { // 骨刺：单图，放目标脚下淡出
      const img = this.add.image(def.x, def.y + 28, m[0]).setDepth(7).setScale(1.2);
      this.tweens.add({ targets: img, alpha: 0, duration: 350, onComplete: () => img.destroy() });
      return;
    }
    const img = this.add.image(def.x, def.y - 6, m[0], 0).setDepth(7).setScale(1.2);
    let f = 0;
    const timer = this.time.addEvent({ delay: 60, repeat: m[1] - 1, callback: () => { f++; if (img.active && f < m[1]) img.setFrame(f); } });
    this.time.delayedCall(60 * m[1] + 80, () => { timer.remove(false); if (img.active) img.destroy(); });
  },
  starburst(x, y) {
    this.spawnParticles(x, y, 0xc9a227, 16, 170);
    const r = this.add.circle(x, y, 10).setStrokeStyle(3, 0xc9a227).setDepth(7);
    this.tweens.add({ targets: r, scaleX: 4, scaleY: 4, alpha: 0, duration: 350, onComplete: () => r.destroy() });
  },
  ringFx(x, y, color, maxR) {
    const r = this.add.circle(x, y, 8).setStrokeStyle(4, color).setDepth(7);
    this.tweens.add({ targets: r, scaleX: maxR / 8, scaleY: maxR / 8, alpha: 0, duration: 420, onComplete: () => r.destroy() });
  },
  slashArc(x, y, color) {
    const g = this.add.graphics().setDepth(8);
    g.lineStyle(7, color, 0.95);
    g.beginPath(); g.arc(x, y, 34, -2.4, -0.5); g.strokePath();
    g.lineStyle(3, 0xc9a227, 0.9);
    g.beginPath(); g.arc(x, y, 26, -2.2, -0.7); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, scaleX: 1.25, scaleY: 1.25, duration: 180, onComplete: () => g.destroy() });
  },
  fireArrow(u, t, onHit, tint) {
    const a = this.add.image(u.x, u.y - 6, 'arrow').setDepth(6);
    if (tint) a.setTint(tint);
    a.setRotation(Math.atan2(t.y - u.y, t.x - u.x));
    this.tweens.add({ targets: a, x: t.x, y: t.y - 6, duration: 150, onComplete: () => { onHit(); this.time.delayedCall(200, () => a.destroy()); } }); // 箭插在目标身上 0.2 秒
  },
  fireOrb(u, t, onHit, tint) {
    const o = this.add.image(u.x, u.y - 10, 'orb').setDepth(6);
    if (tint) o.setTint(tint);
    this.tweens.add({
      targets: o, x: t.x, y: t.y - 6, duration: 220,
      onUpdate: () => { if (Math.random() < 0.5) this.spawnParticles(o.x, o.y, 0x8b3fd9, 1, 30); },
      onComplete: () => { o.destroy(); this.ringFx(t.x, t.y, 0x8b3fd9, 46); this.spawnParticles(t.x, t.y, 0x8b3fd9, 10, 130); onHit(); }
    });
  },
  fireTowerOrb(from, t, onHit) { // M6：水晶塔法球（水晶蓝，复用 fireOrb 模式）
    const o = this.add.image(from.x, from.y, 'orb').setDepth(6).setTint(0x6fb7d9);
    this.tweens.add({
      targets: o, x: t.x, y: t.y - 6, duration: 220,
      onUpdate: () => { if (Math.random() < 0.5) this.spawnParticles(o.x, o.y, 0x6fb7d9, 1, 30); },
      onComplete: () => { o.destroy(); this.ringFx(t.x, t.y, 0x6fb7d9, 46); this.spawnParticles(t.x, t.y, 0x6fb7d9, 10, 130); onHit(); }
    });
  },
  groundCrack(x, y) { // 战士 / Boss 劈砍留下的地面裂纹，0.4 秒消失
    const g = this.add.graphics().setDepth(5);
    g.lineStyle(3, 0x14101c, 0.9);
    g.beginPath(); g.moveTo(x - 18, y + 16); g.lineTo(x - 4, y + 22); g.lineTo(x + 10, y + 18); g.lineTo(x + 20, y + 24); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, duration: 400, onComplete: () => g.destroy() });
  },
  bossSlamFx(u, t) {
    this.slashArc(t.x, t.y, 0xd97b3f);
    this.groundCrack(t.x, t.y);
    this.ringFx(t.x, t.y + 10, 0xd97b3f, 90);
    this.shake(220, 0.014);
    this.hitStop(110);
  },
  bossAoE(u) { // Boss 每 3 次攻击：骨刺冲击波（预警红圈 350ms 再落下）
    const cx = u.target ? u.target.x : u.x, cy = u.target ? u.target.y : u.y;
    const tele = this.add.circle(cx, cy, 130).setStrokeStyle(3, 0xa83232).setDepth(6).setAlpha(0.6);
    this.tweens.add({ targets: tele, alpha: 0.15, duration: 350, yoyo: true, onComplete: () => tele.destroy() });
    SFX.slam();
    this.time.delayedCall(350, () => {
      this.ringFx(cx, cy, 0xa83232, 130);
      for (const p of [...G.field]) {
        if (!p.alive) continue;
        if (Math.hypot(p.x - cx, p.y - cy) <= 130) {
          const dmg = Math.max(1, Math.round(u.atk * 0.5));
          p.hp -= dmg;
          p.poseUntil = this.time.now + 150;
          if (p.sprite) this.setUnitFrame(p, 'hit');
          this.floatText(p.x, p.y - 46, String(dmg), '#ff8888', 16);
          this.hitSpark(p.x, p.y - 6, 0xa83232);
          if (p.hp <= 0) this.killUnit(p);
        }
      }
    });
  },
  hitStop(ms) { G.hitStopUntil = this.time.now + ms; },
  bossIntro() {
    const flash = this.add.rectangle(0, 0, GW, GH, 0xffffff, 0.55).setOrigin(0, 0).setDepth(30);
    this.tweens.add({ targets: flash, alpha: 0, duration: 500, onComplete: () => flash.destroy() });
    const t = this.add.text(GW / 2, 240, '骷髅王 来袭！', { fontSize: '40px', color: '#a83232', fontFamily: FONT, fontStyle: 'bold', stroke: '#14101c', strokeThickness: 6 }).setOrigin(0.5).setDepth(31);
    this.tweens.add({ targets: t, alpha: 0, y: 210, duration: 1200, onComplete: () => t.destroy() });
    this.shake(300, 0.015);
    SFX.boss();
  },

  /* ---------- 战斗主循环 ---------- */
  tick(time, delta) {
    if (G.paused) return;
    // M5 P2：水晶塔待机动画（水晶脉动 0–3 帧，每 400ms 换一帧；受击/破碎帧由伤害代码设置）
    if (this.towerImg && this.textures.exists('tower64') && G.towerHp > 0 && !(this._towerHitUntil && time < this._towerHitUntil) && !(this._towerAtkUntil && time < this._towerAtkUntil)) {
      this._towerAnimT = (this._towerAnimT || 0) + delta;
      if (this._towerAnimT >= 400) {
        this._towerAnimT = 0;
        this._towerFrame = ((this._towerFrame || 0) + 1) % 4;
        this.towerImg.setFrame(this._towerFrame);
      }
    }
    if (G.phase !== 'battle') return;
    let dt = (delta / 1000) * G.speedMul;
    if (time < G.hitStopUntil) dt = 0; // 顿帧：单位逻辑冻结，视觉照常
    for (const u of [...G.field, ...G.enemies]) {
      if (!u.alive || !u.sprite) continue;
      u.animT += dt;
      // ---- M2：燃烧（每秒掉血） ----
      if (u.burnUntil && time >= u.burnUntil) { u.burnUntil = 0; u.burnDps = 0; }
      if (u.burnUntil && time >= (u.burnNext || 0)) {
        u.burnNext = time + 1000;
        u.hp -= u.burnDps;
        // M5 §9：点燃伤害计入来源输出
        if (u.burnSrc && u.burnSrc.side === 'player') { u.burnSrc.dmgDealtWave = (u.burnSrc.dmgDealtWave || 0) + u.burnDps; u.burnSrc.dmgDealtTotal = (u.burnSrc.dmgDealtTotal || 0) + u.burnDps; }
        if (u.side === 'player') { u.dmgTakenWave = (u.dmgTakenWave || 0) + u.burnDps; u.dmgTakenTotal = (u.dmgTakenTotal || 0) + u.burnDps; }
        this.floatText(u.x, u.y - 46, '-' + u.burnDps, '#d97b3f', 12);
        this.spawnParticles(u.x, u.y - 10, 0xd97b3f, 3, 60);
        this.syncHpBar(u);
        if (u.hp <= 0) { this.killUnit(u); continue; }
      }
      // ---- M2：冻结（完全定住，不能动不能打） ----
      if (u.frozenUntil && time >= u.frozenUntil) this.clearFreeze(u);
      if (u.frozenUntil && time < u.frozenUntil) { this.setIdleFrame(u); this.syncHpBar(u); continue; }
      if (!u.target || !u.target.alive) u.target = this.acquireTarget(u);
      const t = u.target;
      if (!t) { this.setIdleFrame(u); continue; }
      const dx = t.x - u.x, dy = t.y - u.y;
      const dist = Math.hypot(dx, dy);
      const range = u.range + (t.isBoss ? 20 : 0) + (u.isBoss ? 10 : 0);
      const slowed = time < (u.slowUntil || 0); // 寒霜：移速+攻速都减 30%
      const sped = time < (u.speedBuffUntil || 0); // 速度恶魔：移速 +20%
      if (dist > range) {
        const step = u.speed * (slowed ? 0.7 : 1) * (sped ? 1.2 : 1) * dt;
        u.x += dx / dist * step; u.y += dy / dist * step;
        u.sprite.setPosition(u.x, u.y);
        this.setWalkFrame(u);
      } else {
        u.cd -= dt * (slowed ? 0.7 : 1);
        if (u.cd <= 0) { u.cd = 1 / u.aspd; this.doAttack(u, t); }
        this.setIdleFrame(u);
      }
      this.syncHpBar(u);
    }
    // M6：水晶塔参战（塔在就攻击最近的射程内敌人；战士死光战斗继续）
    if (G.phase === 'battle' && G.towerHp > 0) {
      const ts = towerStat();
      G.towerCd = (G.towerCd || 0) - dt;
      let best = null, bestD = Infinity;
      for (const e of G.enemies) {
        if (!e.alive) continue;
        const d = Math.hypot(e.x - TOWER_POS.x, e.y - TOWER_POS.y);
        if (d < bestD) { bestD = d; best = e; }
      }
      if (best && bestD <= ts.range && G.towerCd <= 0) {
        G.towerCd = 1 / ts.aspd;
        this.towerAttack(best, ts);
      }
    }
    if (G.enemies.length && G.enemies.every(e => !e.alive)) this.endWave(true);
    else if (G.towerHp <= 0) this.endWave(false);
  },
  acquireTarget(u) {
    const foes = u.side === 'player' ? G.enemies : G.field;
    let best = null, bestD = Infinity;
    for (const f of foes) {
      if (!f.alive) continue;
      const d = Math.hypot(f.x - u.x, f.y - u.y);
      if (d < bestD) { bestD = d; best = f; }
    }
    if (best) return best;
    if (u.side === 'enemy' && G.towerHp > 0) {
      if (!this.towerTarget) this.towerTarget = { isTower: true, x: TOWER_POS.x + 34, y: TOWER_POS.y, alive: true };
      return this.towerTarget;
    }
    return null;
  },
  towerAttack(target, ts) { // M6：塔攻击（攻击帧 8–11 + 水晶法球；伤害走 applyDamage）
    if (this.towerImg && this.textures.exists('tower64') && G.towerHp > 0) {
      this._towerAtkUntil = this.time.now + 300;
      this.towerImg.setFrame(8);
      this.time.delayedCall(75, () => { if (this.towerImg && this.time.now < (this._towerAtkUntil || 0)) this.towerImg.setFrame(9); });
      this.time.delayedCall(150, () => { if (this.towerImg && this.time.now < (this._towerAtkUntil || 0)) this.towerImg.setFrame(10); });
      this.time.delayedCall(225, () => { if (this.towerImg && this.time.now < (this._towerAtkUntil || 0)) this.towerImg.setFrame(11); });
    }
    SFX.orb();
    const from = { x: TOWER_POS.x, y: TOWER_POS.y - 40 }; // 塔顶水晶
    this.fireTowerOrb(from, target, () => {
      if (!target.alive || G.phase !== 'battle' || G.towerHp <= 0) return;
      // 伪攻击者：applyDamage 只取 atk / crit / ench / side / maxHp / cls / alive；side 用 'tower'，不吃附魔/弹跳/处决
      const pseudo = { atk: ts.atk, crit: 0, ench: null, side: 'tower', cls: 'tower', alive: true, maxHp: G.towerMax };
      const before = target.hp;
      this.applyDamage(pseudo, target, 1);
      const dealt = Math.max(0, before - Math.max(0, target.hp));
      G.towerStats.dmg += dealt;
      if (!target.alive) G.towerStats.kills += 1;
    });
  },
  setWalkFrame(u) {
    const idx = Math.floor(u.animT / 0.1) % 4;
    if (this.time.now >= (u.poseUntil || 0) && this.setUnitFrame(u, 'w' + idx)) {
      // 走路弹跳：压低再弹回
      const sc = this.unitScale(u);
      this.tweens.add({ targets: u.sprite, scaleY: sc * 0.92, duration: 55, yoyo: true, onComplete: () => { if (u.sprite) u.sprite.setScale(sc); } });
    }
  },
  setIdleFrame(u) {
    if (this.time.now >= (u.poseUntil || 0)) {
      if (this.useSheet(u)) this.setUnitFrame(u, 'idle' + (Math.floor(u.animT / 0.3) % 4)); // 64 级表 4 帧待机：眨眼 + 呼吸
      else {
        const key = u.tex + (Math.floor(u.animT / 0.6) % 2 === 0 ? '_idle0' : '_idle1'); // 待机眨眼
        if (u.sprite.texture.key !== key) u.sprite.setTexture(key);
      }
    }
  },
  syncHpBar(u) {
    if (!u.hpBg || !u.hpFg) return;
    const off = u.isBoss ? 68 : u.isElite ? 58 : 54;
    const vis = u.alive && (u.side === 'enemy' || u.cell !== null);
    u.hpBg.setVisible(vis).setPosition(u.x, u.y - off);
    u.hpFg.setVisible(vis).setPosition(u.x - 28, u.y - off);
    u.hpFg.width = Math.max(0, 56 * u.hp / u.maxHp);
    u.hpFg.setFillStyle(u.hp / u.maxHp > 0.5 ? 0x3fae6a : u.hp / u.maxHp > 0.25 ? 0xd97b3f : 0xa83232);
  },

  /* ---------- 攻击（按角色区分特效） ---------- */
  doAttack(u, t) {
    u.atkCount += 1;
    const sheet = this.useSheet(u);
    u.poseUntil = this.time.now + (sheet ? 300 : 220);
    if (u.sprite) {
      // 攻击帧：蓄力 → 挥出 → 收势（12 张/秒）；战士精灵表 4 段，多一段 atk3
      this.setUnitFrame(u, 'atk0');
      this.time.delayedCall(75, () => { if (u.alive && u.sprite && this.time.now < u.poseUntil) this.setUnitFrame(u, 'atk1'); });
      this.time.delayedCall(150, () => { if (u.alive && u.sprite && this.time.now < u.poseUntil) this.setUnitFrame(u, 'atk2'); });
      if (sheet) this.time.delayedCall(225, () => { if (u.alive && u.sprite && this.time.now < u.poseUntil) this.setUnitFrame(u, 'atk3'); });
      this.tweens.add({ targets: u.sprite, scaleX: this.unitScale(u) * 1.12, duration: 75, yoyo: true });
    }
    if (t.isTower) {
      this.time.delayedCall(90, () => { this.damageTower(u); this.hitSpark(TOWER_POS.x + 20, TOWER_POS.y, 0xd97b3f); });
      return;
    }
    const enchTint = u.ench ? ENCHANT_TINT[u.ench] : null; // 附魔：武器/弹道换色
    const split = u.ench === 'split' && (u.cls === 'archer' || u.cls === 'mage'); // 分裂：2 发各 60%
    if (u.cls === 'warrior') { // 战士：刀光弧 + 地面裂纹
      SFX.slash();
      this.slashArc(t.x, t.y, enchTint || 0xffffff);
      this.groundCrack(t.x, t.y);
      this.time.delayedCall(90, () => this.applyDamage(u, t, 1));
    } else if (u.cls === 'archer') { // 弓手：箭矢弹道（命中后插 0.2 秒）
      SFX.shoot();
      this.fireArrow(u, t, () => this.applyDamage(u, t, split ? 0.6 : 1), enchTint);
      if (split) this.time.delayedCall(120, () => { if (u.alive && t.alive) this.fireArrow(u, t, () => this.applyDamage(u, t, 0.6), enchTint); });
    } else if (u.cls === 'mage') { // 术士：法球 + 落点法环
      SFX.orb();
      this.fireOrb(u, t, () => this.applyDamage(u, t, split ? 0.6 : 1), enchTint);
      if (split) this.time.delayedCall(120, () => { if (u.alive && t.alive) this.fireOrb(u, t, () => this.applyDamage(u, t, 0.6), enchTint); });
    } else if (u.cls === 'boss') { // Boss：大剑劈砍 + 冲击波环，每 3 次骨刺 AoE
      SFX.slam();
      this.bossSlamFx(u, t);
      this.time.delayedCall(160, () => {
        this.applyDamage(u, t, 1);
        if (u.atkCount % 3 === 0) this.bossAoE(u);
      });
    } else { // 史莱姆 / 蝙蝠：近战扑咬
      SFX.hit();
      this.hitSpark(t.x, t.y - 6, 0x3fae6a);
      this.time.delayedCall(70, () => this.applyDamage(u, t, 1));
    }
  },
  applyDamage(att, def, mult) {
    if (!def.alive || !att.alive) return;
    let dmg = att.atk * mult;
    const isCrit = Math.random() < att.crit;
    if (isCrit) dmg *= (G.buffs.pearl ? 2.5 : 2); // 珠光莲花：暴伤 2→2.5 倍
    dmg = Math.max(1, Math.round(dmg));
    def.hp -= dmg;
    // M5 §9：伤害统计（只累计，不改数值；塔 side:'tower' 不进棋子输出）
    if (att.side === 'player') { att.dmgDealtWave = (att.dmgDealtWave || 0) + dmg; att.dmgDealtTotal = (att.dmgDealtTotal || 0) + dmg; }
    if (def.side === 'player') { def.dmgTakenWave = (def.dmgTakenWave || 0) + dmg; def.dmgTakenTotal = (def.dmgTakenTotal || 0) + dmg; }
    def.poseUntil = this.time.now + 150;
    if (def.sprite) {
      this.setUnitFrame(def, 'hit');
      this.tweens.add({ targets: def.sprite, angle: -8, duration: 80, yoyo: true, onComplete: () => { if (def.sprite) def.sprite.setAngle(0); } }); // 受击后仰
    }
    this.floatText(def.x + (Math.random() * 20 - 10), def.y - 46, String(dmg), isCrit ? '#c9a227' : '#ffffff', isCrit ? 26 : 16, isCrit);
    const sparkColor = att.ench ? ENCHANT_TINT[att.ench] // 附魔：命中火花换对应色
      : att.cls === 'tower' ? 0x6fb7d9 // M6：塔命中火花水晶蓝
      : att.cls === 'warrior' ? 0xffffff : att.cls === 'archer' ? 0x3fae6a : att.cls === 'mage' ? 0x8b3fd9 : att.cls === 'boss' ? 0xd97b3f : 0x3fae6a;
    this.hitSpark(def.x, def.y - 6, sparkColor);
    this.showHitFx(att, def);
    if (isCrit) {
      SFX.crit();
      this.shake(140, 0.012);
      this.hitStop(90);
      this.starburst(def.x, def.y - 10);
    } else SFX.hit();
    // 飞身踢：血量压制才能处决（攻击者最大生命 ≥ 目标最大生命）
    if (G.buffs.execute && att.side === 'player' && def.hp > 0 && def.hp / def.maxHp < 0.15 && att.maxHp >= def.maxHp) {
      def.hp = 0;
      this.floatText(def.x, def.y - 66, '处决！', '#c9a227', 20);
      this.killUnit(def);
      this.syncHpBar(def);
      return;
    }
    if (def.hp > 0) this.applyHitEffects(att, def, dmg);
    this.syncHpBar(def);
    if (def.hp <= 0) this.killUnit(def);
  },
  /* ---------- M2：命中后效果（附魔 + 海克斯） ---------- */
  applyHitEffects(att, def, dmg) {
    const now = this.time.now;
    if (G.buffs.speedDemon && att.side === 'player') att.speedBuffUntil = now + 2000; // 速度恶魔
    if (att.side === 'player' && att.ench) {
      const immune = def.side === 'player' && G.buffs.colossus; // 巨像免疫减速/冻结
      switch (att.ench) {
        case 'fire': // 烈焰：点燃 3 点/秒 × 3 秒（刷新不叠加）
          def.burnUntil = now + 3000; def.burnDps = 3; def.burnNext = now + 1000; def.burnSrc = att;
          break;
        case 'frost': // 寒霜：减速 30% × 2 秒
          if (!immune) def.slowUntil = now + 2000;
          break;
        case 'freeze': // 冰冻：10% 概率冻结 1.5 秒
          if (!immune && Math.random() < 0.10) this.applyFreeze(def);
          break;
        case 'storm': // 雷霆：25% 概率闪电链
          if (Math.random() < 0.25) this.tryChain(att, def, dmg);
          break;
        case 'vamp': { // 吸血：15% 回血
          const heal = Math.max(1, Math.round(dmg * 0.15));
          att.hp = Math.min(att.maxHp, att.hp + heal);
          this.floatText(att.x, att.y - 56, '+' + heal, '#3fae6a', 13);
          this.syncHpBar(att);
          break;
        }
        default: break;
      }
    }
    // 弹跳：远程攻击命中后弹跳到附近敌人（40% 伤害）
    if (G.buffs.bounce && att.side === 'player' && (att.cls === 'archer' || att.cls === 'mage')) this.tryBounce(att, def, dmg);
  },
  nearestOtherFoe(att, around, maxDist) {
    const foes = att.side === 'player' ? G.enemies : G.field;
    let best = null, bestD = maxDist;
    for (const e of foes) {
      if (!e.alive || e === around) continue;
      const d = Math.hypot(e.x - around.x, e.y - around.y);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  },
  chainFx(x1, y1, x2, y2, color) { // 折线闪电 / 弹跳弧线
    const g = this.add.graphics().setDepth(8);
    g.lineStyle(3, color, 0.95);
    const mx = (x1 + x2) / 2 + (Math.random() * 20 - 10), my = (y1 + y2) / 2 + (Math.random() * 20 - 10);
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(mx, my); g.lineTo(x2, y2); g.strokePath();
    this.tweens.add({ targets: g, alpha: 0, duration: 250, onComplete: () => g.destroy() });
  },
  dealBonusDamage(src, def, amount, tint, textColor) { // 链式/弹跳附加伤害（不递归触发）
    if (!def.alive) return;
    amount = Math.max(1, Math.round(amount));
    def.hp -= amount;
    // M5 §9：链式/弹跳附加伤害也计入统计
    if (src.side === 'player') { src.dmgDealtWave = (src.dmgDealtWave || 0) + amount; src.dmgDealtTotal = (src.dmgDealtTotal || 0) + amount; }
    if (def.side === 'player') { def.dmgTakenWave = (def.dmgTakenWave || 0) + amount; def.dmgTakenTotal = (def.dmgTakenTotal || 0) + amount; }
    def.poseUntil = this.time.now + 120;
    if (def.sprite) this.setUnitFrame(def, 'hit');
    this.floatText(def.x + (Math.random() * 16 - 8), def.y - 46, String(amount), textColor, 14);
    this.hitSpark(def.x, def.y - 6, tint);
    this.syncHpBar(def);
    if (def.hp <= 0) this.killUnit(def);
  },
  tryChain(att, def, dmg) {
    const t = this.nearestOtherFoe(att, def, 150);
    if (!t) return;
    SFX.zap();
    this.chainFx(def.x, def.y - 10, t.x, t.y - 10, 0xe3cf9e);
    this.dealBonusDamage(att, t, dmg * 0.5, 0xe3cf9e, '#e3cf9e');
  },
  tryBounce(att, def, dmg) {
    const t = this.nearestOtherFoe(att, def, 150);
    if (!t) return;
    this.chainFx(def.x, def.y - 10, t.x, t.y - 10, 0x8b3fd9);
    this.dealBonusDamage(att, t, dmg * 0.4, 0x8b3fd9, '#c9a227');
  },
  applyFreeze(u) {
    u.frozenUntil = this.time.now + 1500;
    if (u.sprite) u.sprite.setTint(0x9fd8ef);
    if (!u.frozenFx) u.frozenFx = this.add.image(u.x, u.y - 68, 'spark').setTint(0xffffff).setScale(1.2).setDepth(5);
    u.frozenFx.setVisible(true).setPosition(u.x, u.y - 68);
  },
  clearFreeze(u) {
    u.frozenUntil = 0;
    if (u.sprite) u.sprite.clearTint();
    if (u.frozenFx) u.frozenFx.setVisible(false);
  },
  damageTower(u) {
    const dmg = Math.max(1, Math.round(u.atk));
    G.towerHp = Math.max(0, G.towerHp - dmg);
    // M5 P2：水晶塔受击帧（12）闪 150ms；塔破时定格破碎帧（13）
    if (this.towerImg && this.textures.exists('tower64')) {
      if (G.towerHp <= 0) this.towerImg.setFrame(13);
      else { this.towerImg.setFrame(12); this._towerHitUntil = this.time.now + 150; }
    }
    this.floatText(TOWER_POS.x, TOWER_POS.y - 60, '-' + dmg, '#ff8888', 16);
    this.shake(120, 0.008);
    SFX.hit();
    this.updateTop();
    if (G.towerHp <= 0) this.endWave(false);
  },
  killUnit(u) {
    u.alive = false; u.hp = 0; u.frozenUntil = 0;
    if (u.sprite) { this.tweens.killTweensOf(u.sprite); u.sprite.clearTint(); this.setUnitFrame(u, 'die'); }
    this.spawnParticles(u.x, u.y, u.side === 'player' ? 0xcfc9dd : 0x3fae6a, u.isBoss ? 30 : 12, 160);
    if (u.side === 'enemy') {
      if (G.stats) G.stats.kills += 1;
      this.coinDrop(u.x, u.y); // 敌人死亡掉金币（纯视觉，不加经济）
      if (G.buffs.soul) { // 吞噬灵魂：每击杀一个敌人，全队生命 +2（本局叠加）
        for (const p of [...G.field, ...G.bench]) {
          if (!p || !p.alive) continue;
          p.soulBonus = (p.soulBonus || 0) + 2;
          p.maxHp += 2;
          p.hp = Math.min(p.maxHp, p.hp + 2);
          this.syncHpBar(p);
        }
      }
    }
    if (u.isBoss) { this.shake(400, 0.02); this.hitStop(150); SFX.win(); }
    if (u.hpBg) u.hpBg.setVisible(false);
    if (u.hpFg) u.hpFg.setVisible(false);
    for (const s of u.starImgs) s.setVisible(false);
    if (u.devTxt) u.devTxt.setVisible(false);
    if (u.frozenFx) u.frozenFx.setVisible(false);
    if (u.glow) u.glow.setVisible(false);
    if (u.enchImg) u.enchImg.setVisible(false);
    if (u.sprite) this.tweens.add({ targets: u.sprite, alpha: 0, duration: 500, delay: 350, onComplete: () => { if (u.sprite) u.sprite.setVisible(false); } });
    if (u.side === 'player') { G.field = G.field.filter(x => x !== u); if (!G.fallen.includes(u)) G.fallen.push(u); }
  },

  /* ---------- 波次流程 ---------- */
  startBattle() {
    if (G.phase !== 'prep' || G.paused) return;
    if (G.field.length === 0) { this.floatText(GW / 2, 200, '先拖至少 1 个棋子上场', '#ff8888', 16); return; }
    this.saveGame(); // 开打前存档：继续时回到本波备战
    this.ui.tutBox.setVisible(false); markTutDone(); // 新手引导完成
    this.ui.reinforceBox.setVisible(false);
    if (this.ui.towerBox) this.ui.towerBox.setVisible(false);
    if (this.ui.choiceBox) this.ui.choiceBox.setVisible(false);
    BGM.setMode(G.wave === 5 ? 'boss' : 'normal');
    G.phase = 'battle';
    // M5 §9：每波开打，本波统计清零（整局累计不清）；隐藏敌人详情/战绩面板
    for (const u of G.field) { u.dmgDealtWave = 0; u.dmgTakenWave = 0; }
    if (this.ui.enemyDetail) this.ui.enemyDetail.setVisible(false);
    if (this.ui.rankBox) this.ui.rankBox.setVisible(false);
    this.ui.startBtn.setVisible(false); this.ui.startTxt.setVisible(false);
    SFX.tone(220, 0.15, 'sawtooth', 0.10, 440);
    this.updateTop();
    this.spawnWave(G.wave);
  },
  spawnWave(w) {
    G.enemies = [];
    const spec = WAVES[w - 1];
    let idx = 0;
    for (const [kind, n] of spec.list) {
      for (let i = 0; i < n; i++) {
        const e = makeEnemy(kind, w);
        const row = (idx + Math.floor(Math.random() * 2)) % 4;
        e.x = 1200 + Math.random() * 40;
        e.y = 120 + row * 96 + (Math.random() * 20 - 10);
        G.enemies.push(e);
        this.time.delayedCall(idx * 350, () => {
          if (G.phase !== 'battle') return;
          this.spawnUnitSprite(e);
          e.sprite.setFlipX(true);
          e.sprite.setScale(this.unitScale(e));
          this.setUnitFrame(e, 'idle0');
          this.syncHpBar(e);
          this.spawnParticles(e.x, e.y, 0x8b3fd9, 8, 100);
          if (e.isBoss) this.bossIntro();
        });
        idx++;
      }
    }
  },
  advanceWave() { // 新一波推进（endWave / pickHex / closeRelicShop 三处共用）
    G.wave += 1; G.rerolls = 0;
    G.freeDice = true; G.rested = false; // 新一波：免费骰子回满，本波休整次数重置
    G.towerCd = 0; // M6：塔攻击冷却过波清零
    G.bellUsed = false; G.previewFace = null; // M4：铃与预见过波清空
    if (G.buffs.ddFree) G.freeReroll = 1; // DD街区：新一波一次免费刷新
    this.refreshShop();
    G.phase = 'prep';
    this.ui.startBtn.setVisible(true); this.ui.startTxt.setVisible(true);
    this.saveGame();
    this.updateTop();
  },
  endWave(win) {
    if (G.phase !== 'battle') return;
    G.phase = 'settle';
    if (!win) { this.gameOver(false); return; }
    const interest = Math.min(G.interestCap, Math.floor(G.gold / 10));
    const gain = G.baseGold + 2 + interest;
    G.gold += gain;
    if (G.stats) G.stats.goldEarned += gain;
    SFX.coin();
    this.floatText(GW / 2, 200, '第 ' + G.wave + ' 波胜利！+' + gain + '金（基础' + G.baseGold + ' 胜利2 利息' + interest + '）', '#e3cf9e', 18);
    // M5 §9：胜利后先弹战绩面板，关了再走 M6 二选一 / 第 5 波结算
    this.time.delayedCall(1200, () => {
      if (G.phase !== 'settle') return;
      // 快照本波排行（单位死后进 fallen，数字还在）
      G.lastWaveRank = [...G.field, ...G.fallen]
        .filter(u => u && ((u.dmgDealtWave || 0) > 0 || (u.dmgTakenWave || 0) > 0))
        .map(u => ({ name: u.name, tex: u.tex, isElite: !!u.isElite, star: u.star, dmgDealt: u.dmgDealtWave || 0, dmgTaken: u.dmgTakenWave || 0 }));
      if (G.wave === 5) this.showRankPanel(() => this.gameOver(true));
      else this.showRankPanel(() => this.showWinChoice());
    });
  },
  afterWinContinue() { // 二选一之后：波 3 海克斯 / 波 2·4 遗物铺 / 其余直接推进
    if (G.wave === 3) { this.showHex(); return; }
    if ((G.wave === 2 || G.wave === 4) && this.showRelicShop()) return; // 有遗物可买就弹铺，否则直接推进
    this.advanceWave();
  },
  showWinChoice() {
    const ch = this.ui.choiceBox;
    if (!ch) { this.afterWinContinue(); return; }
    const alive = [...G.field, ...G.bench].filter(u => u && u.alive).length;
    const dead = G.fallen.length;
    ch._title.setText('第 ' + G.wave + ' 波胜利！');
    ch._status.setText(
      '水晶塔 ' + G.towerHp + '/' + G.towerMax + '　存活 ' + alive + ' 个　阵亡 ' + dead + ' 个\n' +
      '继续：带残血进下一波（死棋、塔血原样）\n' +
      '撤退：免费回满血 + 阵亡复活，塔血不回\n' +
      '奖励照常拿（海克斯 / 遗物不跳过）');
    ch.setVisible(true);
  },
  chooseContinue() {
    if (this.ui.choiceBox) this.ui.choiceBox.setVisible(false);
    this.afterWinContinue();
  },
  chooseRetreat() { // M6 撤退：免费休整（全队回满 + 阵亡满血复活，塔血不回），奖励照常
    if (this.ui.choiceBox) this.ui.choiceBox.setVisible(false);
    this.healAllUnits();
    this.reviveFallen(1);
    SFX.starup();
    this.floatText(GW / 2, 200, '撤退休整完毕！', '#6fb7d9', 18);
    this.saveGame();
    this.updateTop();
    this.afterWinContinue();
  },
  gameOver(win) {
    G.phase = 'over';
    saveBest(G.wave);
    clearSave();
    if (win) { // 胜利姿势
      for (const u of [...G.field]) if (u.alive && u.sprite) this.setUnitFrame(u, 'win');
    }
    const secs = G.stats ? Math.floor((Date.now() - G.stats.startTime) / 1000) : 0;
    const stats = '用时 ' + Math.floor(secs / 60) + '分' + (secs % 60) + '秒　击杀 ' + (G.stats ? G.stats.kills : 0) + '　获得金币 ' + (G.stats ? G.stats.goldEarned : 0) + '\n最高波次 ' + loadBest() + ' / 5　等级 Lv' + G.level + '　海克斯 ' + G.hexesTaken.length + ' 个\n塔伤害 ' + G.towerStats.dmg + '　塔击杀 ' + G.towerStats.kills;
    this.ui.endBox._title.setText(win ? '胜利！' : '失败…').setColor(win ? '#c9a227' : '#a83232');
    this.ui.endBox._stats.setText((win ? '你守住了 5 波进攻，军团无敌！' : '塔被攻破了，军团覆灭…') + '\n' + stats);
    this.ui.endBox.setVisible(true);
    if (win) SFX.win(); else SFX.lose();
  }
});

/* ============================================================
   暂停 / 回主菜单 / 存档读档
   ============================================================ */
Object.assign(GameScene.prototype, {
  shake(dur, intensity) { if (SETTINGS.shake) this.cameras.main.shake(dur, intensity); },
  pauseGame() {
    if (G.phase === 'over' || G.paused) return;
    G.paused = true;
    this.ui.pauseOverlay.setVisible(true);
    this.tweens.pauseAll();
    this.time.paused = true;
    BGM.paused = true;
    if (SFX.ctx && SFX.ctx.state === 'running') SFX.ctx.suspend();
  },
  resumeGame() {
    G.paused = false;
    this.ui.pauseOverlay.setVisible(false);
    this.tweens.resumeAll();
    this.time.paused = false;
    BGM.paused = false;
    if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
  },
  quitToMenu() {
    this.saveGame();
    G.paused = false;
    this.tweens.resumeAll();
    this.time.paused = false;
    BGM.paused = false;
    this.scene.stop('Game');
    this.scene.start('Menu');
  },
  saveGame() {
    if (G.phase === 'over' || G.phase === 'battle') return; // 只在备战/结算间隙存
    const snap = {
      wave: G.wave, gold: G.gold, level: G.level, xp: G.xp, xpNeed: G.xpNeed,
      towerHp: G.towerHp, towerMax: G.towerMax, towerUpg: { ...G.towerUpg }, towerStats: { ...G.towerStats },
      buffs: G.buffs, hexesTaken: G.hexesTaken, packPity: G.packPity,
      field: G.field.map(u => snapUnit(u)), bench: G.bench.map(u => u ? snapUnit(u) : null),
      fallen: G.fallen.map(u => snapUnit(u)), rested: G.rested || false, freeDice: !!G.freeDice,
      relics: [...G.relics], bellUsed: !!G.bellUsed, // M4（previewFace 是瞬态，不进存档）
      shop: G.shop, enchHeld: G.enchHeld || null, shopEnch: G.shopEnch || null, freeReroll: G.freeReroll || 0
    };
    try { localStorage.setItem('syjt_save_v1', JSON.stringify(snap)); } catch (e) {}
  },
  loadSave() {
    const snap = loadSave();
    this.resetGame();
    if (!snap) return;
    // 移除开局赠送的两个单位
    for (const u of [...G.bench]) if (u) this.destroyUnitVisual(u);
    G.bench = [null, null, null, null, null];
    G.field = [];
    Object.assign(G, {
      wave: snap.wave, gold: snap.gold, level: snap.level, xp: snap.xp, xpNeed: snap.xpNeed,
      towerHp: snap.towerHp, buffs: snap.buffs || {}, hexesTaken: snap.hexesTaken || [], packPity: snap.packPity || 0,
      rested: snap.rested || false, freeDice: snap.freeDice !== undefined ? !!snap.freeDice : true,
      relics: snap.relics || [], bellUsed: !!snap.bellUsed // M4（previewFace 不进存档，读档时清空——resetGame 已置 null）
    });
    G.shop = snap.shop && snap.shop.length ? snap.shop : G.shop;
    // M6：塔强化 / 塔统计（旧存档缺字段按全 0；塔血上限按强化重算，快照塔血不超上限）
    G.towerUpg = snap.towerUpg
      ? { atk: snap.towerUpg.atk || 0, aspd: snap.towerUpg.aspd || 0, range: snap.towerUpg.range || 0, hp: snap.towerUpg.hp || 0 }
      : { atk: 0, aspd: 0, range: 0, hp: 0 };
    G.towerStats = snap.towerStats ? { dmg: snap.towerStats.dmg || 0, kills: snap.towerStats.kills || 0 } : { dmg: 0, kills: 0 };
    G.towerMax = 100 + 25 * G.towerUpg.hp;
    G.towerHp = Math.min(snap.towerHp !== undefined ? snap.towerHp : 100, G.towerMax);
    G.towerCd = 0;
    G.enchHeld = snap.enchHeld || null;
    G.shopEnch = snap.shopEnch || null;
    G.freeReroll = snap.freeReroll || 0;
    (snap.field || []).forEach(su => {
      const u = restoreUnit(su);
      const pt = cellCenter(su.cell.c, su.cell.r);
      G.field.push(u); u.cell = su.cell; u.x = pt.x; u.y = pt.y;
      this.spawnUnitSprite(u);
      u.sprite.setScale(this.unitScale(u)); this.setUnitFrame(u, 'idle0');
      this.refreshStars(u);
      this.refreshEnchVisual(u);
      this.syncUnitVisual(u);
    });
    (snap.bench || []).forEach((su, i) => {
      if (!su) return;
      const u = restoreUnit(su);
      G.bench[i] = u; u.cell = null; u.x = 496 + i * 58; u.y = 666;
      this.spawnUnitSprite(u);
      u.sprite.setScale(this.unitScale(u)); this.setUnitFrame(u, 'idle0');
      this.refreshStars(u);
      this.refreshEnchVisual(u);
      this.syncUnitVisual(u);
    });
    (snap.fallen || []).forEach(su => {
      if (!su || !su.cell) return;
      const u = restoreUnit(su);
      u.alive = false; u.hp = 0; u.cell = su.cell;
      const pt = cellCenter(su.cell.c, su.cell.r);
      u.x = pt.x; u.y = pt.y;
      G.fallen.push(u);
    });
    this.renderShop();
    this.renderEnchBar();
    this.renderRelicRow();
    this.updateTop();
  }
});

/* ============================================================
   主菜单
   ============================================================ */
class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  preload() {
    // M5 P2：主菜单也用田园背景 + 64 级精灵剪影（GameScene 会再加载一次，纹理已缓存时跳过）
    this.load.image('fieldbg', 'assets/p2/fieldbg-pastoral.png');
    this.load.spritesheet('warrior64', 'assets/warrior-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('archer64', 'assets/archer-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('mage64', 'assets/mage-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('slime64', 'assets/slime-64.png', { frameWidth: 64, frameHeight: 64 });
    this.load.spritesheet('bat64', 'assets/bat-64.png', { frameWidth: 64, frameHeight: 64 });
  }
  create() {
    buildAllTextures(this);
    // M5 P2：田园背景（白天牧场），回退旧夜色
    if (this.textures.exists('fieldbg')) this.add.image(0, 0, 'fieldbg').setOrigin(0, 0);
    else {
      this.add.rectangle(0, 0, GW, GH, 0x14101c).setOrigin(0, 0);
      this.add.circle(1080, 110, 46, 0xe3cf9e);
      this.add.circle(1066, 100, 40, 0x14101c); // 月牙
      this.add.rectangle(0, 420, GW, 320, 0x1e5233).setOrigin(0, 0);
    }
    // 草地 + 剪影棋子来回走动（M5 P2：64 级精灵表，深色剪影）
    const keys = this.textures.exists('warrior64')
      ? ['warrior64', 'archer64', 'mage64', 'slime64', 'bat64']
      : ['warrior_idle0', 'archer_idle0', 'mage_idle0', 'slime_idle0', 'bat_idle0'];
    for (let i = 0; i < 5; i++) {
      const s = this.add.image(150 + i * 220, 560, keys[i], 0).setScale(this.textures.exists('warrior64') ? 1.5 : 2.5).setTint(0x241f30).setAlpha(0.85);
      this.tweens.add({ targets: s, x: s.x + 40, duration: 2600 + i * 300, yoyo: true, repeat: -1 });
    }
    // LOGO（M5 P2：深棕字 + 金描边，亮底上可读）
    this.add.text(GW / 2, 150, '噬运军团', { fontSize: '72px', color: '#3a2a1c', fontFamily: FONT, fontStyle: 'bold', stroke: '#c9a227', strokeThickness: 8 }).setOrigin(0.5);
    this.add.text(GW / 2, 215, '像素自走棋 · 吞噬进化', { fontSize: '20px', color: '#3a2a1c', fontFamily: FONT }).setOrigin(0.5);
    // 按钮
    const hasSave = !!loadSave();
    const best = loadBest();
    menuBtn(this, GW / 2, 320, 260, 52, '开始游戏', () => { clearSave(); this.scene.start('Game'); }, 22);
    const cont = menuBtn(this, GW / 2, 390, 260, 52, '继续', () => { CONTINUE_RUN = true; this.scene.start('Game'); }, 22);
    if (!hasSave) { cont.bg.setAlpha(0.4); cont.txt.setAlpha(0.4); cont.bg.disableInteractive(); }
    menuBtn(this, GW / 2, 460, 260, 52, '玩法说明', () => this._howto.setVisible(true), 22);
    menuBtn(this, GW / 2, 530, 260, 52, '设置', () => this._settings.setVisible(true), 22);
    this.add.text(GW / 2, 600, best > 0 ? '最高波次：第 ' + best + ' 波 / 5' : '最高波次：—', { fontSize: '16px', color: '#3a2a1c', fontFamily: FONT }).setOrigin(0.5);
    this.add.text(GW - 16, GH - 16, 'v0.9', { fontSize: '14px', color: '#6e4f3a', fontFamily: FONT }).setOrigin(1, 1);
    this._settings = createSettingsOverlay(this, 60);
    this._howto = createHowToOverlay(this, 60);
    this.input.on('pointerdown', () => SFX.ac());
  }
}

/* ============================================================
   启动
   ============================================================ */
const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: GW,
  height: GH,
  backgroundColor: '#241f2e',
  pixelArt: true,
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [MenuScene, GameScene]
};
/* M5 P2：等像素字体就绪再开游戏（否则首屏文字回退 monospace）；2s 超时兜底 */
window.addEventListener('load', () => {
  const start = () => { new Phaser.Game(config); };
  if (document.fonts && document.fonts.load) {
    let done = false;
    const to = setTimeout(() => { if (!done) { done = true; start(); } }, 2000);
    document.fonts.load('24px "Fusion Pixel 12px"').then(() => {
      if (!done) { done = true; clearTimeout(to); start(); }
    }).catch(() => { if (!done) { done = true; clearTimeout(to); start(); } });
  } else start();
});
</script>
